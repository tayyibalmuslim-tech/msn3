<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الموديلات والمخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== لوحة ألوان هادئة — رمادي دافئ + أزرق مطفي ===== */
  --bg:#F5F6F4;
  --surface:#FFFFFF;
  --surface-2:#FAFBF9;
  --surface-3:#F1F3F0;
  --ink:#22262B;
  --ink-soft:#5D666F;
  --ink-faint:#8E969F;
  --line:#E7EAE6;
  --line-strong:#D2D7D1;

  --indigo:#3D5A80;
  --indigo-dark:#2C4460;
  --indigo-soft:#EEF2F7;
  --indigo-tint:rgba(61,90,128,.10);

  --ok:#157F5F;
  --ok-soft:#E8F4EF;
  --warn:#B0453A;
  --warn-soft:#FAEDEB;
  --amber:#A8700F;
  --amber-soft:#FBF3E4;

  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --radius:12px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(34,38,43,.04);
  --shadow:0 2px 10px rgba(34,38,43,.05);
  --shadow-lg:0 16px 40px rgba(34,38,43,.13);

  --sidebar:236px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', -apple-system, 'Segoe UI', sans-serif;
  font-size:15px;
  line-height:1.7;
  min-height:100vh;
  padding-bottom:40px;
  -webkit-font-smoothing:antialiased;
}

/* ===== التخطيط: شريط جانبي ثابت + منطقة محتوى ===== */
.app{
  max-width:1440px; margin:0 auto; padding:0 28px 40px;
  display:grid;
  grid-template-columns:var(--sidebar) minmax(0,1fr);
  column-gap:28px;
  align-items:start;
}

/* ===== شريط المستخدم ===== */
.user-bar{
  grid-column:1 / -1;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 2px 12px; font-size:13px; color:var(--ink-faint);
}
.user-bar button{
  background:transparent; border:1px solid var(--line-strong); border-radius:8px;
  padding:6px 16px; min-height:34px; font-size:13px; font-weight:600;
  cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:all .15s;
}
.user-bar button:hover{border-color:var(--warn); color:var(--warn); background:var(--warn-soft);}

/* ===== الهيدر ===== */
header.top{
  grid-column:1 / -1;
  display:flex; justify-content:space-between; align-items:center;
  padding:0 0 20px; margin-bottom:24px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap; gap:20px;
}
header.top .brand{display:flex; align-items:center; gap:13px;}
header.top .tag{
  width:38px; height:38px; border-radius:10px;
  background:var(--indigo);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:17px; color:#fff;
  flex-shrink:0;
}
header.top h1{font-size:18px; font-weight:700; letter-spacing:-.2px; line-height:1.35;}
header.top .sub{font-size:12.5px; color:var(--ink-faint); margin-top:-2px;}
header.top .stats{display:flex; gap:28px; flex-wrap:wrap; align-items:center;}
header.top .stats > div{text-align:center; min-width:92px;}
header.top .stats .num{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:24px; font-weight:600; color:var(--ink); line-height:1.2;
}
header.top .stats .lbl{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

/* ===== التنقل: شريط جانبي عمودي ===== */
nav.tabs{
  grid-column:1; grid-row:3;
  display:flex; flex-direction:column; gap:3px;
  position:sticky; top:20px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px;
  box-shadow:var(--shadow-sm);
}
nav.tabs button{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:start;
  padding:10px 13px; min-height:42px;
  background:transparent; border:none;
  border-radius:var(--radius-sm);
  color:var(--ink-soft); font-size:14px; font-weight:600;
  cursor:pointer; transition:background .14s, color .14s; font-family:inherit;
  line-height:1.4;
}
nav.tabs button:hover{background:var(--surface-3); color:var(--ink);}
nav.tabs button.active{
  background:var(--indigo-soft); color:var(--indigo); box-shadow:none;
}
nav.tabs button .count{
  margin-inline-start:auto;
  display:inline-block; background:var(--surface-3); color:var(--ink-soft);
  border-radius:999px; padding:1px 9px; font-size:12px; font-weight:600;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
nav.tabs button.active .count{background:var(--indigo); color:#fff;}

/* الأزرار العامة بشكل حبّة (خارج الشريط الجانبي) */
.tab-btn{
  padding:9px 18px; min-height:40px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink-soft); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .15s; font-family:inherit;
  display:inline-flex; align-items:center; gap:7px;
}
.tab-btn:hover{border-color:var(--line-strong); color:var(--ink);}
.tab-btn.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}
.tab-btn .count{
  display:inline-block; background:var(--indigo-tint); color:var(--indigo);
  border-radius:999px; padding:1px 9px; font-size:12px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.tab-btn.active .count{background:rgba(255,255,255,.22); color:#fff;}

section.view{grid-column:2; grid-row:3; display:none; min-width:0;}
section.view.active{display:block; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
}

/* ===== البطاقات ===== */
.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px 28px; margin-bottom:20px; box-shadow:var(--shadow-sm);
}
.panel h2{
  font-size:16px; font-weight:700; margin-bottom:22px; color:var(--ink);
  display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;
  padding-bottom:15px; border-bottom:1px solid var(--line);
}
.panel h2 .title-txt{display:flex; align-items:center; gap:9px;}

/* ===== الحقول ===== */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:18px;}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:2px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field input, .field select{
  padding:10px 13px; min-height:42px;
  border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  font-size:15px; background:var(--surface-2); color:var(--ink);
  font-family:inherit; transition:border-color .15s, box-shadow .15s, background .15s;
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--indigo); background:var(--surface);
  box-shadow:0 0 0 3px var(--indigo-tint);
}
.field input::placeholder{color:var(--ink-faint);}
.field .hint, .hint{font-size:12.5px; color:var(--ink-faint); line-height:1.65;}

/* ===== الأزرار ===== */
button.btn{
  padding:10px 20px; min-height:42px; border:1px solid transparent; border-radius:var(--radius-sm);
  background:var(--indigo); color:#fff; font-size:14.5px; font-weight:600;
  cursor:pointer; transition:background .15s, transform .1s; font-family:inherit;
}
button.btn:hover{background:var(--indigo-dark);}
button.btn:active{transform:scale(.985);}
button.btn:focus-visible{outline:3px solid var(--indigo-tint); outline-offset:2px;}
button.btn.brass{background:var(--indigo);}
button.btn.brass:hover{background:var(--indigo-dark);}
button.btn.ghost{background:var(--surface); color:var(--ink-soft); border-color:var(--line-strong);}
button.btn.ghost:hover{border-color:var(--indigo); color:var(--indigo); background:var(--indigo-soft);}
button.btn.danger{background:var(--warn);}
button.btn.danger:hover{background:#963A30;}
button.btn.small{padding:7px 15px; min-height:36px; font-size:13.5px;}
button.btn.full{width:100%;}

/* ===== صفوف الموظفين والمراحل ===== */
.emp-row, .stage-row{
  display:grid; gap:16px; align-items:end; margin-bottom:12px;
  padding:18px 20px; background:var(--surface-2);
  border-radius:var(--radius-sm); border:1px solid var(--line);
}
.emp-row{grid-template-columns:1.4fr 1fr 1fr auto;}
.emp-split-wrap{grid-column:1/-1;}

.color-card{
  padding:18px 20px; background:var(--surface-2); border-radius:var(--radius-sm);
  border:1px solid var(--line); margin-bottom:12px;
}
.color-card .color-top{display:grid; grid-template-columns:1fr 120px auto; gap:14px; align-items:end; margin-bottom:14px;}
.size-row{display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; margin-bottom:10px;}
.size-row select, .size-row input{
  padding:9px 12px; min-height:40px; border:1px solid var(--line-strong);
  border-radius:8px; font-size:14px; font-family:inherit; background:var(--surface); color:var(--ink);
}
.color-card .size-total{font-size:12.5px; color:var(--ink-faint); margin-top:6px;}
.swatch{
  width:20px; height:20px; border-radius:6px; border:1px solid var(--line-strong);
  display:inline-block; vertical-align:middle; margin-inline-end:7px;
}

/* ===== بطاقات الموديلات ===== */
.model-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:18px;}
.model-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:box-shadow .18s, border-color .18s;
}
.model-card:hover{box-shadow:var(--shadow); border-color:var(--line-strong);}
.model-card .head{
  background:var(--surface-2); color:var(--ink); padding:16px 20px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-bottom:1px solid var(--line);
}
.model-card .head h3{font-size:15.5px; font-weight:700; line-height:1.4;}
.model-card .head .price{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  color:var(--indigo); font-size:14px; font-weight:600;
  background:var(--surface); padding:4px 12px; border-radius:999px;
  white-space:nowrap; border:1px solid var(--line);
}
.model-card .body{padding:18px 20px;}
.model-card .colors{display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap;}
.color-chip{
  font-size:12.5px; padding:4px 11px; border-radius:999px;
  background:var(--surface-3); border:1px solid transparent;
  display:flex; align-items:center; gap:6px; color:var(--ink-soft);
}
.color-chip .swatch{width:13px; height:13px; margin:0; border-radius:4px;}
.progress-track{height:8px; background:var(--surface-3); border-radius:999px; overflow:hidden; margin:12px 0 6px;}
.progress-fill{height:100%; background:var(--indigo); border-radius:999px; transition:width .35s ease;}
.model-card .meta{
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  font-size:13px; color:var(--ink-soft); margin-top:10px;
}
.stage-dots{display:flex; gap:4px; margin-top:14px;}
.stage-dot{flex:1; height:5px; border-radius:999px; background:var(--surface-3);}
.stage-dot.done{background:var(--ok);}
.stage-dot.active{background:var(--indigo);}

/* ===== تفاصيل الموديل ===== */
.model-detail-header{
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:22px; flex-wrap:wrap; gap:16px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px 26px; box-shadow:var(--shadow-sm);
}
.model-detail-header h2{font-size:22px; font-weight:700; color:var(--ink); line-height:1.4;}
.model-detail-header .price-tag{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  background:var(--indigo-soft); color:var(--indigo); border:1px solid #D5DFEB;
  padding:8px 18px; border-radius:999px; font-size:15px; font-weight:600;
  white-space:nowrap;
}
.back-btn{
  display:inline-flex; align-items:center; gap:7px; min-height:38px;
  color:var(--ink-soft); font-size:14px; cursor:pointer; margin-bottom:12px; font-weight:600;
  transition:color .15s;
}
.back-btn:hover{color:var(--indigo);}

.stage-tabs{
  display:flex; gap:6px; overflow-x:auto; margin-bottom:22px; padding:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
}
.stage-tab{
  padding:9px 17px; min-height:40px; white-space:nowrap;
  background:transparent; border:none; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  display:inline-flex; align-items:center; transition:all .15s;
}
.stage-tab:hover{background:var(--surface-3); color:var(--ink);}
.stage-tab.active{background:var(--indigo-soft); color:var(--indigo);}
.stage-tab.done-marker::after{content:' ✓'; color:var(--ok); margin-inline-start:5px;}
.stage-tab.active.done-marker::after{color:var(--ok);}

/* ===== الجداول ===== */
table.data-table{width:100%; border-collapse:collapse; font-size:14px;}
table.data-table th{
  text-align:right; padding:11px 14px; background:transparent;
  color:var(--ink-faint); font-size:12px; font-weight:700;
  border-bottom:1px solid var(--line-strong);
}
table.data-table td{padding:13px 14px; border-bottom:1px solid var(--line);}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr:hover{background:var(--surface-2);}
table.data-table tfoot td{font-weight:700; background:var(--surface-2); border-top:2px solid var(--line-strong);}

.empty-state{text-align:center; padding:60px 24px; color:var(--ink-faint);}
.empty-state .icon{font-size:40px; margin-bottom:14px; opacity:.5;}
.empty-state p{font-size:14.5px;}

.badge{
  display:inline-block; padding:3px 11px; border-radius:6px;
  font-size:12px; font-weight:600; white-space:nowrap;
}
.badge.ok{background:var(--ok-soft); color:var(--ok);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.badge.pending{background:var(--surface-3); color:var(--ink-faint);}
.badge.internal{background:var(--indigo-soft); color:var(--indigo);}
.badge.external{background:var(--amber-soft); color:var(--amber);}

/* ===== ملخص التكلفة ===== */
.cost-summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-top:6px;}
.cost-item{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:18px 16px; text-align:center;
}
.cost-item .lbl{font-size:12px; color:var(--ink-faint); margin-bottom:7px;}
.cost-item .val{
  font-size:22px; font-weight:600; color:var(--ink);
  font-family:var(--mono); font-variant-numeric:tabular-nums; line-height:1.3;
}
.cost-item.profit{background:var(--ok-soft); border-color:#CDE6DB;}
.cost-item.profit .val{color:var(--ok);}
.cost-item.profit.negative{background:var(--warn-soft); border-color:#EFD7D3;}
.cost-item.profit.negative .val{color:var(--warn);}

.cost-breakdown{margin-top:6px;}
.cost-breakdown .line{
  display:flex; justify-content:space-between; gap:12px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;
}
.cost-breakdown .line span:last-child{
  font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cost-breakdown .line.total{
  font-weight:700; font-size:15.5px; border-bottom:none;
  border-top:2px solid var(--line-strong); margin-top:6px; padding-top:14px;
}

/* ===== النوافذ المنبثقة ===== */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(34,38,43,.42);
  z-index:100; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
  backdrop-filter:blur(3px);
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--bg); border-radius:16px; max-width:720px; width:100%;
  max-height:88vh; overflow-y:auto; padding:28px 30px; box-shadow:var(--shadow-lg);
}
.modal h3{font-size:18px; font-weight:700; margin-bottom:22px; color:var(--ink);}
.modal-close{
  float:left; background:var(--surface); border:1px solid var(--line);
  width:34px; height:34px; border-radius:8px;
  font-size:16px; cursor:pointer; color:var(--ink-soft); line-height:1;
  transition:all .15s;
}
.modal-close:hover{background:var(--warn-soft); color:var(--warn); border-color:#EFD7D3;}

.edit-modal-overlay{
  position:fixed; inset:0; background:rgba(34,38,43,.42);
  display:none; align-items:center; justify-content:center;
  z-index:200; padding:20px; backdrop-filter:blur(3px);
}
.modal-box{
  background:var(--surface); border-radius:16px; padding:26px 28px;
  width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
  box-shadow:var(--shadow-lg);
}

/* ===== الزرار العائم والتنبيهات ===== */
.fab{
  position:fixed; bottom:28px; left:28px; z-index:50;
  width:54px; height:54px; border-radius:50%;
  background:var(--indigo); color:#fff; border:none;
  font-size:26px; cursor:pointer; box-shadow:0 6px 20px rgba(61,90,128,.32);
  display:flex; align-items:center; justify-content:center;
  transition:transform .16s, background .16s;
}
.fab:hover{background:var(--indigo-dark); transform:scale(1.06);}

.toast{
  position:fixed; bottom:28px; right:28px; z-index:300;
  background:var(--ink); color:#fff; padding:13px 22px; border-radius:var(--radius-sm);
  font-size:14px; font-weight:500; box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(12px); transition:all .25s; pointer-events:none;
  max-width:calc(100vw - 56px);
}
.toast.show{opacity:1; transform:translateY(0);}

.row-actions{display:flex; gap:6px;}
.icon-btn{
  background:transparent; border:1px solid transparent; cursor:pointer;
  font-size:15px; padding:7px 9px; border-radius:8px;
  min-width:36px; min-height:36px; transition:background .14s, border-color .14s;
}
.icon-btn:hover{background:var(--surface-3); border-color:var(--line);}

.section-divider{
  display:flex; align-items:center; gap:12px; margin:28px 0 16px;
  font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.4px;
}
.section-divider::after{content:''; flex:1; height:1px; background:var(--line);}

.rate-card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px 20px; display:flex; justify-content:space-between; align-items:center;
  gap:16px; margin-bottom:10px; flex-wrap:wrap;
}
.rate-card .dept-name{font-weight:700; font-size:15px;}
.rate-card .dept-pct{font-size:12.5px; color:var(--ink-faint); margin-top:2px; line-height:1.6;}
.rate-card .rate-val{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:21px; font-weight:600; color:var(--indigo); line-height:1.3;
}
.rate-card .rate-lbl{font-size:11.5px; color:var(--ink-faint);}

.dept-stage-box{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px; background:var(--surface-2);
}
.dept-stage-box.internal{border-color:#CDD9E7; background:#FBFCFE;}
.dept-stage-box.external{border-color:#E8D9BC; background:#FEFCF7;}

/* ===== شاشة الدخول ===== */
#loginScreen{
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;
}
#loginScreen.hidden{display:none;}
.login-box{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:38px 34px; width:100%; max-width:410px; box-shadow:var(--shadow);
}
.login-box h2{font-size:21px; font-weight:700; margin-bottom:6px; color:var(--ink);}
.login-box .sub{font-size:13.5px; color:var(--ink-faint); margin-bottom:28px;}
.login-box .field{margin-bottom:16px;}
.login-box .err{color:var(--warn); font-size:13px; margin-top:12px; min-height:18px;}
#appRoot.hidden{display:none;}

.locked-msg{
  padding:44px 24px; text-align:center; color:var(--ink-faint); font-size:14.5px;
  background:var(--surface); border:1px dashed var(--line-strong);
  border-radius:var(--radius); margin:14px 0;
}
.perm-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14.5px;
}
.perm-row:last-child{border-bottom:none;}
.perm-row select{
  width:180px; padding:8px 12px; min-height:40px;
  border:1px solid var(--line-strong); border-radius:8px;
  font-family:inherit; font-size:14px; background:var(--surface-2); color:var(--ink);
}
.perm-row select:focus{outline:none; border-color:var(--indigo); background:var(--surface); box-shadow:0 0 0 3px var(--indigo-tint);}

/* ===== الحضور والانصراف ===== */
.attendance-days-scroll{
  display:flex; gap:6px; overflow-x:auto; padding:4px 2px 12px;
}
.attendance-day-btn{
  flex:0 0 auto; min-width:56px; min-height:56px; padding:9px 8px;
  border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--surface); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:15px; font-weight:600; color:var(--ink-soft); transition:all .14s;
}
.attendance-day-btn:hover{border-color:var(--line-strong); background:var(--surface-2); color:var(--ink);}
.attendance-day-btn.active{
  border-color:var(--indigo); background:var(--indigo); color:#fff;
}
.attendance-day-btn .d-num{font-size:16px; line-height:1.2;}
.attendance-day-btn .d-mark{font-size:10px; white-space:nowrap; font-family:inherit;}

.att-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:18px; flex-wrap:wrap; padding:16px 0; border-bottom:1px solid var(--line);
}
.att-row:last-child{border-bottom:none;}
.att-name{font-weight:600; font-size:15px; min-width:140px;}
.att-controls{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.att-status-btns{display:flex; gap:6px; background:var(--surface-3); padding:4px; border-radius:10px;}
.att-status-btn{
  border:none; background:transparent; border-radius:7px;
  padding:8px 18px; min-height:38px; font-size:13.5px; font-weight:600;
  cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:all .15s;
}
.att-status-btn:hover:not(:disabled){background:var(--surface); color:var(--ink);}
.att-status-btn.present.active{background:var(--ok); color:#fff;}
.att-status-btn.absent.active{background:var(--warn); color:#fff;}
.att-status-btn.friday.active{background:var(--indigo); color:#fff;}
.att-status-btn:disabled{opacity:.5; cursor:default;}
.att-times{display:flex; gap:14px; flex-wrap:wrap;}
.att-time-field{display:flex; flex-direction:column; gap:5px;}
.att-time-field label{font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.att-time-input-wrap{display:flex; align-items:center; gap:6px;}
.att-time-input-wrap input[type="time"]{
  padding:8px 12px; min-height:40px; font-size:14.5px; width:130px;
  border:1px solid var(--line-strong); border-radius:8px;
  font-family:var(--mono); background:var(--surface-2); color:var(--ink);
}
.att-time-input-wrap input[type="time"]:focus{
  outline:none; border-color:var(--indigo); background:var(--surface); box-shadow:0 0 0 3px var(--indigo-tint);
}

/* ===== الشهر والأرباح: التقويم ===== */
.cal-toolbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:20px;
}
.month-nav{display:flex; align-items:center; gap:8px;}
.month-nav button{
  width:36px; height:36px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); cursor:pointer; font-size:15px; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.month-nav button:hover{border-color:var(--indigo); color:var(--indigo); background:var(--indigo-soft);}
.mlabel{font-size:16px; font-weight:700; min-width:130px; text-align:center;}
.seg{display:flex; gap:4px; flex-wrap:wrap; background:var(--surface-3); padding:4px; border-radius:10px;}
.seg button{
  padding:7px 15px; min-height:36px; border-radius:7px; border:none;
  background:transparent; font-size:13px; font-weight:600; color:var(--ink-soft);
  cursor:pointer; font-family:inherit; transition:all .15s;
}
.seg button:hover{background:var(--surface); color:var(--ink);}
.seg button.on{background:var(--indigo); color:#fff;}

.mini-note{
  background:var(--indigo-soft); border-inline-start:3px solid var(--indigo);
  border-radius:var(--radius-sm); padding:14px 18px; margin:18px 0;
  font-size:13.5px; line-height:1.8; color:var(--ink-soft);
}
.mini-note.warn{background:var(--amber-soft); border-inline-start-color:var(--amber);}

.dept-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(215px,1fr)); gap:14px; margin-top:18px;}
.dept-tile{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px;
}
.dt-name{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-weight:700; font-size:14.5px; margin-bottom:10px;
}
.dt-row{
  display:flex; justify-content:space-between; gap:10px;
  font-size:12.5px; padding:5px 0; color:var(--ink-soft);
}
.dt-row b{color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums;}
.dt-row b.pos{color:var(--ok);}
.dt-row b.neg{color:var(--warn);}
.dt-row b.idle{color:var(--amber);}
.util-bar{height:6px; background:var(--surface-3); border-radius:999px; overflow:hidden; margin-top:12px;}
.util-bar i{display:block; height:100%; border-radius:999px; transition:width .3s;}

.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
.cal-hd{
  text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-faint);
  padding:6px 0;
}
.cal-day{
  min-height:78px; border:1px solid var(--line); border-radius:9px;
  padding:8px 9px; cursor:pointer; background:var(--surface);
  display:flex; flex-direction:column; gap:2px; transition:all .14s;
}
.cal-day:hover{border-color:var(--line-strong); background:var(--surface-2);}
.cal-day.blank{border:none; background:transparent; cursor:default;}
.cal-day.today{border-color:var(--indigo); box-shadow:inset 0 0 0 1px var(--indigo);}
.cal-day.sel{background:var(--indigo-soft); border-color:var(--indigo);}
.cal-day.pos{background:#F4FAF7;}
.cal-day.neg{background:#FDF6F5;}
.dnum{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.dnet{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:700;}
.dnet.pos{color:var(--ok);}
.dnet.neg{color:var(--warn);}
.dsub{font-size:10px; color:var(--ink-faint);}
.plan{font-size:10px; color:var(--indigo); margin-top:auto;}
.ubar{height:3px; background:var(--surface-3); border-radius:999px; overflow:hidden; margin-top:auto;}
.ubar i{display:block; height:100%;}

.cal-legend{
  display:flex; gap:18px; flex-wrap:wrap; margin-top:16px;
  font-size:12px; color:var(--ink-faint);
}
.cal-legend span{display:flex; align-items:center; gap:6px;}
.cal-legend i{
  width:12px; height:12px; border-radius:4px; border:1px solid var(--line-strong); display:inline-block;
}

/* ===== الرسوم البيانية ===== */
.chart-box{margin-bottom:28px;}
.chart-box:last-child{margin-bottom:0;}
.chart-box h3{font-size:14.5px; font-weight:700; margin-bottom:4px;}
.csub{font-size:12.5px; color:var(--ink-faint); margin-bottom:14px; line-height:1.7;}
.chart-empty{
  padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;
  background:var(--surface-2); border-radius:var(--radius-sm);
}
.chart-legend{
  display:flex; gap:18px; flex-wrap:wrap; margin-top:12px;
  font-size:12px; color:var(--ink-soft);
}
.chart-legend span{display:flex; align-items:center; gap:6px;}
.chart-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
.chart-legend i.line{height:3px; width:16px; border-radius:2px;}

.hbar-row{margin-bottom:18px;}
.hbar-row:last-child{margin-bottom:0;}
.hbar-head{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; margin-bottom:6px; font-size:13px;
}
.hbar-head span{font-size:12px; color:var(--ink-faint);}
.hbar{
  display:flex; height:24px; border-radius:7px; overflow:hidden;
  background:var(--surface-3); border:1px solid var(--line);
}
.hbar i{
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:#fff; font-family:var(--mono);
  white-space:nowrap; overflow:hidden;
}
.hbar i.worked{background:var(--ok);}
.hbar i.idle{background:var(--amber);}

/* ===== لوحات الإنتاج اليومي ===== */
.day-entry-box{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px 20px; margin-bottom:12px;
}
.day-entry-box:last-child{margin-bottom:0;}
.deb-head{
  display:flex; justify-content:space-between; align-items:center;
  gap:10px; margin-bottom:14px; font-weight:700; font-size:14px;
}

/* ===== نموذج "موديل جديد" — نظام الخطوات ===== */
.nm-steps{
  display:flex; gap:4px; background:var(--surface-3);
  padding:4px; border-radius:10px; margin-bottom:22px;
}
.nm-step-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 12px; min-height:42px; border:none; background:transparent;
  border-radius:7px; font-family:inherit; font-size:13.5px; font-weight:600;
  color:var(--ink-faint); cursor:pointer; transition:all .15s; white-space:nowrap;
}
.nm-step-btn:hover{background:var(--surface); color:var(--ink);}
.nm-step-btn i{
  width:21px; height:21px; border-radius:50%; flex-shrink:0;
  background:var(--line-strong); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:700; font-style:normal;
  font-family:var(--mono); transition:background .15s;
}
.nm-step-btn.active{background:var(--surface); color:var(--indigo); box-shadow:var(--shadow-sm);}
.nm-step-btn.active i{background:var(--indigo);}
.nm-step-btn.done i{background:var(--ok);}

.nm-step{display:none;}
.nm-step.active{display:block; animation:fadeIn .18s ease;}

.nm-note{
  font-size:12.5px; color:var(--ink-soft); line-height:1.75;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:12px 15px; margin-bottom:16px;
}
.nm-note strong{color:var(--ink);}

.nm-tally{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; margin-top:16px; padding:13px 16px;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); font-size:13.5px; color:var(--ink-soft);
}
.nm-tally b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); font-size:15px;}
.nm-tally.warn{background:var(--amber-soft); border-color:#EBDCBE; color:var(--amber);}
.nm-tally.warn b{color:var(--amber);}
.nm-tally.ok{background:var(--ok-soft); border-color:#CDE6DB; color:var(--ok);}
.nm-tally.ok b{color:var(--ok);}

.nm-foot{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:24px; padding-top:18px; border-top:1px solid var(--line);
}
.nm-foot .nm-spacer{flex:1;}
#draftBadge{font-size:12px; color:var(--ok); transition:opacity .3s;}

.nm-draft-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--amber-soft); border:1px solid #EBDCBE;
  border-radius:var(--radius-sm); padding:13px 16px; margin-bottom:18px;
}
.nm-draft-bar span{font-size:13px; flex:1; min-width:190px; color:var(--ink-soft);}

/* بطاقة اللون */
.color-card .cc-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:14px;
}
.color-card .cc-title{font-size:13.5px; font-weight:700; color:var(--ink-soft);}
.color-card input[type="color"]{
  padding:3px; height:42px; cursor:pointer; background:var(--surface);
}

/* صناديق المراحل — تنطوي لحد ما تتفعّل */
.dept-stage-box .stage-head{
  display:flex; align-items:center; gap:9px;
  font-weight:700; font-size:13.5px; cursor:pointer;
}
.dept-stage-box .stage-head input[type="checkbox"]{
  width:17px; height:17px; accent-color:var(--indigo); cursor:pointer; flex-shrink:0;
}
.dept-stage-box .stage-head .badge{margin-inline-start:auto;}
.dept-stage-box .stage-fields{
  display:grid; gap:12px; margin-top:14px;
  padding-top:14px; border-top:1px dashed var(--line-strong);
}
.dept-stage-box:has(.stage-head input:not(:checked)) .stage-fields{display:none;}
.dept-stage-box:has(.stage-head input:not(:checked)){opacity:.62;}
.dept-stage-box:has(.stage-head input:checked){opacity:1; box-shadow:var(--shadow-sm);}
/* ===== كشف الحضور الشهري (مصفوفة عمال × أيام) ===== */
.att-legend{
  display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  margin-bottom:16px; font-size:12.5px; color:var(--ink-soft);
}
.att-legend .lg{display:flex; align-items:center; gap:6px;}
.att-legend .lg i{
  width:22px; height:22px; border-radius:5px; display:flex;
  align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-style:normal;
}
.att-legend .lg i.p{background:var(--ok-soft); color:var(--ok); border:1px solid #CDE6DB;}
.att-legend .lg i.a{background:var(--warn-soft); color:var(--warn); border:1px solid #EFD7D3;}
.att-legend .lg i.f{background:var(--indigo-soft); color:var(--indigo); border:1px solid #D5DFEB;}
.att-legend .lg i.n{background:var(--surface-2); color:var(--ink-faint); border:1px dashed var(--line-strong);}
.att-legend .hintx{margin-inline-start:auto; font-size:12px; color:var(--ink-faint);}

.att-grid-wrap{
  overflow-x:auto; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--surface);
}
table.att-grid{
  width:max-content; min-width:100%;
  border-collapse:separate; border-spacing:0; font-size:13px;
}
table.att-grid th, table.att-grid td{border-bottom:1px solid var(--line);}

/* عمود الاسم — ثابت أثناء التمرير */
table.att-grid .emp-col{
  position:sticky; right:0; z-index:2;
  background:var(--surface); text-align:right;
  padding:8px 14px; min-width:150px; white-space:nowrap;
  border-inline-end:1px solid var(--line-strong);
}
table.att-grid thead .emp-col{z-index:3; background:var(--surface-2);}
table.att-grid tbody tr:nth-child(even) .emp-col{background:var(--surface-2);}
table.att-grid .emp-col .en{font-weight:700; font-size:14px; color:var(--ink);}
table.att-grid .emp-col .ed{font-size:11.5px; color:var(--ink-faint); font-weight:500;}

/* رؤوس الأيام */
table.att-grid th.day{
  background:var(--surface-2); color:var(--ink-soft);
  padding:7px 4px; min-width:50px; text-align:center;
  border-bottom:2px solid var(--line-strong);
  border-inline-start:1px solid var(--line);
  font-weight:700; line-height:1.3;
}
table.att-grid th.day .dn{font-family:var(--mono); font-size:13px;}
table.att-grid th.day .dw{font-size:10px; color:var(--ink-faint); font-weight:600;}
table.att-grid th.day.fri{background:var(--indigo-soft); color:var(--indigo);}
table.att-grid th.day.fri .dw{color:var(--indigo);}
table.att-grid th.day.today{background:var(--indigo); color:#fff;}
table.att-grid th.day.today .dw{color:rgba(255,255,255,.75);}
table.att-grid th.day.sel{box-shadow:inset 0 -3px 0 var(--indigo);}

table.att-grid th.stat{
  background:var(--surface-2); color:var(--ink-soft);
  padding:7px 10px; text-align:center; font-size:11.5px; font-weight:700;
  border-bottom:2px solid var(--line-strong);
  border-inline-start:1px solid var(--line-strong); white-space:nowrap;
}
table.att-grid tbody tr:nth-child(even) td{background:var(--surface-2);}
table.att-grid tbody tr:hover td{background:var(--indigo-soft);}
table.att-grid tbody tr:hover .emp-col{background:var(--indigo-soft);}

/* خلايا الأيام */
table.att-grid td.att-cell{
  padding:2px 3px; text-align:center; vertical-align:middle;
  border-inline-start:1px solid var(--line); cursor:pointer;
  transition:background .12s;
}
table.att-grid td.att-cell.fri-col{background:#F7F9FC;}
table.att-grid td.att-cell.future{cursor:default; opacity:.4;}
table.att-grid td.att-cell.ro{cursor:default;}
.att-mark{
  height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:6px; font-weight:700; font-size:14px;
}
.att-mark.empty{color:var(--ink-faint); border:1px dashed var(--line-strong); font-size:12px;}
.att-mark.absent{background:var(--warn-soft); color:var(--warn);}
.att-mark.friday{background:var(--indigo-soft); color:var(--indigo); font-size:12px;}
.att-mark.future{color:var(--ink-faint);}

.att-pair{display:flex; flex-direction:column; gap:1px; padding:2px 0;}
.att-pair .ci, .att-pair .co{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:10.5px; font-weight:700; padding:3px 0; width:46px; margin:0 auto;
  line-height:1.25;
}
.att-pair .ci{background:var(--ok-soft); color:var(--ok); border-radius:5px 5px 0 0;}
.att-pair .co{background:var(--indigo-soft); color:var(--indigo); border-radius:0 0 5px 5px;}
.att-pair .co.none{background:transparent; color:var(--ink-faint); border:1px dashed var(--line-strong); border-radius:0 0 5px 5px;}

table.att-grid td.stat{
  text-align:center; font-weight:700; padding:6px 10px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  border-inline-start:1px solid var(--line-strong);
}
table.att-grid td.stat.p{color:var(--ok);}
table.att-grid td.stat.a{color:var(--warn);}
table.att-grid td.stat.e{color:var(--ink);}

.att-toolbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin-bottom:16px;
}
.att-pill{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:999px; padding:6px 15px; font-size:12.5px; color:var(--ink-soft);
}
.att-pill.now{background:var(--ok-soft); border-color:#CDE6DB; color:var(--ok); font-weight:700;}

@media (max-width:760px){
  table.att-grid .emp-col{min-width:112px; padding:7px 10px;}
  table.att-grid .emp-col .en{font-size:13px;}
  table.att-grid th.day{min-width:44px;}
  .att-pair .ci, .att-pair .co{width:40px; font-size:9.5px;}
  .att-legend .hintx{margin-inline-start:0; width:100%;}
}
/* ===== شاشات متوسطة: الشريط الجانبي يضيق ===== */
@media (max-width:1180px){
  :root{--sidebar:200px;}
  .app{padding:0 20px 32px; column-gap:20px;}
  nav.tabs button{font-size:13.5px; padding:10px 11px;}
}

/* ===== لابتوب صغير / تابلت: الشريط يرجع أفقي ===== */
@media (max-width:980px){
  .app{grid-template-columns:1fr; column-gap:0;}
  nav.tabs{
    grid-column:1; grid-row:auto;
    flex-direction:row; position:static;
    gap:4px; overflow-x:auto; padding:6px;
    margin-bottom:22px;
  }
  nav.tabs button{width:auto; flex:0 0 auto; white-space:nowrap;}
  nav.tabs button .count{margin-inline-start:0;}
  section.view{grid-column:1; grid-row:auto;}
}

/* ===== الموبايل ===== */
@media (max-width:760px){
  body{font-size:14.5px; padding-bottom:90px;}
  .app{padding:0 14px 24px;}
  .user-bar{padding:12px 2px 8px;}
  header.top{
    flex-direction:column; align-items:stretch;
    gap:16px; padding-bottom:16px; margin-bottom:18px;
  }
  header.top .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
    gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 8px;
  }
  header.top .stats > div{min-width:0;}
  header.top .stats .num{font-size:20px;}
  .panel{padding:20px 18px;}
  .panel h2{font-size:15.5px; margin-bottom:16px;}
  .form-grid{grid-template-columns:1fr;}
  .emp-row, .stage-row, .color-card .color-top, .size-row{grid-template-columns:1fr;}
  .model-grid{grid-template-columns:1fr; gap:14px;}
  .model-detail-header{padding:18px; gap:12px;}
  .model-detail-header h2{font-size:19px;}

<script>
/* ============================================================
   الحالة والتخزين
============================================================ */
const STORAGE_KEY = 'factory_tracker_v2';
let state = {
  models: [],
  dayLogs: [],   // {id, date:'YYYY-MM-DD', dept, modelId, qty, hours, revenue, note}
  schedule: [],  // {id, modelId, dept, date, hours, note}
  factory: {
    rent: 0,
    electricity: 0,
    workHoursPerDay: 9,
    workDaysPerMonth: 26,
    deptCapacity: {}, // تخصيص طاقة يومية لقسم معين (اختياري)
    employees: [] // {id, name, dept, salary}
  },
  attendance: {} // { "YYYY-MM": { "YYYY-MM-DD": { empId: {status:'present'|'absent', checkIn, checkOut} } } }
};

function migrateState(){
  if(!state.factory) state.factory = {rent:0, electricity:0, workHoursPerDay:9, workDaysPerMonth:26, employees:[]};
  if(!state.factory.employees) state.factory.employees = [];
  if(!state.factory.deptCapacity) state.factory.deptCapacity = {};
  if(!Array.isArray(state.dayLogs)) state.dayLogs = [];
  if(!Array.isArray(state.schedule)) state.schedule = [];
  if(!Array.isArray(state.models)) state.models = [];
  if(!state.attendance) state.attendance = {};
  if(!Array.isArray(state.hrAdvances)) state.hrAdvances = [];
  if(!Array.isArray(state.deductions)) state.deductions = [];
  if(!Array.isArray(state.deptSettings)) state.deptSettings = [];
  if(!Array.isArray(state.treasury)) state.treasury = [];
  if(!Array.isArray(state.debts)) state.debts = [];
  if(!Array.isArray(state.suppliers)) state.suppliers = [];
  if(!Array.isArray(state.supplierPayments)) state.supplierPayments = [];
  if(!Array.isArray(state.miscExpenses)) state.miscExpenses = [];
  if(!Array.isArray(state.customers)) state.customers = [];
  if(!Array.isArray(state.invoices)) state.invoices = [];
  if(!Array.isArray(state.payments)) state.payments = [];
  state.models.forEach(m=>{
    if(!m.sewingOps) m.sewingOps = [];
    /* دفعات التشغيل الواردة من العميل — الموديلات القديمة مالهاش، فنبدأها فاضية */
    if(!Array.isArray(m.payments)) m.payments = [];
    /* عدد وحدات المرحلة لكل قطعة نهائية — الافتراضي 1 (وحدة = قطعة) */
    (m.stagesPlanned||[]).forEach(sp=>{
      if(sp.unitsPerPiece === undefined || Number(sp.unitsPerPiece) <= 0) sp.unitsPerPiece = 1;
    });
    /* العمال ومعاييرهم لكل مرحلة: { stageKey: [{employeeId, standard, history[]}] } */
    if(!m.stageWorkers || typeof m.stageWorkers !== 'object') m.stageWorkers = {};
    (m.stagesPlanned||[]).forEach(sp=>{
      if(!Array.isArray(m.stageWorkers[sp.key])) m.stageWorkers[sp.key] = [];
    });
  });
  state.factory.employees.forEach(e=>{
    if(!e.payType) e.payType = 'monthly';
    if(e.weeklyRate===undefined) e.weeklyRate = 0;
    if(e.prevBalance===undefined) e.prevBalance = 0;
    if(e.bonus===undefined) e.bonus = 0;
  });
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
    migrateState();
  }catch(e){ console.error('فشل تحميل البيانات', e); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  syncStateToCloud();
}

/* مزامنة سحابية مع تأخير بسيط عشان منبعتش كل حرف بيتكتب */
let _syncTimer = null;
function syncStateToCloud(){
  if(!window.currentUser) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async ()=>{
    try{
      await window._fsset(window._FACTORY_DOC_REF(), {
        data: JSON.stringify(state),
        updatedAt: Date.now(),
        updatedBy: window.currentUser.email
      });
    }catch(e){ console.error('فشلت المزامنة السحابية', e); }
  }, 600);
}

async function loadStateFromCloud(){
  try{
    const snap = await window._fsget(window._FACTORY_DOC_REF());
    if(snap.exists() && snap.data().data){
      state = JSON.parse(snap.data().data);
      migrateState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  }catch(e){
    console.error('فشل تحميل البيانات من السحابة، هنشتغل بالنسخة المحلية', e);
  }
}

/* هل عندي صلاحية على قسم معيّن؟ level = 'view' أو 'edit' */
function hasPerm(sectionKey, level){
  const perms = window.currentPermissions || {};
  const val = perms[sectionKey] || 'none';
  if(level==='view') return val==='view' || val==='edit';
  if(level==='edit') return val==='edit';
  return false;
}
function requireEdit(sectionKey, actionLabel){
  if(!hasPerm(sectionKey, 'edit')){
    toast(`🚫 مفيش صلاحية تعديل على "${actionLabel||sectionKey}"`);
    return false;
  }
  return true;
}
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   ثوابت الأقسام
   3 أقسام داخلية بنسب من (إيجار+كهرباء)، زائد أقسام خارجية بتكلفة يدوية
============================================================ */
const SIZES = ['S','M','L','XL','2XL','3XL','4XL','5XL'];

const INTERNAL_DEPTS = [
  {key:'cutting',  label:'المقص',            pct:0.35},
  {key:'sewing',   label:'الخياطة',          pct:0.40},
  {key:'ambag',    label:'امباج (تشطيب+مكوة+تكيس)', pct:0.25},
];
const SUPERVISION_DEPT = {key:'supervision', label:'إشراف'};

/* ============================================================
   معايير الإنتاج (ث/قطعة)
   ------------------------------------------------------------
   ساعات الدوام في الإعدادات 9، بس فيها ساعة راحة —
   فالساعات المنتجة فعلياً 8. المعيار بيتقاس بالعداد الحي
   ويتخزن لكل (عامل × مرحلة × موديل) لأن كل موديل صعوبته مختلفة.
============================================================ */
const BREAK_HOURS_PER_DAY = 1;
function getProductiveHoursPerDay(){
  const shift = Number(state?.factory?.workHoursPerDay) || 9;
  return Math.max(shift - BREAK_HOURS_PER_DAY, 1);
}
function getProductiveSecondsPerDay(){ return getProductiveHoursPerDay() * 3600; }

/* وحدات المرحلة اللي العامل ينتجها في اليوم بمعدل معياره */
function unitsPerDayFromStandard(secPerPiece){
  if(!secPerPiece || secPerPiece <= 0) return 0;
  return getProductiveSecondsPerDay() / secPerPiece;
}
/* القطع النهائية = وحدات المرحلة ÷ عدد الوحدات لكل قطعة */
function piecesFromUnits(units, unitsPerPiece){
  const u = Number(unitsPerPiece) || 1;
  return u > 0 ? units / u : 0;
}
function getStageUnitsPerPiece(m, stageKey){
  const sp = (m.stagesPlanned||[]).find(s=>s.key===stageKey);
  return Number(sp?.unitsPerPiece) || 1;
}
function getStageWorkers(m, stageKey){
  if(!m.stageWorkers) m.stageWorkers = {};
  if(!Array.isArray(m.stageWorkers[stageKey])) m.stageWorkers[stageKey] = [];
  return m.stageWorkers[stageKey];
}
function getEmployeeName(id){
  const e = (state.factory.employees||[]).find(x=>x.id===id);
  return e ? e.name : '(موظف محذوف)';
}
/* الطاقة اليومية للمرحلة = مجموع طاقة كل عامل له معيار، بالقطع النهائية */
function getStageDailyCapacity(m, stageKey){
  const upp = getStageUnitsPerPiece(m, stageKey);
  const workers = getStageWorkers(m, stageKey);
  let units = 0, withStandard = 0;
  workers.forEach(w=>{
    if(w.standard && w.standard.secPerPiece > 0){
      units += unitsPerDayFromStandard(w.standard.secPerPiece);
      withStandard++;
    }
  });
  return { units, pieces: piecesFromUnits(units, upp), withStandard, total: workers.length };
}
function fmtDuration(totalSeconds){
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
const EXTERNAL_STAGES = [
  {key:'tatreez', label:'تطريز/طباعة'},
  {key:'buttons', label:'أزرار'},
];
const ALL_STAGES = [...INTERNAL_DEPTS.map(d=>({key:d.key,label:d.label,internal:true})), ...EXTERNAL_STAGES.map(s=>({key:s.key,label:s.label,internal:false}))];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ n = Number(n)||0; return n.toLocaleString('ar-EG', {maximumFractionDigits:2}); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

/* ============================================================
   حساب تكلفة الساعة لكل قسم داخلي
============================================================ */
function getMonthlyHoursFor(factoryCtx){
  const h = Number(factoryCtx.workHoursPerDay)||9;
  const d = Number(factoryCtx.workDaysPerMonth)||26;
  return h*d;
}
function getMonthlyHours(){ return getMonthlyHoursFor(state.factory); }

/* نصيب قسم معيّن من مرتبات موظفي الإشراف، حسب النسبة المخصصة لكل موظف */
function getSupervisionShareForDeptFor(deptKey, factoryCtx){
  return (factoryCtx.employees||[])
    .filter(e=>e.dept===SUPERVISION_DEPT.key)
    .reduce((s,e)=>{
      const pct = Number(e.splits?.[deptKey])||0;
      return s + (Number(e.salary)||0) * pct;
    }, 0);
}
function getSupervisionShareForDept(deptKey){ return getSupervisionShareForDeptFor(deptKey, state.factory); }

function getDeptHourlyRateFor(deptKey, factoryCtx){
  const dept = INTERNAL_DEPTS.find(d=>d.key===deptKey);
  if(!dept) return 0;
  const fixedShare = ((Number(factoryCtx.rent)||0) + (Number(factoryCtx.electricity)||0)) * dept.pct;
  const directSalaries = (factoryCtx.employees||[])
    .filter(e=>e.dept===deptKey)
    .reduce((s,e)=>s+(Number(e.salary)||0), 0);
  const supervisionShare = getSupervisionShareForDeptFor(deptKey, factoryCtx);
  const monthlyHours = getMonthlyHoursFor(factoryCtx);
  if(monthlyHours<=0) return 0;
  return (fixedShare + directSalaries + supervisionShare) / monthlyHours;
}
function getDeptHourlyRate(deptKey){ return getDeptHourlyRateFor(deptKey, state.factory); }

function getDeptMonthlyCostFor(deptKey, factoryCtx){
  const dept = INTERNAL_DEPTS.find(d=>d.key===deptKey);
  if(!dept) return {fixedShare:0, salariesShare:0, supervisionShare:0, total:0};
  const fixedShare = ((Number(factoryCtx.rent)||0) + (Number(factoryCtx.electricity)||0)) * dept.pct;
  const directSalaries = (factoryCtx.employees||[])
    .filter(e=>e.dept===deptKey)
    .reduce((s,e)=>s+(Number(e.salary)||0), 0);
  const supervisionShare = getSupervisionShareForDeptFor(deptKey, factoryCtx);
  return {fixedShare, salariesShare:directSalaries, supervisionShare, total:fixedShare+directSalaries+supervisionShare};
}
function getDeptMonthlyCost(deptKey){ return getDeptMonthlyCostFor(deptKey, state.factory); }

function getFactoryContextFor(m){
  if(m && m.status==='closed' && m.closedSnapshot) return m.closedSnapshot;
  return state.factory;
}

/* ============================================================
   محرك الرواتب — قاعدة ثابتة مستقلة عن ساعات/أيام إعدادات المصنع
   الشهر المالي = 30 يوم دائماً، ساعات الشهر = 270 ساعة ثابتة
============================================================ */
const PAYROLL_RULES = {
  FINANCIAL_MONTH_DAYS: 30,
  WORK_HOURS_PER_DAY: 9,
  MONTHLY_HOURS: 270,
  WEEKS_PER_MONTH: 4,
  OVERTIME_MULTIPLIER: 1.5,
};

/* كل سجلات حضور موظف معيّن، مسطّحة من بنية attendance[month][day][empId] */
function getEmployeeAttendanceRecords(empId){
  const out = [];
  Object.keys(state.attendance||{}).forEach(mk=>{
    const monthObj = state.attendance[mk] || {};
    Object.keys(monthObj).forEach(dk=>{
      const rec = monthObj[dk][empId];
      if(rec) out.push({...rec, date:dk});
    });
  });
  return out;
}

function calcPayroll(emp){
  const payType = emp.payType || 'monthly';
  let weeklyRate, fullMonthSalary;
  if(payType === 'monthly'){
    fullMonthSalary = Number(emp.salary)||0;
    weeklyRate = fullMonthSalary / PAYROLL_RULES.WEEKS_PER_MONTH;
  } else {
    weeklyRate = Number(emp.weeklyRate)||0;
    fullMonthSalary = weeklyRate * PAYROLL_RULES.WEEKS_PER_MONTH;
  }

  const dailyRate = fullMonthSalary / PAYROLL_RULES.FINANCIAL_MONTH_DAYS;
  const hourlyRate = dailyRate / PAYROLL_RULES.WORK_HOURS_PER_DAY;

  const atts = getEmployeeAttendanceRecords(emp.id);
  const presentAtts = atts.filter(a=>a.status==='present' && a.type!=='friday');
  const presentDays = presentAtts.length;
  const absentAtts = atts.filter(a=>a.status==='absent');
  const absenceDays = absentAtts.length;
  const totalOT = atts.reduce((s,a)=>s+(Number(a.otHours)||0), 0);
  const totalLatePen = atts.reduce((s,a)=>s+(Number(a.latePen)||0), 0);
  const totalEarlyPen = atts.reduce((s,a)=>s+(Number(a.earlyPen)||0), 0);

  const fridaysCount = atts.filter(a=>a.type==='friday').length;
  const otPay = totalOT * hourlyRate * PAYROLL_RULES.OVERTIME_MULTIPLIER;

  const advances = (state.hrAdvances||[]).filter(a=>a.empId===emp.id && !a.settled);
  const regularAdvances = advances.filter(a=>a.type!=='bonus');
  const bonusAdvances = advances.filter(a=>a.type==='bonus');
  const totalAdv = regularAdvances.reduce((s,a)=>s+(Number(a.amount)||0), 0);
  const totalBonusFromAdvances = bonusAdvances.reduce((s,a)=>s+(Number(a.amount)||0), 0);

  const cashDeds = (state.deductions||[]).filter(d=>d.empId===emp.id && !d.settled);
  const totalCashDed = cashDeds.reduce((s,d)=>s+(Number(d.amount)||0), 0);

  const absPenalty = absentAtts.reduce((s,a)=>s+(a.absPenalty!=null ? Number(a.absPenalty) : dailyRate), 0);

  const bonus = Number(emp.bonus)||0;
  const prevBal = Number(emp.prevBalance)||0;

  const paidDays = presentDays + fridaysCount;
  const earnedByDays = Math.min(Math.max(paidDays * dailyRate, 0), fullMonthSalary);

  const totalDed = totalAdv + totalCashDed + totalLatePen + totalEarlyPen + absPenalty;
  const netEOM = (earnedByDays + otPay + bonus + totalBonusFromAdvances + prevBal) - totalDed;

  return {
    payType, weeklyRate, dailyRate, hourlyRate, fullMonthSalary,
    presentDays, absenceDays, fridaysCount, paidDays,
    totalOT, otPay, totalLatePen, totalEarlyPen, absPenalty,
    advances, totalAdv, totalBonusFromAdvances, cashDeds, totalCashDed,
    bonus, prevBal, earnedByDays, totalDed, netEOM
  };
}

window._payrollEmpId = null;
window._payrollTab = 'summary';

function openPayrollDetail(empId){
  if(!hasPerm('employees','view')) return;
  window._payrollEmpId = empId;
  window._payrollTab = 'summary';
  renderPayrollModal();
}

function closePayrollModal(){
  window._payrollEmpId = null;
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalContent').innerHTML = '';
}

function switchPayrollTab(tab){
  window._payrollTab = tab;
  renderPayrollModal();
}

function renderPayrollModal(){
  const emp = state.factory.employees.find(e=>e.id===window._payrollEmpId);
  if(!emp) return;
  const p = calcPayroll(emp);
  const canEdit = hasPerm('employees','edit');
  const tabs = [
    {k:'summary', l:'ملخص'},
    {k:'advances', l:'السلف والمكافآت'},
    {k:'deductions', l:'الخصومات'},
  ];

  let body = '';
  if(window._payrollTab === 'summary') body = renderPayrollSummaryTab(emp, p);
  else if(window._payrollTab === 'advances') body = renderPayrollAdvancesTab(emp, p, canEdit);
  else if(window._payrollTab === 'deductions') body = renderPayrollDeductionsTab(emp, p, canEdit);

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closePayrollModal()">✕</button>
    <h3>💰 راتب ${escapeHtml(emp.name)}</h3>
    <div class="stage-tabs" style="margin-bottom:18px;">
      ${tabs.map(t=>`<div class="stage-tab ${window._payrollTab===t.k?'active':''}" onclick="switchPayrollTab('${t.k}')">${t.l}</div>`).join('')}
    </div>
    <div id="payrollTabBody">${body}</div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function addAdvance(empId){
  if(!requireEdit('employees','إضافة سلفة/مكافأة')) return;
  const type = document.getElementById('adv_type').value;
  const amount = Number(document.getElementById('adv_amount').value)||0;
  const note = document.getElementById('adv_note').value.trim();
  if(amount<=0){ toast('⚠️ اكتب مبلغ أكبر من صفر'); return; }
  state.hrAdvances.push({id:uid(), empId, type, amount, note, date:todayStr(), settled:false});
  saveState();
  toast('✅ تم الإضافة');
  renderPayrollModal();
}

function settleAdvance(id){
  if(!requireEdit('employees','تسوية سلفة')) return;
  const a = state.hrAdvances.find(x=>x.id===id);
  if(a) a.settled = true;
  saveState();
  toast('✅ تمت التسوية');
  renderPayrollModal();
}

function deleteAdvance(id){
  if(!requireEdit('employees','حذف سلفة')) return;
  state.hrAdvances = state.hrAdvances.filter(x=>x.id!==id);
  saveState();
  toast('تم الحذف');
  renderPayrollModal();
}

function addDeduction(empId){
  if(!requireEdit('employees','إضافة خصم')) return;
  const amount = Number(document.getElementById('ded_amount').value)||0;
  const reason = document.getElementById('ded_reason').value.trim();
  if(amount<=0){ toast('⚠️ اكتب مبلغ أكبر من صفر'); return; }
  state.deductions.push({id:uid(), empId, amount, reason, date:todayStr(), settled:false});
  saveState();
  toast('✅ تم الإضافة');

function settleDeduction(id){

function deleteDeduction(id){

function getTotalCutQty(m){
  return (m.cutParts||[]).reduce((s,r)=>s+(Number(r.qty)||0),0);
}

/* ============================================================
   حساب التكلفة والربح لكل موديل
   لكل مرحلة مخططة في الموديل:
     - لو داخلية: التكلفة المتوقعة = الوقت المتوقع (ساعة) × تكلفة ساعة القسم (بتُحسب من الإعدادات الحالية)
     - لو خارجية: التكلفة المتوقعة = اللي كتبها المستخدم يدوي
   لو فيه سجلات فعلية للمرحلة (stageLogs) بتحل محل التقدير في حساب التكلفة الكلية.
============================================================ */
function calcModelCost(m){
  const cutQty = getTotalCutQty(m);
  const baseUnit = cutQty > 0 ? cutQty : (m.expectedTotal || 0);

  let totalCost = 0;
  let stageDetails = [];

  (m.stagesPlanned||[]).forEach(sp=>{
    const isInternal = INTERNAL_DEPTS.some(d=>d.key===sp.key);
    const logs = (m.stageLogs && m.stageLogs[sp.key]) || [];
    const hasLogs = logs.length>0;
    const actualSum = logs.reduce((s,l)=>s+(Number(l.cost)||0),0);
    const actualTimeSum = logs.reduce((s,l)=>s+(Number(l.time)||0),0);

    let plannedCost = 0;
    let hourlyRate = null;
    if(isInternal){
      hourlyRate = getDeptHourlyRate(sp.key);
      plannedCost = hourlyRate * (Number(sp.expectedTime)||0);
    } else {
      plannedCost = Number(sp.expectedCost)||0;
    }

    const usedCost = hasLogs ? actualSum : plannedCost;
    totalCost += usedCost;

    stageDetails.push({
      key:sp.key, label:sp.label, internal:isInternal,
      expectedTime:sp.expectedTime, hourlyRate,
      plannedCost, actualCost:actualSum, actualTime:actualTimeSum,
      hasLogs, usedCost
    });
  });

  const revenue = (m.expectedTotal||0) * (Number(m.sellPrice)||0);
  const profit = revenue - totalCost;
  const costPerUnit = baseUnit > 0 ? totalCost/baseUnit : 0;
  const profitPerUnit = (Number(m.sellPrice)||0) - costPerUnit;

  return { revenue, totalCost, profit, costPerUnit, profitPerUnit, stageDetails };
}

/* ============================================================
   محرك اليوم والشهر: الإنتاج، الهدر، المكسب والخسارة لكل قسم
============================================================ */
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_WEEK = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

function ymd(y, mIdx, d){
  return `${y}-${String(mIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getDeptDailyCapacity(deptKey){
  const custom = Number((state.factory.deptCapacity||{})[deptKey]);
  if(custom > 0) return custom;
  return Number(state.factory.workHoursPerDay) || 9;
}

function isWorkDay(dateStr){
  return (state.dayLogs||[]).some(l => l.date === dateStr);
}

function getDayDeptStats(dateStr, deptKey){
  const logs = (state.dayLogs||[]).filter(l => l.date===dateStr && l.dept===deptKey);
  const active = isWorkDay(dateStr);
  const capacity = active ? getDeptDailyCapacity(deptKey) : 0;
  const rate = getDeptHourlyRate(deptKey);
  const workedHours = logs.reduce((s,l)=>s+(Number(l.hours)||0), 0);
  const revenue = logs.reduce((s,l)=>s+(Number(l.revenue)||0), 0);
  const qty = logs.reduce((s,l)=>s+(Number(l.qty)||0), 0);
  const idleHours = Math.max(0, capacity - workedHours);
  const overHours = Math.max(0, workedHours - capacity);
  const billedHours = active ? Math.max(capacity, workedHours) : 0;
  const cost = billedHours * rate;
  const idleCost = idleHours * rate;
  return {
    date:dateStr, dept:deptKey, logs, active, capacity, rate,
    workedHours, idleHours, overHours, billedHours,
    cost, idleCost, revenue, qty,
    profit: revenue - cost,
    utilization: capacity>0 ? (workedHours/capacity*100) : 0
  };
}

function getDayStats(dateStr, deptKey){
  if(deptKey && deptKey !== 'all') return getDayDeptStats(dateStr, deptKey);
  const parts = INTERNAL_DEPTS.map(d => getDayDeptStats(dateStr, d.key));
  const sum = k => parts.reduce((s,p)=>s+p[k], 0);
  const capacity = sum('capacity');
  return {
    date:dateStr, dept:'all', parts, logs: parts.flatMap(p=>p.logs),
    active: isWorkDay(dateStr), capacity, rate:null,
    workedHours: sum('workedHours'), idleHours: sum('idleHours'), overHours: sum('overHours'),
    billedHours: sum('billedHours'), cost: sum('cost'), idleCost: sum('idleCost'),
    revenue: sum('revenue'), qty: sum('qty'), profit: sum('revenue') - sum('cost'),
    utilization: capacity>0 ? (sum('workedHours')/capacity*100) : 0
  };
}

function getMonthStats(y, mIdx, deptKey){
  const days = new Date(y, mIdx+1, 0).getDate();
  const list = [];
  for(let d=1; d<=days; d++) list.push(getDayStats(ymd(y,mIdx,d), deptKey));
  const sum = k => list.reduce((s,p)=>s+(p[k]||0), 0);
  const workedDays = list.filter(p=>p.active).length;
  const capacity = sum('capacity');
  return {
    days, list, workedDays,
    capacity, workedHours: sum('workedHours'), idleHours: sum('idleHours'),
    cost: sum('cost'), idleCost: sum('idleCost'), revenue: sum('revenue'),
    qty: sum('qty'), profit: sum('revenue') - sum('cost'),
    utilization: capacity>0 ? (sum('workedHours')/capacity*100) : 0
  };
}

function getSchedFor(dateStr, deptKey){
  return (state.schedule||[]).filter(sc =>
    sc.date === dateStr && (!deptKey || deptKey==='all' || sc.dept===deptKey));
}

function modelName(id){
  const m = state.models.find(x=>x.id===id);
  return m ? m.name : '(موديل محذوف)';
}
function deptLabel(key){
  const d = INTERNAL_DEPTS.find(x=>x.key===key);
  return d ? d.label : key;
}

function suggestRevenue(modelId, deptKey, qty){
  const m = state.models.find(x=>x.id===modelId);
  if(!m || !qty) return 0;
  const planned = m.stagesPlanned || [];
  if(planned.length === 0) return 0;
  const costs = planned.map(sp=>{
    if(INTERNAL_DEPTS.some(d=>d.key===sp.key)) return getDeptHourlyRate(sp.key) * (Number(sp.expectedTime)||0);
    return Number(sp.expectedCost)||0;
  });
  const total = costs.reduce((a,b)=>a+b, 0);
  const idx = planned.findIndex(sp=>sp.key===deptKey);
  if(idx < 0 || total <= 0) return 0;
  const shareRatio = costs[idx] / total;
  return (Number(m.sellPrice)||0) * qty * shareRatio;
}

function formatDateArabic(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const weekday = AR_WEEK[(dt.getDay()+1)%7];
  return `${weekday} ${d} ${AR_MONTHS[m-1]} ${y}`;
}

/* ============================================================
   مربعات حوار مخصصة (تأكيد / إدخال نص) بدل confirm()/prompt() القياسية
============================================================ */
let _dialogResolve = null;
function _closeDialog(val){
  document.getElementById('dialogOverlay').classList.remove('active');
  document.getElementById('dialogOverlay').style.display = 'none';
  if(_dialogResolve) _dialogResolve(val);
  _dialogResolve = null;
}
function confirmDialog(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    _dialogResolve = resolve;
    document.getElementById('dialogOverlay').innerHTML = `
      <div class="modal-box" style="max-width:380px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(opts.title||'تأكيد')}</h3>
        <p style="font-size:14px; color:var(--ink-soft); margin-bottom:20px; line-height:1.7;">${escapeHtml(message)}</p>
        <div style="display:flex; gap:8px;">
          <button class="btn ${opts.danger?'danger':'brass'}" style="flex:1;" onclick="_closeDialog(true)">${escapeHtml(opts.yes||'تأكيد')}</button>
          <button class="btn ghost" style="flex:1;" onclick="_closeDialog(false)">${escapeHtml(opts.no||'إلغاء')}</button>
        </div>
      </div>
    `;
    document.getElementById('dialogOverlay').style.display = 'flex';
  });
}
function promptDialog(message, defaultValue, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    _dialogResolve = resolve;
    document.getElementById('dialogOverlay').innerHTML = `
      <div class="modal-box" style="max-width:380px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(opts.title||'إدخال')}</h3>
        <p style="font-size:14px; color:var(--ink-soft); margin-bottom:12px;">${escapeHtml(message)}</p>
        <input type="text" id="dialogPromptInput" value="${escapeHtml(defaultValue||'')}" style="width:100%; padding:11px 14px; min-height:44px; border:1.5px solid var(--line-strong); border-radius:10px; font-family:inherit; font-size:15px; margin-bottom:16px;">
        <div style="display:flex; gap:8px;">
          <button class="btn brass" style="flex:1;" onclick="_closeDialog(document.getElementById('dialogPromptInput').value)">${escapeHtml(opts.yes||'تأكيد')}</button>
          <button class="btn ghost" style="flex:1;" onclick="_closeDialog(null)">${escapeHtml(opts.no||'إلغاء')}</button>
        </div>
      </div>
    `;
    document.getElementById('dialogOverlay').style.display = 'flex';
    setTimeout(()=>{ const inp=document.getElementById('dialogPromptInput'); if(inp){ inp.focus(); inp.select(); } }, 50);
  });
}

function saveEmployees(){
  if(!requireEdit('employees','حفظ الموظفين')) return;
  const rows = document.querySelectorAll('#empRows .emp-row');
  let added = 0;
  let skippedSplit = 0;
  rows.forEach(row=>{
    const idx = row.id.split('_')[1];
    const name = document.getElementById('emp_name_'+idx).value.trim();
    const dept = document.getElementById('emp_dept_'+idx).value;
    const salary = Number(document.getElementById('emp_salary_'+idx).value)||0;
    if(!name || salary<=0) return;

    if(dept===SUPERVISION_DEPT.key){
      const splits = {};
      let sum = 0;
      INTERNAL_DEPTS.forEach(d=>{
        const v = (Number(document.getElementById(`emp_split_${d.key}_${idx}`).value)||0)/100;
        splits[d.key] = v;
        sum += v;
      });
      if(Math.round(sum*100)!==100){ skippedSplit++; return; }
      state.factory.employees.push({id:uid(), name, dept, salary, splits, payType:'monthly', weeklyRate:0, prevBalance:0, bonus:0});
      added++;
    } else {
      state.factory.employees.push({id:uid(), name, dept, salary, payType:'monthly', weeklyRate:0, prevBalance:0, bonus:0});
      added++;
    }
  });
  if(skippedSplit>0){ toast(`⚠️ ${skippedSplit} موظف إشراف اتخطى — النسب لازم تجمع 100%`); if(added===0) return; }
  if(added===0){ toast('مفيش موظفين جدد لإضافتهم'); return; }
  saveState();
  renderSettingsView();
  toast(`تم إضافة ${added} موظف ✓`);
}

function saveEditedEmployee(){

  const id = document.getElementById('edit_emp_id').value;

  const name = document.getElementById('edit_emp_name').value.trim();

  emp.weeklyRate = Number(document.getElementById('edit_emp_weekly').value) || 0;
  emp.prevBalance = Number(document.getElementById('edit_emp_prevbal').value) || 0;
  emp.bonus = Number(document.getElementById('edit_emp_bonus').value) || 0;

  if(dept===SUPERVISION_DEPT.key){
    const splits = {};
    let sum = 0;
    INTERNAL_DEPTS.forEach(d=>{
      const v = (Number(document.getElementById(`edit_emp_split_${d.key}`).value)||0)/100;
      splits[d.key] = v;
      sum += v;

    if(Math.round(sum*100)!==100){ toast('⚠️ نسب التوزيع لازم تجمع 100%'); return; }

    delete emp.splits;

  renderSettingsView();
  toast('تم حفظ التعديل ✓');
}

/* ============================================================
   حماية مسودة "موديل جديد" من الضياع
   ------------------------------------------------------------
   المشكلة: كليك بالغلط برّه النافذة كان بيقفلها ويمسح
   innerHTML بكل اللي اتكتب — بدون أي تحذير أو حفظ.
   الحل: 3 طبقات — حفظ تلقائي + تأكيد قبل القفل + تعطيل
   القفل بالكليك الخارجي أثناء فتح النموذج ده تحديداً.
============================================================ */
const DRAFT_KEY = 'factory_newmodel_draft_v1';
window._newModelOpen = false;      /* هل نموذج الموديل الجديد مفتوح دلوقتي؟ */
window._modelPayments = [];        /* دفعات التشغيل في النموذج الحالي */

/* يقرأ كل حقول النموذج ويحوّلها لكائن واحد */
function collectNewModelDraft(){
  if(!document.getElementById('nm_name')) return null;
  const draft = {
    name: document.getElementById('nm_name').value,
    price: document.getElementById('nm_price').value,
    expected: document.getElementById('nm_expected').value,
    colors: [],
    stages: {},
    payments: (window._modelPayments||[]).slice()
  };
  document.querySelectorAll('#colorRows .color-card').forEach(card=>{
    const idx = card.id.split('_')[1];
    const nameEl = document.getElementById('cr_name_'+idx);
    if(!nameEl) return;
    const sizes = [];
    card.querySelectorAll(`#sizeRows_${idx} .size-row`).forEach(sRow=>{
      sizes.push({
        size: sRow.querySelector('select').value,
        qty:  sRow.querySelector('input[type="number"]').value
      });
    });
    draft.colors.push({
      name:  nameEl.value,
      hex:   document.getElementById('cr_hex_'+idx).value,
      bolts: document.getElementById('cr_bolts_'+idx).value,
      sizes
    });
  });
  ALL_STAGES.forEach(st=>{
    const en = document.getElementById('stage_'+st.key+'_enabled');
    if(!en) return;
    const costEl = document.getElementById('stage_'+st.key+'_cost');
    const unitsEl = document.getElementById('stage_'+st.key+'_units');
    draft.stages[st.key] = {
      enabled: en.checked,
      units: unitsEl ? unitsEl.value : '1',
      time: (document.getElementById('stage_'+st.key+'_time')||{}).value || '',
      cost: costEl ? costEl.value : ''
    };
  });
  return draft;
}

/* هل المستخدم كتب أي حاجة فعلاً؟ (عشان منزعّجهوش بتأكيد على نموذج فاضي) */
function newModelDraftHasData(draft){
  if(!draft) return false;
  if((draft.name||'').trim()) return true;
  if((draft.price||'').toString().trim()) return true;
  if((draft.expected||'').toString().trim()) return true;
  if((draft.payments||[]).length > 0) return true;
  const anyColor = draft.colors.some(c=>
    (c.name||'').trim() || (c.bolts||'').toString().trim() ||
    c.sizes.some(s=>(s.qty||'').toString().trim())
  );
  if(anyColor) return true;
  return Object.values(draft.stages||{}).some(s=>
    s.enabled || (s.time||'').toString().trim() || (s.cost||'').toString().trim()
  );
}

/* حفظ تلقائي — بيتنادى مع كل تغيير في أي حقل */
function saveNewModelDraft(){
  if(!window._newModelOpen) return;
  try{
    const draft = collectNewModelDraft();
    if(newModelDraftHasData(draft)){
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: Date.now(), draft }));
      const badge = document.getElementById('draftBadge');
      if(badge){
        badge.textContent = '💾 اتحفظت مسودة';
        badge.style.opacity = '1';
        clearTimeout(window._draftBadgeTimer);
        window._draftBadgeTimer = setTimeout(()=>{ badge.style.opacity = '.45'; }, 1500);
      }
    }
  }catch(e){ /* لو الـlocalStorage مليان، منكسرش النموذج */ }
}

function clearNewModelDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

function getSavedDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.draft ? parsed : null;
  }catch(e){ return null; }
}

/* قفل آمن: يسأل الأول لو فيه بيانات */
async function closeAddModelModal(){
  const draft = collectNewModelDraft();
  if(newModelDraftHasData(draft)){
    saveNewModelDraft();
    const ok = await confirmDialog(
      'فيه بيانات مكتوبة لسه متحفظتش كموديل.\n\nهقفل النافذة، بس البيانات اتحفظت كمسودة وهتلاقيها لما تفتح "موديل جديد" تاني.\n\nأقفل؟',
      { title:'بيانات غير محفوظة', yes:'اقفل واحتفظ بالمسودة', no:'ارجع أكمّل' }
    );
    if(!ok) return;
  }
  window._newModelOpen = false;
  closeModal();
}

/* ---------- التنقل بين خطوات النموذج ---------- */
function nmGoStep(n){
  n = Math.min(3, Math.max(1, Number(n)||1));
  window._nmStep = n;
  for(let i=1; i<=3; i++){
    const step = document.getElementById('nmStep'+i);
    const btn  = document.getElementById('nmStepBtn'+i);
    if(step) step.classList.toggle('active', i===n);
    if(btn){
      btn.classList.toggle('active', i===n);
      btn.classList.toggle('done', i<n);
    }
  }
  const prev = document.getElementById('nmPrevBtn');
  const next = document.getElementById('nmNextBtn');
  const save = document.getElementById('nmSaveBtn');
  if(prev) prev.style.display = n>1 ? '' : 'none';
  if(next) next.style.display = n<3 ? '' : 'none';
  if(save) save.style.display = n===3 ? '' : 'none';
  nmUpdateTally();
  const modal = document.getElementById('modalContent');
  if(modal) modal.scrollTop = 0;
}

/* ---------- عدّادات مساعدة: مقارنة المقاسات بالعدد المتوقع ---------- */
function nmUpdateTally(){
  const tally = document.getElementById('nmTally');
  if(tally){
    let total = 0;
    document.querySelectorAll('#colorRows .color-card').forEach(card=>{
      card.querySelectorAll('.size-row input[type="number"]').forEach(inp=>{ total += Number(inp.value)||0; });
    });
    const expEl = document.getElementById('nm_expected');
    const expected = Number(expEl ? expEl.value : 0) || 0;
    tally.className = 'nm-tally';
    if(!expected){
      tally.innerHTML = `<span>إجمالي القطع من المقاسات</span><b>${fmt(total)}</b>`;
    }else if(total === expected){
      tally.className = 'nm-tally ok';
      tally.innerHTML = `<span>✓ المقاسات مطابقة للعدد المتوقع</span><b>${fmt(total)}</b>`;
    }else{
      const diff = total - expected;
      tally.className = 'nm-tally warn';
      tally.innerHTML = `<span>المقاسات ${fmt(total)} والمتوقع ${fmt(expected)} — فرق ${diff>0?'زيادة':'نقص'} ${fmt(Math.abs(diff))} قطعة</span><b>${fmt(total)}</b>`;
    }
  }

  const st = document.getElementById('nmStageTally');
  if(st){
    const on = ALL_STAGES.filter(s=>{
      const el = document.getElementById('stage_'+s.key+'_enabled');
      return el && el.checked;
    });
    st.className = on.length ? 'nm-tally ok' : 'nm-tally warn';
    st.innerHTML = on.length
      ? `<span>المراحل المختارة: ${on.map(s=>escapeHtml(s.label)).join(' ← ')}</span><b>${on.length}</b>`
      : `<span>لسه مختارتش أي مرحلة — لازم مرحلة واحدة على الأقل</span><b>0</b>`;
  }
}

/* ---------- حفظ مع القفز للخطوة الناقصة ---------- */
function nmSave(){
  const name = (document.getElementById('nm_name').value||'').trim();
  const price = Number(document.getElementById('nm_price').value);
  const expected = Number(document.getElementById('nm_expected').value);

  if(!name || !price || price<=0 || !expected || expected<=0){
    nmGoStep(1);
  }else{
    const hasColor = [...document.querySelectorAll('#colorRows .color-card')].some(card=>{
      const idx = card.id.split('_')[1];
      const el = document.getElementById('cr_name_'+idx);
      return el && el.value.trim();
    });
    if(!hasColor){
      nmGoStep(2);
    }else{
      const hasStage = ALL_STAGES.some(s=>{
        const el = document.getElementById('stage_'+s.key+'_enabled');
        return el && el.checked;
      });
      if(!hasStage) nmGoStep(3);
    }
  }
  saveNewModel();
}

/* ---------- دفعات التشغيل ---------- */
function addPaymentRow(payment){
  const p = payment || { id: uid(), amount:'', date: todayStr(), note:'' };
  if(!payment) window._modelPayments.push(p);
  renderPaymentRows();
}

function removePaymentRow(id){
  window._modelPayments = window._modelPayments.filter(p=>p.id!==id);
  renderPaymentRows();
  saveNewModelDraft();
}

function updatePaymentField(id, field, value){
  const p = window._modelPayments.find(x=>x.id===id);
  if(p){ p[field] = value; }
  const total = window._modelPayments.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const totEl = document.getElementById('paymentsTotal');
  if(totEl) totEl.textContent = `إجمالي الدفعات: ${fmt(total)} ج`;
  saveNewModelDraft();
}

function renderPaymentRows(){
  const wrap = document.getElementById('paymentRows');
  if(!wrap) return;
  const list = window._modelPayments || [];
  const total = list.reduce((s,x)=>s+(Number(x.amount)||0),0);

    wrap.innerHTML = `<div style="font-size:12px; color:#8a8070; padding:8px 0;">مفيش دفعات مسجّلة. اضغط "إضافة دفعة" لو العميل دفع مقدّم.</div>`;

  }

      <thead><tr><th>المبلغ (ج)</th><th>التاريخ</th><th>ملاحظة</th><th></th></tr></thead>
      <tbody>
        ${list.map(p=>`
          <tr>

                 oninput="updatePaymentField('${p.id}','amount',this.value)"
                 style="width:110px; padding:7px 9px; border:1.5px solid var(--line); border-radius:6px;"></td>
            <td><input type="date" value="${escapeHtml(p.date||'')}"
                 onchange="updatePaymentField('${p.id}','date',this.value)"
                 style="padding:7px 9px; border:1.5px solid var(--line); border-radius:6px;"></td>
            <td><input type="text" value="${escapeHtml(p.note||'')}" placeholder="مثال: مقدّم خيوط"

/* ---------- ربط الحفظ التلقائي بكل الحقول ---------- */
function attachDraftListeners(){
  const content = document.getElementById('modalContent');
  if(!content) return;
  content.removeEventListener('input', saveNewModelDraft);
  content.removeEventListener('change', saveNewModelDraft);
  content.addEventListener('input', saveNewModelDraft);
  content.addEventListener('change', saveNewModelDraft);
}

function restoreNewModelDraft(){
  const saved = getSavedDraft();
  if(!saved){ toast('مفيش مسودة محفوظة'); return; }
  const d = saved.draft;
  document.getElementById('nm_name').value     = d.name || '';
  document.getElementById('nm_price').value    = d.price || '';
  document.getElementById('nm_expected').value = d.expected || '';

  /* إعادة بناء الألوان */
  document.getElementById('colorRows').innerHTML = '';
  window._colorRowCount = 0;
  (d.colors||[]).forEach(c=>{
    addColorRow();
    const idx = window._colorRowCount;
    document.getElementById('cr_name_'+idx).value  = c.name || '';
    document.getElementById('cr_hex_'+idx).value   = c.hex || '#cccccc';
    document.getElementById('cr_bolts_'+idx).value = c.bolts || '';
    document.getElementById('sizeRows_'+idx).innerHTML = '';
    window['_sizeRowCount_'+idx] = 0;
    (c.sizes||[]).forEach(s=>{
      addSizeRowToColor(idx);
      const sIdx = window['_sizeRowCount_'+idx];
      const sel = document.getElementById(`size_sel_${idx}_${sIdx}`);
      const qty = document.getElementById(`size_qty_${idx}_${sIdx}`);
      if(sel) sel.value = s.size || sel.value;
      if(qty) qty.value = s.qty || '';
    });
    if((c.sizes||[]).length===0) addSizeRowToColor(idx);
    updateColorSizeTotal(idx);
  });
  if((d.colors||[]).length===0){ addColorRow(); addColorRow(); }

  /* إعادة بناء المراحل */
  Object.keys(d.stages||{}).forEach(key=>{
    const s = d.stages[key];
    const en = document.getElementById('stage_'+key+'_enabled');
    if(en) en.checked = !!s.enabled;
    const u = document.getElementById('stage_'+key+'_units');
    if(u) u.value = (s.units === undefined || s.units === '') ? '1' : s.units;
    const t = document.getElementById('stage_'+key+'_time');
    if(t) t.value = s.time || '';
    const c = document.getElementById('stage_'+key+'_cost');
    if(c) c.value = s.cost || '';
  });

  /* إعادة بناء الدفعات */
  window._modelPayments = (d.payments||[]).map(p=>({
    id: p.id || uid(), amount: p.amount || '', date: p.date || todayStr(), note: p.note || ''
  }));
  renderPaymentRows();

  const bar = document.getElementById('draftRestoreBar');
  if(bar) bar.remove();
  toast('تم استرجاع المسودة ✓');
}

async function discardNewModelDraft(){
  const ok = await confirmDialog('هتمسح المسودة المحفوظة نهائياً وتبدأ من فاضي. متأكد؟',
    { title:'مسح المسودة', yes:'امسح وابدأ من جديد', no:'إلغاء', danger:true });
  if(!ok) return;
  clearNewModelDraft();
  const bar = document.getElementById('draftRestoreBar');
  if(bar) bar.remove();
  toast('تم مسح المسودة');
}

  window['_sizeRowCount_'+idx] = 0;
  const wrap = document.getElementById('colorRows');
