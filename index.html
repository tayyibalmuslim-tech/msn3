  card.id = 'colorRow_'+idx;
  card.innerHTML = `
    <div class="cc-head">
      <span class="cc-title">لون رقم ${idx}</span>
      <button class="icon-btn" type="button" title="حذف اللون"
        onclick="document.getElementById('colorRow_${idx}').remove(); nmUpdateTally();">🗑</button>
    </div>
    <div class="color-top">
      <div class="field"><label>اسم اللون</label><input type="text" id="cr_name_${idx}" placeholder="أبيض"></div>
      <div class="field"><label>الدرجة</label><input type="color" id="cr_hex_${idx}" value="#cccccc"></div>

    <div class="size-total" id="sizeTotal_${idx}">إجمالي القطع المتوقعة للون ده: 0</div>

function addSizeRowToColor(colorIdx){
  window['_sizeRowCount_'+colorIdx] = (window['_sizeRowCount_'+colorIdx]||0) + 1;
  const sIdx = window['_sizeRowCount_'+colorIdx];
  const wrap = document.getElementById('sizeRows_'+colorIdx);
  const row = document.createElement('div');
  row.className = 'size-row';
  row.id = `sizeRow_${colorIdx}_${sIdx}`;
  row.innerHTML = `
    <div class="field">
      <label>المقاس</label>
      <select id="size_sel_${colorIdx}_${sIdx}" onchange="updateColorSizeTotal(${colorIdx})">
        ${SIZES.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>عدد القطع</label>
      <input type="number" id="size_qty_${colorIdx}_${sIdx}" placeholder="0" oninput="updateColorSizeTotal(${colorIdx})">
    </div>
    <button class="icon-btn" type="button" title="حذف المقاس"
      onclick="document.getElementById('sizeRow_${colorIdx}_${sIdx}').remove(); updateColorSizeTotal(${colorIdx});">🗑</button>
  `;

function updateColorSizeTotal(colorIdx){
  const rows = document.querySelectorAll(`#sizeRows_${colorIdx} .size-row`);
  let total = 0;
  rows.forEach(row=>{
    const qtyInput = row.querySelector('input[type="number"]');
    total += Number(qtyInput.value)||0;
  });
  const totalEl = document.getElementById('sizeTotal_'+colorIdx);
  if(totalEl) totalEl.textContent = `إجمالي القطع المتوقعة للون ده: ${total}`;
  if(typeof nmUpdateTally === 'function') nmUpdateTally();
}

function saveNewModel(){
  if(!requireEdit('models','إضافة موديل')) return;
  const name = document.getElementById('nm_name').value.trim();
  const price = Number(document.getElementById('nm_price').value);
  const expected = Number(document.getElementById('nm_expected').value);

  if(!name){ toast('اكتب اسم الموديل الأول'); return; }
  if(!price || price<=0){ toast('اكتب سعر بيع صحيح'); return; }
  if(!expected || expected<=0){ toast('اكتب العدد المتوقع'); return; }

  const colorRows = document.querySelectorAll('#colorRows .color-card');
  const colors = [];
  colorRows.forEach(card=>{
    const idx = card.id.split('_')[1];
    const cname = document.getElementById('cr_name_'+idx).value.trim();
    const chex = document.getElementById('cr_hex_'+idx).value;
    const cbolts = Number(document.getElementById('cr_bolts_'+idx).value)||0;
    if(!cname) return;

    const sizeBreakdown = [];
    const sizeRows = card.querySelectorAll(`#sizeRows_${idx} .size-row`);
    sizeRows.forEach(sRow=>{
      const select = sRow.querySelector('select');
      const qtyInput = sRow.querySelector('input[type="number"]');
      const size = select.value;
      const qty = Number(qtyInput.value)||0;
      if(qty>0) sizeBreakdown.push({size, qty});
    });

    colors.push({id:uid(), name:cname, hex:chex, expectedBolts:cbolts, receivedBolts:0, sizeBreakdown});
  });
  if(colors.length===0){ toast('ضيف لون واحد على الأقل'); return; }

  const stagesPlanned = [];
  const stageLogs = {};
  const stageWorkers = {};
  ALL_STAGES.forEach(st=>{
    const enabled = document.getElementById('stage_'+st.key+'_enabled').checked;
    if(!enabled) return;
    const time = Number(document.getElementById('stage_'+st.key+'_time').value)||0;
    const cost = st.internal ? null : (Number(document.getElementById('stage_'+st.key+'_cost').value)||0);
    const unitsEl = document.getElementById('stage_'+st.key+'_units');
    const units = Math.max(Number(unitsEl ? unitsEl.value : 1) || 1, 0.1);
    stagesPlanned.push({key:st.key, label:st.label, internal:st.internal, expectedTime:time, expectedCost:cost, unitsPerPiece:units});
    stageLogs[st.key] = [];
    stageWorkers[st.key] = [];
  });
  if(stagesPlanned.length===0){ toast('حدد مرحلة واحدة على الأقل للموديل'); return; }

  /* دفعات التشغيل الواردة من العميل — نتجاهل الصفوف الفاضية */
  const payments = (window._modelPayments||[])
    .filter(p=>Number(p.amount) > 0)
    .map(p=>({
      id: p.id || uid(),
      amount: Number(p.amount) || 0,
      date: p.date || todayStr(),
      note: (p.note||'').trim(),
      createdAt: Date.now()
    }));

  const model = {
    id: uid(), name, sellPrice:price, expectedTotal:expected,
    colors, stagesPlanned, cutParts:[], stageLogs, stageWorkers, sewingOps:[],
    payments, createdAt: Date.now()
  };
  state.models.push(model);
  saveState();
  /* الموديل اتحفظ بنجاح — المسودة بقت مالهاش لزمة */
  clearNewModelDraft();
  window._newModelOpen = false;
  window._modelPayments = [];
  closeModal();
  renderModelGrid();
  toast('تم إنشاء الموديل ✓');
  openModelDetail(model.id);
}

function closeModal(){
  /* شبكة أمان: لو أي كود تاني قفل المودال والنموذج مفتوح، نصفّر الحالة.
     المسودة نفسها بتكون اتحفظت تلقائي، فالبيانات مش بتضيع. */
  window._newModelOpen = false;
  if(window._measure){ clearInterval(window._measureTimer); window._measure = null; }
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalContent').innerHTML = '';
}

/* ============================================================
   تفاصيل الموديل
============================================================ */
let currentModelId = null;
let currentDetailTab = 'overview';
let currentSewingOpIndex = null;
let currentSewingWorkerId = null;

function openModelDetail(id){
  currentModelId = id;
  currentDetailTab = 'overview';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active');
  renderModelDetail();
}

function backToModels(){
  currentModelId = null;
  document.getElementById('view-detail').classList.remove('active');
  document.getElementById('view-models').classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="models"]').classList.add('active');
  renderModelGrid();
}

function getCurrentModel(){ return state.models.find(m=>m.id===currentModelId); }

function renderModelDetail(){
  const m = getCurrentModel();
  if(!m){ backToModels(); return; }

  const cost = calcModelCost(m);
  const canFinance = hasPerm('finance','view');
  const receivedTotal = m.colors.reduce((s,c)=>s+(Number(c.receivedBolts)||0),0);
  const expectedBoltsTotal = m.colors.reduce((s,c)=>s+(Number(c.expectedBolts)||0),0);

  const tabsHtml = `
    <div class="stage-tabs">
      <div class="stage-tab ${currentDetailTab==='overview'?'active':''}" onclick="switchDetailTab('overview')">نظرة عامة</div>
      <div class="stage-tab ${currentDetailTab==='receiving'?'active':''}" onclick="switchDetailTab('receiving')">استلام المخزون</div>
      <div class="stage-tab ${currentDetailTab==='cutting'?'active':''}" onclick="switchDetailTab('cutting')">بعد القص</div>
      <div class="stage-tab ${currentDetailTab==='workers'?'active':''}" onclick="switchDetailTab('workers')">⏱️ العمال والمعايير</div>
      ${(m.stagesPlanned||[]).map(sp=>{
        const hasLogs = (m.stageLogs[sp.key]||[]).length>0;
        return `<div class="stage-tab ${currentDetailTab===sp.key?'active':''} ${hasLogs?'done-marker':''}" onclick="switchDetailTab('${sp.key}')">${sp.label}</div>`;
      }).join('')}
      ${canFinance ? `<div class="stage-tab ${currentDetailTab==='cost'?'active':''}" onclick="switchDetailTab('cost')">💰 التكلفة والربح</div>` : ''}
    </div>
  `;

  let bodyHtml = '';
  if(currentDetailTab==='overview') bodyHtml = renderOverviewTab(m, cost);
  else if(currentDetailTab==='receiving') bodyHtml = renderReceivingTab(m);
  else if(currentDetailTab==='cutting') bodyHtml = renderCuttingTab(m);
  else if(currentDetailTab==='workers') bodyHtml = renderWorkersTab(m);
  else if(currentDetailTab==='cost' && canFinance) bodyHtml = renderCostTab(m, cost);
  else if(currentDetailTab==='cost'){ currentDetailTab='overview'; bodyHtml = renderOverviewTab(m, cost); }
  else bodyHtml = renderStageLogTab(m, currentDetailTab);

  document.getElementById('view-detail').innerHTML = `
    <div class="back-btn" onclick="backToModels()">→ رجوع للموديلات</div>
    <div class="model-detail-header">
      <div>
        <h2>${escapeHtml(m.name)}</h2>
        <div style="font-size:12px; color:#8a8070; margin-top:4px;">
          استلام: ${fmt(receivedTotal)}/${fmt(expectedBoltsTotal)} ثوب &nbsp;•&nbsp;
          قص: ${fmt(getTotalCutQty(m))}/${fmt(m.expectedTotal)} قطعة
        </div>
      </div>
      ${canFinance ? `<div class="price-tag">${fmt(m.sellPrice)} ج / قطعة</div>` : ''}
    </div>
    ${tabsHtml}
    <div id="detailBody">${bodyHtml}</div>
  `;
}

function switchDetailTab(tab){ currentDetailTab = tab; renderModelDetail(); }

function renderWorkersTab(m){
  const canEdit = hasPerm('models','edit');
  const stages = (m.stagesPlanned||[]).filter(sp=>sp.internal);
  const prodHours = getProductiveHoursPerDay();

  if(stages.length===0){
    return `<div class="panel"><h2>العمال والمعايير</h2>
      <div style="font-size:13px; color:#8a8070;">الموديل ده مفيهوش مراحل داخلية (مقص/خياطة/امباج)، فمفيش عمال يتسجلوا عليه.</div></div>`;
  }

  const bottleneck = stages
    .map(sp=>({ sp, cap: getStageDailyCapacity(m, sp.key) }))
    .filter(x=>x.cap.withStandard > 0)
    .sort((a,b)=>a.cap.pieces - b.cap.pieces)[0];

  return `
    <div class="panel">
      <h2><span class="title-txt">⏱️ الطاقة اليومية للموديل</span></h2>
      <p style="font-size:12px; color:#8a8070; margin-bottom:12px;">
        الحساب مبني على <strong>${fmt(prodHours)} ساعات إنتاج فعلية</strong> في اليوم
        (${fmt(Number(state.factory.workHoursPerDay)||9)} ساعة دوام − ${fmt(BREAK_HOURS_PER_DAY)} ساعة راحة).
      </p>
      ${bottleneck ? `
        <div style="background:#fff7e6; border:1.5px solid #e0a800; border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;">
          🚧 <strong>الاختناق:</strong> مرحلة <strong>${escapeHtml(bottleneck.sp.label)}</strong> — أبطأ مرحلة بطاقة
          <strong>${fmt(Math.floor(bottleneck.cap.pieces))} قطعة/يوم</strong>.
          الموديل كله مش هيعدّي الرقم ده مهما كانت باقي المراحل أسرع.
          ${m.expectedTotal>0 && bottleneck.cap.pieces>0
            ? `<br>الطلبية ${fmt(m.expectedTotal)} قطعة → محتاجة تقريباً <strong>${fmt(Math.ceil(m.expectedTotal/bottleneck.cap.pieces))} يوم</strong>.`
            : ''}
        </div>` : `
        <div style="font-size:13px; color:#8a8070; margin-bottom:14px;">لسه مفيش معايير مسجلة. قيس معيار عامل واحد على الأقل عشان تشوف الطاقة والاختناق.</div>`}

        <thead><tr><th>المرحلة</th><th>وحدات/قطعة</th><th>عمال</th><th>الطاقة (وحدة/يوم)</th><th>الطاقة (قطعة/يوم)</th></tr></thead>

              <td>×${fmt(sp.unitsPerPiece||1)}</td>
              <td>${cap.withStandard}/${cap.total} لهم معيار</td>

}

      ${canEdit ? `
        <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;">

            <tbody>
              ${workers.map(w=>{
                const has = w.standard && w.standard.secPerPiece>0;
                const units = has ? unitsPerDayFromStandard(w.standard.secPerPiece) : 0;
                const hist = (w.history||[]).length;
                return `<tr>
                  <td><strong>${escapeHtml(getEmployeeName(w.employeeId))}</strong>
                    ${hist?`<div class="hint">${hist} قياس سابق</div>`:''}</td>
                  <td>${has
                    ? `<span class="badge ok">${fmt(w.standard.secPerPiece.toFixed(1))} ث/وحدة</span>
                       <div class="hint">${fmt(w.standard.pieceCount)} وحدة في ${fmtDuration(w.standard.totalSeconds)}</div>`
                    : `<span class="badge pending">لسه مفيش معيار</span>`}</td>
                  <td>${has?fmt(Math.floor(units)):'—'}</td>
                  <td><strong>${has?fmt(Math.floor(piecesFromUnits(units, upp))):'—'}</strong></td>
                  <td style="white-space:nowrap;">
                    ${canEdit?`<button class="btn small ${has?'ghost':'brass'}" onclick="startStandardMeasurement('${sp.key}','${w.employeeId}')">${has?'🔄 إعادة قياس':'📏 قياس'}</button>`:''}
                    ${canEdit?`<button class="icon-btn" onclick="removeStageWorker('${sp.key}','${w.employeeId}')">🗑</button>`:''}

                </tr>`;
              }).join('')}
            </tbody>
          </table>`}

      ${canEdit ? (available.length===0
        ? `<div class="hint">${(state.factory.employees||[]).some(e=>e.dept===sp.key)
            ? 'كل موظفي القسم مضافين بالفعل على المرحلة دي.'
            : 'مفيش موظفين مسجلين في القسم ده. ضيفهم من "إعدادات المصنع" الأول.'}</div>`
        : `<div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;">
            <div class="field" style="flex:1; min-width:180px; margin:0;">
              <label>إضافة عامل للمرحلة</label>
              <select id="addw_${sp.key}">
                ${available.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}
              </select>
            </div>
            <button class="btn brass small" onclick="addStageWorker('${sp.key}')">+ إضافة</button>
          </div>`) : ''}
    </div>
  `;
}

function updateStageUnitsPerPiece(stageKey){
  if(!requireEdit('models','تعديل المرحلة')) return;
  const m = getCurrentModel(); if(!m) return;
  const sp = (m.stagesPlanned||[]).find(s=>s.key===stageKey); if(!sp) return;
  const v = Number(document.getElementById('upp_'+stageKey).value);
  if(!v || v<=0){ toast('اكتب رقم أكبر من صفر'); return; }
  sp.unitsPerPiece = v;
  saveState();
  toast('تم التحديث ✓');
  renderModelDetail();
}

function addStageWorker(stageKey){
  if(!requireEdit('models','إضافة عامل')) return;
  const m = getCurrentModel(); if(!m) return;
  const employeeId = document.getElementById('addw_'+stageKey).value;
  if(!employeeId){ toast('اختر عامل'); return; }
  const workers = getStageWorkers(m, stageKey);
  if(workers.some(w=>w.employeeId===employeeId)){ toast('العامل ده مضاف بالفعل'); return; }
  workers.push({ employeeId, standard:null, history:[] });
  saveState();
  toast('تمت الإضافة ✓');
  renderModelDetail();
}

async function removeStageWorker(stageKey, employeeId){
  if(!requireEdit('models','حذف عامل')) return;
  const m = getCurrentModel(); if(!m) return;
  const ok = await confirmDialog(
    `هتشيل ${getEmployeeName(employeeId)} من المرحلة دي، وهيتمسح معياره وكل قياساته السابقة على الموديل ده.`,
    { title:'إزالة عامل', yes:'شيله', no:'إلغاء', danger:true });
  if(!ok) return;
  m.stageWorkers[stageKey] = getStageWorkers(m, stageKey).filter(w=>w.employeeId!==employeeId);
  saveState();
  toast('تم الحذف');
  renderModelDetail();
}

/* ---------- عداد قياس المعيار ---------- */
window._measure = null;   /* {stageKey, employeeId, marks:[], startTime} */
window._measureTimer = null;

function startStandardMeasurement(stageKey, employeeId){
  if(!requireEdit('models','قياس معيار')) return;
  window._measure = { stageKey, employeeId, marks:[], startTime:Date.now() };
  renderMeasureModal();
}

function renderMeasureModal(){
  const m = getCurrentModel(); if(!m || !window._measure) return;
  const sp = (m.stagesPlanned||[]).find(s=>s.key===window._measure.stageKey);
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="cancelMeasurement()">✕</button>
    <h3>📏 قياس معيار — ${escapeHtml(getEmployeeName(window._measure.employeeId))}</h3>
    <div style="text-align:center; font-size:12px; color:#8a8070; margin-bottom:6px;">
      ${escapeHtml(m.name)} — ${escapeHtml(sp?sp.label:'')}
    </div>
    <div style="text-align:center; padding:18px 0;">
      <div id="msCount" style="font-size:60px; font-weight:800; line-height:1; color:var(--brass, #b8860b);">0</div>
      <div style="font-size:13px; color:#8a8070; margin-top:6px;">وحدة</div>
      <div id="msClock" style="font-size:22px; color:#8a8070; margin-top:10px; font-variant-numeric:tabular-nums;">00:00</div>
      <div id="msRate" style="font-size:13px; color:#8a8070; margin-top:6px;">السرعة هتظهر بعد أول وحدة</div>
    </div>
    <button class="btn green full" style="padding:26px; font-size:20px; font-weight:800;" onclick="markPiece()">✅ أنتج وحدة</button>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn ghost" style="flex:1;" onclick="undoPiece()">↩️ تراجع</button>
      <button class="btn ghost" style="flex:1;" onclick="cancelMeasurement()">إلغاء</button>
    </div>
    <button class="btn brass full" style="margin-top:10px;" onclick="finishMeasurement()">⏹ إنهاء واعتماد المعيار</button>
    <p style="font-size:11px; color:#8a8070; margin-top:12px; line-height:1.6;">
      ⚠️ العامل عارف إنه بيتقاس، فغالباً هيشتغل أسرع من المعتاد. خد القياس على عدد وحدات محترم (20+) عشان الرقم يبقى واقعي.
    </p>
  `;
  document.getElementById('modalOverlay').classList.add('active');
  clearInterval(window._measureTimer);
  window._measureTimer = setInterval(updateMeasureDisplay, 1000);
  updateMeasureDisplay();
}

function updateMeasureDisplay(){
  if(!window._measure){ clearInterval(window._measureTimer); return; }
  const elapsed = (Date.now() - window._measure.startTime)/1000;
  const n = window._measure.marks.length;
  const c = document.getElementById('msCount'); if(c) c.textContent = fmt(n);
  const k = document.getElementById('msClock'); if(k) k.textContent = fmtDuration(elapsed);
  const r = document.getElementById('msRate');
  if(r){
    if(n===0){ r.textContent = 'السرعة هتظهر بعد أول وحدة'; }
    else {
      const per = elapsed/n;
      r.innerHTML = `متوسط <strong>${fmt(per.toFixed(1))} ث/وحدة</strong> — يعني ${fmt(Math.floor(unitsPerDayFromStandard(per)))} وحدة في اليوم`;
    }
  }
}

function markPiece(){
  if(!window._measure) return;
  window._measure.marks.push(Date.now());
  updateMeasureDisplay();
}
function undoPiece(){
  if(!window._measure || window._measure.marks.length===0){ toast('مفيش وحدات لسه'); return; }
  window._measure.marks.pop();
  updateMeasureDisplay();
}

async function cancelMeasurement(){
  if(window._measure && window._measure.marks.length>0){
    const ok = await confirmDialog('هتلغي جلسة القياس ومش هيتحفظ أي حاجة. متأكد؟',
      { title:'إلغاء القياس', yes:'ألغِ الجلسة', no:'ارجع أكمّل', danger:true });
    if(!ok) return;
  }
  clearInterval(window._measureTimer);
  window._measure = null;
  closeModal();
}

async function finishMeasurement(){
  if(!window._measure) return;
  const n = window._measure.marks.length;
  if(n===0){ toast('سجّل وحدة واحدة على الأقل'); return; }
  const totalSeconds = Math.round((Date.now() - window._measure.startTime)/1000);
  const secPerPiece = totalSeconds / n;

  const m = getCurrentModel(); if(!m) return;
  const upp = getStageUnitsPerPiece(m, window._measure.stageKey);
  const perDay = unitsPerDayFromStandard(secPerPiece);

  const ok = await confirmDialog(
    `المعيار: ${secPerPiece.toFixed(1)} ث/وحدة (من ${n} وحدة في ${fmtDuration(totalSeconds)}).\n` +
    `يعني ${Math.floor(perDay)} وحدة/يوم = ${Math.floor(piecesFromUnits(perDay, upp))} قطعة/يوم.\n\nأعتمده؟`,
    { title:'اعتماد المعيار', yes:'اعتمد', no:'إلغاء' });
  if(!ok) return;

  const worker = getStageWorkers(m, window._measure.stageKey)
    .find(w=>w.employeeId===window._measure.employeeId);
  if(worker){
    /* القياس القديم بيتحفظ في التاريخ بدل ما يتمسح */
    if(worker.standard){
      if(!Array.isArray(worker.history)) worker.history = [];
      worker.history.push(worker.standard);
    }
    worker.standard = { pieceCount:n, totalSeconds, secPerPiece, recordedAt: Date.now() };
    saveState();
    toast('تم اعتماد المعيار ✓');
  }
  clearInterval(window._measureTimer);
  window._measure = null;
  closeModal();
  renderModelDetail();
}

function addModelPayment(){

  const m = state.models.find(x=>x.id===currentModelId);
  if(!m) return;
  const amount = Number(document.getElementById('mp_amount').value);
  const date = document.getElementById('mp_date').value || todayStr();
  const note = document.getElementById('mp_note').value.trim();
  if(!amount || amount<=0){ toast('اكتب مبلغ صحيح'); return; }

  m.payments.push({ id:uid(), amount, date, note, createdAt:Date.now() });

  toast('تمت إضافة الدفعة ✓');

async function deleteModelPayment(paymentId){
  if(!requireEdit('models','حذف دفعة')) return;
  const m = state.models.find(x=>x.id===currentModelId);
  if(!m) return;
  const p = (m.payments||[]).find(x=>x.id===paymentId);
  if(!p) return;
  const ok = await confirmDialog(`هتمسح دفعة ${fmt(p.amount)} ج بتاريخ ${p.date}؟`,
    { title:'حذف دفعة', yes:'احذف', no:'إلغاء', danger:true });

  m.payments = m.payments.filter(x=>x.id!==paymentId);

  renderModelDetail();
}

function deleteModel(){
  if(!confirm('متأكد إنك عايز تمسح الموديل ده نهائياً؟')) return;
  state.models = state.models.filter(m=>m.id!==currentModelId);
  saveState();

  backToModels();
}

document.getElementById('fabAdd').addEventListener('click', openAddModelModal);

  if(e.target.id !== 'modalOverlay') return;
  /* نموذج "موديل جديد" مبيتقفلش بالكليك الخارجي — ده كان بيمسح شغل ساعة
     في كليك واحد بالغلط. القفل بيتم من زر ✕ أو "إلغاء" أو Esc، وكلهم
     بيمروا على closeAddModelModal اللي بيسأل ويحفظ المسودة. */
  if(window._newModelOpen){ closeAddModelModal(); return; }
  if(window._measure){ cancelMeasurement(); return; }
  closeModal();
});

/* زر Esc يقفل المودال — وبيمر على المسار الآمن لو فيه شغل مش متحفظ */
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  const overlay = document.getElementById('modalOverlay');
  if(!overlay || !overlay.classList.contains('active')) return;
  if(window._newModelOpen){ closeAddModelModal(); return; }
  if(window._measure){ cancelMeasurement(); return; }
  closeModal();
});

/* مسافة أو Enter = "أنتج وحدة" أثناء القياس — أسرع بكتير من الدوس بالماوس */
document.addEventListener('keydown', (e)=>{
  if(!window._measure) return;
  if(e.key !== ' ' && e.key !== 'Enter') return;
  if(['INPUT','TEXTAREA','SELECT'].includes((e.target.tagName||'').toUpperCase())) return;
  e.preventDefault();
  markPiece();
});

  try{
    /* ملحوظة: إنشاء المستخدم بيسجّل الدخول بحسابه تلقائياً في Firebase Auth (سلوك SDK القياسي)،
       فبنرجع نسجّل دخول تاني بحساب الأدمن الحالي فوراً بعدها عشان الجلسة متتغيرش. */
    const adminEmail = window.currentUser.email;
    const cred = await window._createUser(window._auth, email, password);
    await window._fsset(window._fsdoc(window._db, 'users', cred.user.uid), {
      email, permissions: perms, createdAt: Date.now()
    });
    toast('✅ تم إنشاء المستخدم — سجل دخولك تاني بحسابك من فضلك');
    await window._auth.signOut();
    document.getElementById('loginEmail').value = adminEmail;
  }catch(e){
    toast('❌ فشل إنشاء المستخدم: ' + (e.message||''));
  }
}

async function updateUserPermission(uid, sectionKey, newVal){
  if(!requireEdit('users','تعديل صلاحية')) return;
  try{
    const uref = window._fsdoc(window._db, 'users', uid);
    const snap = await window._fsget(uref);
    const data = snap.data();
    const perms = data.permissions || {};
    perms[sectionKey] = newVal;
    await window._fsset(uref, { ...data, permissions: perms });
    toast('✅ اتحدثت الصلاحية');
    if(uid===window.currentUser.uid){
      window.currentPermissions = perms;
      document.getElementById('usersTabBtn').style.display = (perms.users==='edit') ? 'inline-block' : 'none';
      document.getElementById('attendanceTabBtn').style.display = (perms.attendance==='view' || perms.attendance==='edit') ? 'inline-block' : 'none';
      document.getElementById('modelsTabBtn').style.display = (perms.models==='view' || perms.models==='edit') ? 'inline-flex' : 'none';
      document.getElementById('monthTabBtn').style.display = (perms.finance==='view' || perms.finance==='edit') ? 'inline-flex' : 'none';
      document.getElementById('dailyTabBtn').style.display = (perms.finance==='view' || perms.finance==='edit') ? 'inline-flex' : 'none';
      document.getElementById('treasuryTabBtn').style.display = (perms.treasury==='view' || perms.treasury==='edit') ? 'inline-flex' : 'none';
      document.getElementById('salesTabBtn').style.display = (perms.sales==='view' || perms.sales==='edit') ? 'inline-flex' : 'none';
      document.getElementById('statProfitWrap').style.display = (perms.finance==='view' || perms.finance==='edit') ? '' : 'none';
    }
  }catch(e){
    toast('❌ فشل تحديث الصلاحية');
  }
}


/* ============================================================
   الحضور والانصراف
============================================================ */
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
window._attendanceMonthKey = null;
window._attendanceDayKey = null;

function monthKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; } // m=0..11
function dayKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

function renderAttendanceView(){
  const el = document.getElementById('view-attendance');
  if(!hasPerm('attendance','view')){
    el.innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض هذه الصفحة</div>`;
    return;
  }

  const now = new Date();
  if(!window._attendanceMonthKey){
    window._attendanceYear = now.getFullYear();
    window._attendanceMonth = now.getMonth();
  }
  const y = window._attendanceYear, m = window._attendanceMonth;
  window._attendanceMonthKey = monthKey(y,m);
  const totalDays = daysInMonth(y,m);
  if(!window._attendanceDayKey){
    window._attendanceDayKey = dayKey(y,m, Math.min(now.getDate(), totalDays));
  }

  const canEdit = hasPerm('attendance','edit');
  const mk = monthKey(y,m);
  const monthData = state.attendance[mk] || {};
  const employees = state.factory.employees || [];
  const isCurrentMonth = (y===now.getFullYear() && m===now.getMonth());
  const todayNum = now.getDate();
  const WD = ['أح','إث','ث','أر','خ','ج','س'];
  const days = Array.from({length: totalDays}, (_,i)=>i+1);

  const grid = employees.length===0
    ? `<div class="empty-state"><div class="icon">👥</div><p>مفيش موظفين مسجلين في إعدادات المصنع لسه.</p></div>`
    : `
    <div class="att-grid-wrap">
      <table class="att-grid">
        <thead>
          <tr>
            <th class="emp-col">الموظف</th>
            ${days.map(d=>{
              const dk = dayKey(y,m,d);
              const dow = new Date(y,m,d).getDay();
              const cls = [ 'day',
                (isCurrentMonth && d===todayNum) ? 'today' : '',
                dow===5 ? 'fri' : '',
                dk===window._attendanceDayKey ? 'sel' : ''
              ].filter(Boolean).join(' ');
              return `<th class="${cls}" onclick="selectAttendanceDay('${dk}')" title="افتح تفاصيل يوم ${d}">
                <div class="dn">${d}</div><div class="dw">${WD[dow]}</div>
              </th>`;
            }).join('')}
            <th class="stat">حضر</th>
            <th class="stat">غاب</th>
            <th class="stat">محسوب</th>
          </tr>
        </thead>
        <tbody>
          ${employees.map(emp=>{
            let nPresent=0, nAbsent=0, nFriday=0;
            const cells = days.map(d=>{
              const dk = dayKey(y,m,d);
              const dow = new Date(y,m,d).getDay();
              const rec = (monthData[dk]||{})[emp.id] || {};
              const isFuture = isCurrentMonth && d>todayNum;
              const friCol = dow===5 ? ' fri-col' : '';

              let inner, title;
              if(rec.type==='friday'){
                nFriday++;
                inner = `<div class="att-mark friday">🕌 ج</div>`;
                title = 'جمعة مدفوعة';
              } else if(rec.status==='present'){
                nPresent++;
                const ci = rec.checkIn || '—';
                const co = rec.checkOut || '';
                inner = `<div class="att-pair">
                  <div class="ci">▲ ${escapeHtml(ci)}</div>
                  <div class="co ${co?'':'none'}">${co ? '▼ '+escapeHtml(co) : '▼ …'}</div>
                </div>`;
                title = `حاضر — ${rec.checkIn||'?'} ◀ ${rec.checkOut||'?'}`;
              } else if(rec.status==='absent'){
                nAbsent++;
                inner = `<div class="att-mark absent">غ</div>`;
                title = 'غايب';
              } else if(isFuture){
                inner = `<div class="att-mark future">—</div>`;
                title = 'يوم لسه ما جاش';
              } else {
                inner = `<div class="att-mark empty">✕</div>`;
                title = canEdit ? 'اضغط لتسجيل حضور' : 'مش مسجّل';
              }

              const clickable = canEdit && !isFuture;
              const cls = `att-cell${friCol}${isFuture?' future':''}${clickable?'':' ro'}`;
              const onclick = clickable ? ` onclick="cycleAttendanceCell('${emp.id}','${dk}')"` : '';
              return `<td class="${cls}"${onclick} title="${escapeHtml(title)}">${inner}</td>`;
            }).join('');

            const effective = nPresent + nFriday;
            return `<tr>
              <td class="emp-col">
                <div class="en">${escapeHtml(emp.name)}</div>
                ${emp.dept ? `<div class="ed">${escapeHtml(deptLabel(emp.dept))}</div>` : ''}
              </td>
              ${cells}
              <td class="stat p">${nPresent}</td>
              <td class="stat a">${nAbsent}</td>
              <td class="stat e">${effective}/30</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  el.innerHTML = `
    <div class="panel">
      <div class="att-toolbar">
        <h2 style="margin:0; border:none; padding:0;"><span class="title-txt">🕒 كشف الحضور الشهري</span></h2>
        <div class="month-nav">
          <button onclick="shiftAttendanceMonth(-1)" title="الشهر السابق">◀</button>
          <span class="mlabel">${ARABIC_MONTHS[m]} ${y}</span>
          <button onclick="shiftAttendanceMonth(1)" title="الشهر التالي">▶</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <span class="att-pill">${totalDays} يوم — الشهر المالي 30 يوم ثابت</span>
          ${isCurrentMonth ? `<span class="att-pill now">● الشهر الحالي</span>` : ''}
        </div>
      </div>

      <div class="att-legend">
        <span class="lg"><i class="p">▲</i> حاضر (دخول/خروج)</span>
        <span class="lg"><i class="a">غ</i> غايب</span>
        <span class="lg"><i class="f">ج</i> جمعة مدفوعة</span>
        <span class="lg"><i class="n">✕</i> مش مسجّل</span>
        <span class="hintx">${canEdit
          ? 'اضغط على الخانة تلف: فاضي ← حاضر ← غايب ← جمعة ← فاضي · واضغط على رقم اليوم فوق عشان تظبط المواعيد بالتفصيل تحت'
          : 'عرض فقط — التعديل محتاج صلاحية'}</span>
      </div>

      ${grid}
    </div>

    <div class="panel" id="attendanceDayPanel"></div>
  `;
  renderAttendanceDayPanel();
}

/* دورة حالة الخانة في الكشف الشهري: فاضي ← حاضر ← غايب ← جمعة ← فاضي */
function cycleAttendanceCell(empId, dk){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const mk = dk.slice(0,7);
  if(!state.attendance[mk]) state.attendance[mk] = {};
  if(!state.attendance[mk][dk]) state.attendance[mk][dk] = {};
  if(!state.attendance[mk][dk][empId]){
    state.attendance[mk][dk][empId] = {
      status:null, checkIn:'', checkOut:'',
      otHours:0, latePen:0, earlyPen:0, absPenalty:null, type:null
    };
  }
  const rec = state.attendance[mk][dk][empId];

  if(rec.type === 'friday'){
    rec.type = null; rec.status = null; rec.checkIn=''; rec.checkOut='';
  } else if(rec.status === 'present'){
    rec.status = 'absent'; rec.type = null; rec.checkIn=''; rec.checkOut='';
  } else if(rec.status === 'absent'){
    rec.status = 'present'; rec.type = 'friday'; rec.checkIn=''; rec.checkOut='';
  } else {
    rec.status = 'present'; rec.type = null;
  }

  window._attendanceDayKey = dk;
  saveState();
  renderAttendanceView();
}

function shiftAttendanceMonth(delta){
  let m = window._attendanceMonth + delta;
  let y = window._attendanceYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  window._attendanceMonth = m;
  window._attendanceYear = y;
  window._attendanceMonthKey = monthKey(y,m);
  window._attendanceDayKey = dayKey(y,m,1);
  renderAttendanceView();
}

function selectAttendanceDay(dk){
  window._attendanceDayKey = dk;
  renderAttendanceView();
}

            <button class="att-status-btn friday ${rec.type==='friday'?'active':''}" ${!canEdit?'disabled':''} onclick="toggleFridayPaid('${emp.id}')" title="جمعة مدفوعة">🕌 جمعة</button>
          </div>
          <div class="att-times" id="attTimes_${emp.id}" style="${rec.status==='present'?'':'display:none;'}">
            <div class="att-time-field">
              <label>دخول</label>
              <div class="att-time-input-wrap">
                <input type="time" id="attIn_${emp.id}" value="${rec.checkIn||''}" ${!canEdit?'disabled':''} onchange="saveAttendanceTime('${emp.id}')">
                ${canEdit ? `<button class="icon-btn" title="الوقت الحالي" onclick="setNowTime('${emp.id}','in')">⏱</button>` : ''}
              </div>
            </div>
            <div class="att-time-field">
              <label>خروج</label>
              <div class="att-time-input-wrap">
                <input type="time" id="attOut_${emp.id}" value="${rec.checkOut||''}" ${!canEdit?'disabled':''} onchange="saveAttendanceTime('${emp.id}')">
                ${canEdit ? `<button class="icon-btn" title="الوقت الحالي" onclick="setNowTime('${emp.id}','out')">⏱</button>` : ''}
              </div>
            </div>
            <div class="att-time-field">
              <label>سهر (ساعة)</label>
              <div class="att-time-input-wrap">
                <input type="number" step="0.5" min="0" id="attOT_${emp.id}" value="${rec.otHours||''}" placeholder="0" ${!canEdit?'disabled':''} onchange="saveAttendanceOT('${emp.id}')" style="width:80px;">
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
}

function ensureAttendanceSlot(empId){
  const mk = window._attendanceMonthKey;
  const dk = window._attendanceDayKey;
  if(!state.attendance[mk]) state.attendance[mk] = {};
  if(!state.attendance[mk][dk]) state.attendance[mk][dk] = {};
  if(!state.attendance[mk][dk][empId]) state.attendance[mk][dk][empId] = {
    status:null, checkIn:'', checkOut:'',
    otHours:0, latePen:0, earlyPen:0, absPenalty:null, type:null
  };
  const rec = state.attendance[mk][dk][empId];
  if(rec.otHours===undefined) rec.otHours = 0;
  if(rec.latePen===undefined) rec.latePen = 0;
  if(rec.earlyPen===undefined) rec.earlyPen = 0;
  if(rec.absPenalty===undefined) rec.absPenalty = null;
  if(rec.type===undefined) rec.type = null;
  return rec;
}

function setAttendanceStatus(empId, status){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  rec.status = status;
  rec.type = null;
  if(status==='absent'){ rec.checkIn=''; rec.checkOut=''; }
  saveState();
  renderAttendanceDayPanel();
  renderAttendanceView();
}

function toggleFridayPaid(empId){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  if(rec.type === 'friday'){
    rec.type = null;
    rec.status = null;
  } else {
    rec.type = 'friday';
    rec.status = 'present';
    rec.checkIn = ''; rec.checkOut = '';
  }
  saveState();
  renderAttendanceDayPanel();
  renderAttendanceView();
}

function setNowTime(empId, which){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const val = `${hh}:${mm}`;
  const rec = ensureAttendanceSlot(empId);
  rec.status = 'present';
  if(which==='in') rec.checkIn = val; else rec.checkOut = val;
  saveState();
  renderAttendanceDayPanel();
  renderAttendanceView();
}

function saveAttendanceTime(empId){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  rec.status = 'present';
  rec.checkIn = document.getElementById('attIn_'+empId).value || '';
  rec.checkOut = document.getElementById('attOut_'+empId).value || '';
  saveState();
  renderAttendanceView();
}

function saveAttendanceOT(empId){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  rec.otHours = Number(document.getElementById('attOT_'+empId).value) || 0;
  saveState();
}

/* ============================================================
   الرسوم البيانية الشهرية (SVG بسيط، بدون مكتبات خارجية)
============================================================ */
function chartEmpty(msg){
  return `<div class="chart-empty">${escapeHtml(msg)}</div>`;
}

function chartDailyNet(ms){
  const n = ms.days;
  const active = ms.list.filter(p=>p.active);
  if(active.length === 0) return chartEmpty('مفيش أي إنتاج مسجل في الشهر ده لسه، فمفيش حاجة تترسم.');

  const W = 720, H = 200, padX = 10, padT = 18, padB = 30;
  const plotH = H - padT - padB;
  const vals = active.map(p=>p.profit);
  const maxV = Math.max(0, ...vals);
  const minV = Math.min(0, ...vals);
  const range = (maxV - minV) || 1;
  const yOf = v => padT + plotH * (maxV - v) / range;
  const zeroY = yOf(0);
  const slot = (W - 2*padX) / n;
  const bw = Math.max(2, slot * 0.62);
  const xOf = i => W - padX - (i + 0.5) * slot;

  let bars = '', labels = '';
  ms.list.forEach((p, i)=>{
    const cx = xOf(i);
    if(p.active){
      const y = yOf(p.profit);
      const top = Math.min(y, zeroY);
      const h = Math.max(1.5, Math.abs(y - zeroY));
      const col = p.profit >= 0 ? 'var(--ok)' : 'var(--warn)';
      bars += `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}">`
           +  `<title>${i+1} ${AR_MONTHS[calM]} — صافي ${fmt(p.profit)} ج (شغل ${fmt(p.workedHours)} س من ${fmt(p.capacity)} س)</title></rect>`;
    }
    if((i+1) % 5 === 0 || i === 0){
      labels += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#8B95A1">${i+1}</text>`;
    }
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="صافي الربح لكل يوم في الشهر">
      <line x1="${padX}" y1="${padT}" x2="${W-padX}" y2="${padT}" stroke="#dce4eb" stroke-width="1" stroke-dasharray="3 4"/>
      ${bars}
      <line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${W-padX}" y2="${zeroY.toFixed(1)}" stroke="#b6c4d1" stroke-width="1.5"/>
      ${labels}
      <text x="${W-padX}" y="${padT-5}" text-anchor="end" font-size="10.5" fill="#8B95A1">${fmt(maxV)} ج</text>
      ${minV < 0 ? `<text x="${W-padX}" y="${H-padB+13}" text-anchor="end" font-size="10.5" fill="var(--warn)">${fmt(minV)} ج</text>` : ''}
    </svg>
    <div class="chart-legend">
      <span><i style="background:var(--ok)"></i> يوم ربح</span>
      <span><i style="background:var(--warn)"></i> يوم خسارة</span>
      <span>حط صباعك على أي عمود يوريك تفاصيله</span>
    </div>`;
}

function chartCumulative(ms){
  const active = ms.list.filter(p=>p.active);
  if(active.length === 0) return chartEmpty('محتاج تسجيل يوم واحد على الأقل عشان الخط يبان.');

  const n = ms.days;
  const W = 720, H = 200, padX = 10, padT = 18, padB = 30;
  const plotH = H - padT - padB;

  let cr = 0, cc = 0;
  const rev = [], cost = [];
  ms.list.forEach(p=>{ cr += p.revenue; cc += p.cost; rev.push(cr); cost.push(cc); });

  const maxV = Math.max(cr, cc, 1);
  const yOf = v => padT + plotH * (1 - v / maxV);
  const slot = (W - 2*padX) / n;
  const xOf = i => W - padX - (i + 0.5) * slot;

  const line = arr => arr.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');

  const areaPts = rev.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')
    + ' ' + cost.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).reverse().join(' ');
  const winning = cr >= cc;

  let ticks = '';
  ms.list.forEach((p,i)=>{
    if((i+1) % 5 === 0 || i === 0)
      ticks += `<text x="${xOf(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#8B95A1">${i+1}</text>`;
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="الدخل والتكلفة تراكمياً على مدار الشهر">
      <polygon points="${areaPts}" fill="${winning ? 'rgba(14,122,87,.13)' : 'rgba(192,57,43,.12)'}"/>
      <polyline points="${line(cost)}" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${line(rev)}" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="${padX}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padX}" y2="${(padT+plotH).toFixed(1)}" stroke="#b6c4d1" stroke-width="1.5"/>
      ${ticks}
      <text x="${W-padX}" y="${padT-5}" text-anchor="end" font-size="10.5" fill="#8B95A1">${fmt(maxV)} ج</text>
    </svg>
    <div class="chart-legend">
      <span><i class="line" style="background:var(--ok)"></i> الدخل التراكمي (${fmt(cr)} ج)</span>
      <span><i class="line" style="background:var(--warn)"></i> التكلفة التراكمية (${fmt(cc)} ج)</span>
      <span>${winning ? 'الدخل فوق التكلفة — الشهر رابح لحد دلوقتي' : 'التكلفة لسه فوق الدخل — محتاج شغل أكتر أو أسعار أعلى'}</span>
    </div>`;
}

function chartDeptHours(y, mIdx){
  const rows = INTERNAL_DEPTS.map(d=>{
    const dm = getMonthStats(y, mIdx, d.key);
    const total = dm.workedHours + dm.idleHours;
    if(total <= 0){
      return `<div class="hbar-row">
        <div class="hbar-head"><b>${d.label}</b><span>مفيش أيام مسجلة</span></div>
        <div class="hbar"></div>
      </div>`;
    }
    const wp = dm.workedHours / total * 100;
    const ip = 100 - wp;
    return `<div class="hbar-row">
      <div class="hbar-head">
        <b>${d.label}</b>
        <span>استغلال ${dm.utilization.toFixed(0)}% · الضايع ${fmt(dm.idleHours)} س = <strong style="color:var(--amber)">${fmt(dm.idleCost)} ج</strong></span>
      </div>
      <div class="hbar">
        <i class="worked" style="width:${wp.toFixed(1)}%" title="اشتغل ${fmt(dm.workedHours)} ساعة">${wp>16 ? fmt(dm.workedHours)+' س' : ''}</i>
        <i class="idle" style="width:${ip.toFixed(1)}%" title="ضاع ${fmt(dm.idleHours)} ساعة">${ip>16 ? fmt(dm.idleHours)+' س' : ''}</i>
      </div>
    </div>`;
  }).join('');

  return rows + `
    <div class="chart-legend">
      <span><i style="background:var(--ok)"></i> ساعات اشتغلت</span>
      <span><i style="background:var(--amber)"></i> ساعات ضاعت من غير شغل</span>
    </div>`;
}

function chartRevenueShare(y, mIdx){
  const parts = INTERNAL_DEPTS.map(d=>({
    label: d.label, value: getMonthStats(y, mIdx, d.key).revenue
  }));
  const total = parts.reduce((a,b)=>a+b.value, 0);
  if(total <= 0) return chartEmpty('مفيش دخل مسجل في الشهر ده.');

  const colors = ['var(--indigo)', 'var(--ok)', 'var(--amber)'];
  const R = 62, C = 78, SW = 26;
  const circ = 2 * Math.PI * R;
  let offset = 0, arcs = '', legend = '';

  parts.forEach((p,i)=>{
    const frac = p.value / total;
    const len = circ * frac;
    arcs += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="${SW}"
              stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
              stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${C} ${C})">
              <title>${p.label}: ${fmt(p.value)} ج (${(frac*100).toFixed(0)}%)</title></circle>`;
    offset += len;
    legend += `<span><i style="background:${colors[i]}"></i> ${p.label} — ${fmt(p.value)} ج (${(frac*100).toFixed(0)}%)</span>`;
  });

  return `
    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center;">
      <svg viewBox="0 0 ${C*2} ${C*2}" style="width:156px; max-width:45%; flex-shrink:0;" role="img" aria-label="نصيب كل قسم من دخل الشهر">
        ${arcs}
        <text x="${C}" y="${C-3}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${fmt(total)}</text>
        <text x="${C}" y="${C+14}" text-anchor="middle" font-size="11" fill="#8B95A1">جنيه</text>
      </svg>
      <div class="chart-legend" style="flex-direction:column; gap:8px; margin:0; align-items:flex-start;">${legend}</div>
    </div>`;
}

function renderMonthCharts(ms){

  return `
    <div class="panel">
      <h2><span class="title-txt">📊 نتائج ${AR_MONTHS[calM]} بالرسم</span><span class="badge internal">${escapeHtml(scope)}</span></h2>
      <div class="chart-box">

        ${chartDailyNet(ms)}

      <div class="chart-box">
        <h3>الدخل والتكلفة تراكمياً</h3>
        <div class="csub">الخطين بيتجمعوا يوم ورا يوم. المهم مش الأرقام، المهم إن الخط الأخضر يفضل فوق الأحمر ويبعد عنه.</div>

/* ============================================================

============================================================ */
let calY = new Date().getFullYear();
let calM = new Date().getMonth();
let calDept = 'all';
let calSelDay = null;

function calShift(delta){
  calM += delta;
  if(calM < 0){ calM = 11; calY--; }
  if(calM > 11){ calM = 0; calY++; }
  calSelDay = null;
  renderMonthView();
}
function calSetDept(k){ calDept = k; renderMonthView(); }
function calPick(dateStr){
  calSelDay = (calSelDay === dateStr) ? null : dateStr;
  renderMonthView();
}
function calToday(){
  const n = new Date();
  calY = n.getFullYear(); calM = n.getMonth();
  calSelDay = ymd(calY, calM, n.getDate());
  renderMonthView();
}

function renderMonthView(){
  if(!hasPerm('finance','view')){
    document.getElementById('view-month').innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض الحسابات المالية</div>`;
    return;
  }
  const y = window.scrollY;
  const ms = getMonthStats(calY, calM, calDept);
  const todayS = todayStr();

  const firstDow = new Date(calY, calM, 1).getDay();
  const offset = (firstDow + 1) % 7;

  let cells = '';
  for(let i=0; i<offset; i++) cells += `<div class="cal-day blank"></div>`;

  for(let d=1; d<=ms.days; d++){
    const ds = ymd(calY, calM, d);
    const st = ms.list[d-1];
    const plans = getSchedFor(ds, calDept);
    const tone = !st.active ? '' : (st.profit >= 0 ? 'pos' : 'neg');
    const u = Math.min(100, st.utilization);
    const uColor = st.utilization >= 85 ? 'var(--ok)' : st.utilization >= 55 ? 'var(--amber)' : 'var(--warn)';
    cells += `<div class="cal-day ${tone} ${ds===todayS?'today':''} ${ds===calSelDay?'sel':''}" onclick="calPick('${ds}')">
      <div class="dnum">${d}</div>
      ${st.active
        ? `<div class="dnet ${st.profit>=0?'pos':'neg'}">${st.profit>=0?'+':'−'}${fmt(Math.abs(st.profit))}</div>
           <div class="dsub">${fmt(st.workedHours)}/${fmt(st.capacity)} س</div>`
        : (plans.length ? '' : `<div class="dsub" style="opacity:.5">—</div>`)}
      ${plans.length ? `<div class="plan">📌 ${plans.length}</div>` : ''}
      ${st.active ? `<div class="ubar"><i style="width:${u}%; background:${uColor}"></i></div>` : ''}
    </div>`;
  }

  const netCls = ms.profit >= 0 ? '' : 'negative';
  const deptSeg = ['all', ...INTERNAL_DEPTS.map(d=>d.key)].map(k=>
    `<button class="${calDept===k?'on':''}" onclick="calSetDept('${k}')">${k==='all'?'كل الأقسام':deptLabel(k)}</button>`
  ).join('');

  let tiles = '';
  if(calDept === 'all'){
    tiles = `<div class="dept-tiles">` + INTERNAL_DEPTS.map(d=>{
      const dm = getMonthStats(calY, calM, d.key);
      const u = Math.min(100, dm.utilization);
      const uColor = dm.utilization >= 85 ? 'var(--ok)' : dm.utilization >= 55 ? 'var(--amber)' : 'var(--warn)';
      return `<div class="dept-tile">
        <div class="dt-name">${d.label}<span class="badge ${dm.profit>=0?'ok':'warn'}">${dm.profit>=0?'ربح':'خسارة'}</span></div>
        <div class="dt-row"><span>دخل الشهر</span><b>${fmt(dm.revenue)} ج</b></div>
        <div class="dt-row"><span>تكلفة الشهر</span><b>${fmt(dm.cost)} ج</b></div>
        <div class="dt-row"><span>الصافي</span><b class="${dm.profit>=0?'pos':'neg'}">${fmt(dm.profit)} ج</b></div>
        <div class="dt-row"><span>ساعات شغل</span><b>${fmt(dm.workedHours)} س</b></div>
        <div class="dt-row"><span>ساعات ضايعة</span><b class="idle">${fmt(dm.idleHours)} س = ${fmt(dm.idleCost)} ج</b></div>
        <div class="util-bar"><i style="width:${u}%; background:${uColor}"></i></div>
        <div class="hint" style="margin-top:5px;">الاستغلال ${dm.utilization.toFixed(0)}%</div>
      </div>`;
    }).join('') + `</div>`;
  }

  document.getElementById('view-month').innerHTML = `
    <div class="panel">
      <div class="cal-toolbar">
        <div class="month-nav">
          <button onclick="calShift(-1)" title="الشهر اللي فات">›</button>
          <div class="mlabel">${AR_MONTHS[calM]} ${calY}</div>
          <button onclick="calShift(1)" title="الشهر الجاي">‹</button>
          <button class="btn ghost small" style="margin-inline-start:6px;" onclick="calToday()">النهارده</button>
        </div>
        <div class="seg">${deptSeg}</div>
      </div>
      <div class="cost-summary">
        <div class="cost-item"><div class="lbl">دخل الشهر</div><div class="val">${fmt(ms.revenue)} ج</div></div>
        <div class="cost-item"><div class="lbl">تكلفة الشهر</div><div class="val">${fmt(ms.cost)} ج</div></div>
        <div class="cost-item profit ${netCls}"><div class="lbl">الصافي</div><div class="val">${fmt(ms.profit)} ج</div></div>
        <div class="cost-item"><div class="lbl">ساعات ضايعة</div><div class="val" style="color:var(--amber)">${fmt(ms.idleHours)} س</div></div>
        <div class="cost-item"><div class="lbl">قيمة الهدر</div><div class="val" style="color:var(--amber)">${fmt(ms.idleCost)} ج</div></div>
        <div class="cost-item"><div class="lbl">الاستغلال</div><div class="val">${ms.utilization.toFixed(0)}%</div></div>
      </div>
      ${ms.workedDays < (Number(state.factory.workDaysPerMonth)||26) ? `
      <div class="mini-note warn">
        سجّلت إنتاج في ${fmt(ms.workedDays)} يوم بس من أصل ${fmt(state.factory.workDaysPerMonth)} يوم عمل في الشهر.
        الأيام اللي مسجّلتش فيها حاجة مش محسوبة عليك أصلاً — يعني لو كنت شغّال فيها ومسجّلتش، الخسارة الحقيقية أكبر من الرقم اللي فوق.
      </div>` : ''}
      ${tiles}
    </div>
    <div class="panel">
      <h2><span class="title-txt">أيام ${AR_MONTHS[calM]}</span><span class="badge pending">دوس على أي يوم للتفاصيل</span></h2>
      <div class="cal-grid">
        ${AR_WEEK.map(w=>`<div class="cal-hd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><i style="background:#eaf7f2; border-color:#bfe3d6"></i> يوم ربح</span>
        <span><i style="background:#fdf0ee; border-color:#f0cdc7"></i> يوم خسارة</span>
        <span><i style="background:var(--surface-2)"></i> مفيش تسجيل</span>
        <span>📌 فيه موديل محجوز في الميعاد ده</span>
      </div>
    </div>
    ${renderMonthCharts(ms)}
    ${calSelDay ? renderDayPanel(calSelDay) : ''}
  `;
  requestAnimationFrame(()=>window.scrollTo(0, y));
}

    const st = getDayDeptStats(ds, k);
    const rows = st.logs.map(l=>`
      <tr>

        : `<div class="empty-state" style="padding:16px;"><p>القسم ده قعد فاضي اليوم ده — ${fmt(st.idleCost)} ج راحت من غير مقابل.</p></div>`}
      ` : `<div class="empty-state" style="padding:16px;"><p>مفيش أي تسجيل في اليوم ده.</p></div>`}

  }).join('');

  return `

      <h2>

        </div>` : ''}

    </div>`;
}

             <div class="cost-item profit ${dayAll.profit<0?'negative':''}"><div class="lbl">الصافي</div><div class="val">${fmt(dayAll.profit)} ج</div></div>
             <div class="cost-item"><div class="lbl">ساعات ضايعة</div><div class="val" style="color:var(--amber)">${fmt(dayAll.idleHours)} س = ${fmt(dayAll.idleCost)} ج</div></div>
           </div>`}
    </div>
  `;
  INTERNAL_DEPTS.forEach(d=>autoRevenue(d.key, true));
  requestAnimationFrame(()=>window.scrollTo(0, y));
}

function autoRevenue(deptKey, silent){
  const qtyEl = document.getElementById('dl_'+deptKey+'_qty');
  const revEl = document.getElementById('dl_'+deptKey+'_rev');
  const hintEl = document.getElementById('dl_'+deptKey+'_hint');
  if(!qtyEl || !revEl) return;
  const qty = Number(qtyEl.value) || 0;
  const sug = suggestRevenue(dailyModelId, deptKey, qty);
  if(hintEl){
    hintEl.textContent = qty>0 && sug>0
      ? `قيمة مقترحة: ${fmt(sug)} ج (${fmt(qty)} قطعة × نصيب ${deptLabel(deptKey)} من سعر القطعة)`
      : '';
  }
  if(silent) return;
  if(!revEl.dataset.touched) revEl.value = sug ? Math.round(sug*100)/100 : '';
}

function saveDailyProduction(){
  if(!requireEdit('finance','تسجيل إنتاج اليوم')) return;
  if(!dailyModelId){ toast('اختار موديل الأول'); return; }
  if(!dailyDate){ toast('اختار التاريخ'); return; }
  let saved = 0;
  INTERNAL_DEPTS.forEach(d=>{
    const qty = Number(document.getElementById('dl_'+d.key+'_qty').value) || 0;
    const hours = Number(document.getElementById('dl_'+d.key+'_hours').value) || 0;
    const revenue = Number(document.getElementById('dl_'+d.key+'_rev').value) || 0;
    if(qty <= 0 && hours <= 0) return;
    const existing = (state.dayLogs||[]).find(l =>
      l.date===dailyDate && l.dept===d.key && l.modelId===dailyModelId);
    if(existing){
      existing.qty = qty; existing.hours = hours; existing.revenue = revenue;
    } else {
      state.dayLogs.push({id:uid(), date:dailyDate, dept:d.key, modelId:dailyModelId, qty, hours, revenue, note:''});
    }
    saved++;
  });
  if(saved === 0){ toast('اكتب عدد قطع أو ساعات لقسم واحد على الأقل'); return; }
  saveState();
  renderDailyView();
  toast(`تم حفظ ${saved} قسم ✓`);
}

============================================================ */
function getTreasuryBalance(){
  const list = state.treasury || [];
  const totalIn = list.filter(t=>t.type==='in').reduce((s,t)=>s+(Number(t.amount)||0), 0);
  const totalOut = list.filter(t=>t.type==='out').reduce((s,t)=>s+(Number(t.amount)||0), 0);
  return {totalIn, totalOut, balance: totalIn - totalOut};
}

    document.getElementById('view-treasury').innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض الخزينة</div>`;

  }
  const bal = getTreasuryBalance();

  state.debts.push({id:uid(), direction, name, mobile, amount, remaining:amount, dueDate, note, date:todayStr(), payments:[]});

  toast('✅ تم تسجيل الدين');

async function openDebtPay(id){
  if(!requireEdit('treasury','سداد دين')) return;
  const debt = state.debts.find(d=>d.id===id);
  if(!debt) return;
  const amountStr = await promptDialog(`المبلغ المسدد (المتبقي ${fmt(debt.remaining)} ج):`, '', {title:'سداد دين', yes:'تسجيل'});
  if(amountStr===null) return;
  const amount = Number(amountStr)||0;
  if(amount<=0 || amount>debt.remaining){ toast('⚠️ مبلغ غير صحيح'); return; }
  debt.remaining -= amount;
  debt.payments.push({amount, date:todayStr()});
  state.treasury.push({
    id:uid(), type: debt.direction==='owed_to_us' ? 'in' : 'out',
    amount, description:(debt.direction==='owed_to_us'?'تحصيل دين من ':'سداد دين لـ')+debt.name,
    date:todayStr(), createdAt:Date.now()
  });
  saveState();
  toast('✅ تم تسجيل السداد');
  renderTreasurySubTab();
  renderTreasuryView();
}

  if(!description || amount<=0){ toast('⚠️ اكتب البيان ومبلغ أكبر من صفر'); return; }
  state.miscExpenses.push({id:uid(), description, amount, date});
  state.treasury.push({id:uid(), type:'out', amount, description:'مصروف: '+description, date, createdAt:Date.now()});
  saveState();
  toast('✅ تم تسجيل المصروف');
  renderTreasurySubTab();
  renderTreasuryView();
}

async function deleteMiscExpense(id){
  if(!requireEdit('treasury','حذف مصروف')) return;
  if(!await confirmDialog('هيتشال المصروف ده نهائياً.', {title:'حذف مصروف', yes:'احذف', danger:true})) return;
  state.miscExpenses = (state.miscExpenses||[]).filter(e=>e.id!==id);
  saveState();
  renderTreasurySubTab();
  toast('تم الحذف');
}

async function deleteTreasuryEntry(id){
  if(!requireEdit('treasury','حذف حركة خزينة')) return;
  if(!await confirmDialog('هيتشال سجل الحركة ده نهائياً.', {title:'حذف حركة خزينة', yes:'احذف', danger:true})) return;
  state.treasury = state.treasury.filter(t=>t.id!==id);
  saveState();
  renderTreasuryView();
  toast('تم الحذف');
}

/* ============================================================
   العملاء والفواتير
============================================================ */
function calcCustomerBalance(customerId){
  const totalInvoices = (state.invoices||[]).filter(i=>i.customerId===customerId).reduce((s,i)=>s+(Number(i.total)||0), 0);
  const totalPayments = (state.payments||[]).filter(p=>p.customerId===customerId).reduce((s,p)=>s+(Number(p.amount)||0), 0);
  return totalInvoices - totalPayments; // موجب = العميل مدين لنا | سالب = العميل دائن (دفع زيادة)
}

function refreshCustomerBalance(customerId){
  const c = state.customers.find(x=>x.id===customerId);
  if(c) c.balance = calcCustomerBalance(customerId);
}

window._salesTab = 'customers';
window._salesQuery = '';

function renderSalesView(){
  if(!hasPerm('sales','view')){
    document.getElementById('view-sales').innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض العملاء والفواتير</div>`;
    return;
  }
  const subTabs = [
    {k:'customers', l:'👤 العملاء'},
    {k:'invoices', l:'🧾 الفواتير'},
  ];
  document.getElementById('view-sales').innerHTML = `
    <div class="panel">
      <h2><span class="title-txt">🛒 العملاء والفواتير</span></h2>
    </div>
    <div class="stage-tabs">
      ${subTabs.map(t=>`<div class="stage-tab ${window._salesTab===t.k?'active':''}" onclick="switchSalesTab('${t.k}')">${t.l}</div>`).join('')}
    </div>
    <div id="salesSubBody"></div>
  `;
  renderSalesSubTab();
}

function switchSalesTab(tab){
  window._salesTab = tab;
  window._salesQuery = '';
  renderSalesView();
}

function renderSalesSubTab(){
  const el = document.getElementById('salesSubBody');
  if(!el) return;
  if(window._salesTab === 'customers') el.innerHTML = renderCustomersTab();
  else if(window._salesTab === 'invoices') el.innerHTML = renderInvoicesTab();
}

/* ---------- العملاء ---------- */
function renderCustomersTab(){
  const canEdit = hasPerm('sales','edit');
  const q = (window._salesQuery||'').trim();
  const customers = state.customers.filter(c=>!q || c.name.includes(q) || (c.mobile||'').includes(q));
  const totalDebt = state.customers.reduce((s,c)=>s+(c.balance||0), 0);

  return `
    ${canEdit ? `
    <div class="panel">
      <h2><span class="title-txt">➕ عميل جديد</span></h2>
      <div class="form-grid">
        <div class="field"><label>الاسم</label><input type="text" id="cust_name" placeholder="اسم العميل"></div>
        <div class="field"><label>الموبايل</label><input type="text" id="cust_mobile"></div>
        <div class="field"><label>ملاحظات</label><input type="text" id="cust_notes"></div>
      </div>
      <button class="btn brass" style="margin-top:12px;" onclick="addCustomer()">إضافة العميل</button>
    </div>
    ` : ''}
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);">
        <h2 style="margin:0; border:none; padding:0;"><span class="title-txt">👤 قائمة العملاء (${customers.length})</span></h2>
        <input type="text" placeholder="🔍 بحث بالاسم أو الموبايل..." value="${escapeHtml(window._salesQuery||'')}" oninput="window._salesQuery=this.value; renderSalesSubTab();" style="max-width:240px; padding:9px 12px; border:1.5px solid var(--line-strong); border-radius:9px; font-family:inherit;">
      </div>
      <div class="hint" style="margin-bottom:14px;">إجمالي أرصدة العملاء: <strong style="color:${totalDebt>=0?'var(--amber)':'var(--ok)'};">${fmt(Math.abs(totalDebt))} ج ${totalDebt>=0?'(مديونية)':'(رصيد دائن لهم)'}</strong></div>
      ${customers.length===0 ? `<div class="empty-state"><div class="icon">👤</div><p>مفيش عملاء مسجّلين.</p></div>` : `
      <table class="data-table">
        <thead><tr><th>الاسم</th><th>الموبايل</th><th>الرصيد</th><th></th></tr></thead>
        <tbody>
          ${customers.map(c=>`
            <tr>
              <td>${escapeHtml(c.name)}</td>
              <td>${escapeHtml(c.mobile||'—')}</td>
              <td style="color:${(c.balance||0)>0?'var(--amber)':(c.balance||0)<0?'var(--ok)':'inherit'}; font-weight:600;">
                ${fmt(Math.abs(c.balance||0))} ج ${(c.balance||0)>0?'(عليه)':(c.balance||0)<0?'(له)':''}
              </td>
              <td style="white-space:nowrap;">
                <button class="icon-btn" title="فاتورة جديدة" onclick="openNewInvoice('${c.id}')">🧾</button>
                <button class="icon-btn" title="كشف حساب" onclick="openCustomerStatement('${c.id}')">📄</button>
                ${canEdit ? `<button class="icon-btn" title="تسجيل دفعة" onclick="openCustomerPay('${c.id}')">💵</button>` : ''}
                ${canEdit ? `<button class="icon-btn" onclick="deleteCustomer('${c.id}')">🗑</button>` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function addCustomer(){
  if(!requireEdit('sales','إضافة عميل')) return;
  const name = document.getElementById('cust_name').value.trim();
  const mobile = document.getElementById('cust_mobile').value.trim();
  const notes = document.getElementById('cust_notes').value.trim();
  if(!name){ toast('⚠️ اكتب اسم العميل'); return; }
  state.customers.push({id:uid(), name, mobile, notes, balance:0});
  saveState();
  toast('✅ تم إضافة العميل');
  renderSalesSubTab();
}

async function deleteCustomer(id){
  if(!requireEdit('sales','حذف عميل')) return;
  if(!await confirmDialog('هيتشال العميل وكل فواتيره ودفعاته المسجّلة.', {title:'حذف عميل', yes:'احذف', danger:true})) return;
  state.customers = state.customers.filter(c=>c.id!==id);
  state.invoices = state.invoices.filter(i=>i.customerId!==id);
  state.payments = state.payments.filter(p=>p.customerId!==id);
  saveState();
  renderSalesSubTab();
  toast('تم الحذف');
}

/* ---------- فاتورة جديدة ---------- */
window._invItems = [];

function openNewInvoice(customerId){
  if(!requireEdit('sales','إضافة فاتورة')) return;
  window._invCustomerId = customerId;
  window._invItems = [{name:'', qty:1, price:0}];
  renderInvoiceModal();
}

function renderInvoiceModal(){
  const cust = state.customers.find(c=>c.id===window._invCustomerId);
  if(!cust) return;
  const items = window._invItems;
  const total = items.reduce((s,it)=>s+((Number(it.qty)||0)*(Number(it.price)||0)), 0);

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>🧾 فاتورة جديدة — ${escapeHtml(cust.name)}</h3>
    <div id="invItemsWrap">
      ${items.map((it,i)=>`
        <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr; margin-bottom:8px;">
          <div class="field"><label>${i===0?'اسم الصنف':''}</label><input type="text" value="${escapeHtml(it.name)}" oninput="updateInvItem(${i},'name',this.value)" placeholder="اسم الصنف/الموديل"></div>
          <div class="field"><label>${i===0?'الكمية':''}</label><input type="number" value="${it.qty}" oninput="updateInvItem(${i},'qty',this.value)"></div>
          <div class="field"><label>${i===0?'سعر القطعة (ج)':''}</label><input type="number" value="${it.price}" oninput="updateInvItem(${i},'price',this.value)"></div>
        </div>
      `).join('')}
    </div>
    <button class="btn ghost small" onclick="addInvItem()">+ صنف</button>
    <div class="section-divider">الدفع</div>
    <div class="form-grid">
      <div class="field"><label>الإجمالي</label><input type="text" value="${fmt(total)} ج" disabled></div>
      <div class="field"><label>دفعة مقدمة الآن (ج)</label><input type="number" id="inv_paid" value="0"></div>
    </div>
    <button class="btn brass full" style="margin-top:16px;" onclick="saveInvoice()">حفظ الفاتورة</button>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function addInvItem(){
  window._invItems.push({name:'', qty:1, price:0});
  renderInvoiceModal();
}

function updateInvItem(i, field, val){
  window._invItems[i][field] = field==='name' ? val : Number(val)||0;
  if(field!=='name') renderInvoiceModal();
}

function saveInvoice(){
  if(!requireEdit('sales','إضافة فاتورة')) return;
  const cust = state.customers.find(c=>c.id===window._invCustomerId);
  if(!cust) return;
  const items = window._invItems.filter(it=>it.name.trim() && Number(it.qty)>0);
  if(items.length===0){ toast('⚠️ أضف صنف واحد على الأقل'); return; }
  const total = items.reduce((s,it)=>s+((Number(it.qty)||0)*(Number(it.price)||0)), 0);
  const paid = Number(document.getElementById('inv_paid').value)||0;
  const custInvNum = state.invoices.filter(i=>i.customerId===cust.id).length + 1;

  const inv = {
    id:uid(), customerId:cust.id, custInvNum, date:todayStr(),
    items, total, partialPay:paid, remaining: Math.max(0, total-paid),
    payMethod: paid>=total?'كاش':paid>0?'دفعات':'آجل',
    status:'مفتوحة', notes:[]
  };
  state.invoices.push(inv);
  if(paid>0){
    state.payments.push({id:uid(), customerId:cust.id, amount:paid, date:todayStr(), note:'دفعة عند إصدار الفاتورة #'+custInvNum});
    state.treasury.push({id:uid(), type:'in', amount:paid, description:'دفعة فاتورة #'+custInvNum+' - '+cust.name, date:todayStr(), createdAt:Date.now()});
  }
  refreshCustomerBalance(cust.id);
  saveState();
  closeModal();
  toast('✅ تم حفظ الفاتورة');
  renderSalesView();
}

/* ---------- تسجيل دفعة من عميل ---------- */
async function openCustomerPay(customerId){
  if(!requireEdit('sales','تسجيل دفعة')) return;
  const cust = state.customers.find(c=>c.id===customerId);
  if(!cust) return;
  const amountStr = await promptDialog(`مبلغ الدفعة من ${cust.name} (الرصيد الحالي: ${fmt(cust.balance||0)} ج):`, '', {title:'تسجيل دفعة', yes:'تسجيل'});
  if(amountStr===null) return;
  const amount = Number(amountStr)||0;
  if(amount<=0){ toast('⚠️ مبلغ غير صحيح'); return; }
  state.payments.push({id:uid(), customerId, amount, date:todayStr(), note:'دفعة مباشرة'});
  state.treasury.push({id:uid(), type:'in', amount, description:'دفعة من '+cust.name, date:todayStr(), createdAt:Date.now()});
  refreshCustomerBalance(customerId);
  saveState();
  toast('✅ تم تسجيل الدفعة');
  renderSalesSubTab();
}

/* ---------- كشف حساب العميل ---------- */
function openCustomerStatement(customerId){
  window._stmtCustomerId = customerId;
  renderCustomerStatementModal();
}

function renderCustomerStatementModal(){
  const cust = state.customers.find(c=>c.id===window._stmtCustomerId);
  if(!cust) return;
  const invoices = state.invoices.filter(i=>i.customerId===cust.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const payments = state.payments.filter(p=>p.customerId===cust.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>📄 كشف حساب — ${escapeHtml(cust.name)}</h3>
    <div class="cost-summary" style="margin-bottom:18px;">
      <div class="cost-item"><div class="lbl">إجمالي الفواتير</div><div class="val">${fmt(invoices.reduce((s,i)=>s+i.total,0))} ج</div></div>
      <div class="cost-item"><div class="lbl">إجمالي المدفوع</div><div class="val" style="color:var(--ok);">${fmt(payments.reduce((s,p)=>s+p.amount,0))} ج</div></div>
      <div class="cost-item profit ${cust.balance>0?'negative':''}"><div class="lbl">الرصيد الحالي</div><div class="val">${fmt(Math.abs(cust.balance||0))} ج ${(cust.balance||0)>0?'(عليه)':(cust.balance||0)<0?'(له)':''}</div></div>
    </div>
    <div class="section-divider">الفواتير</div>
    ${invoices.length===0 ? `<div class="hint">مفيش فواتير.</div>` : `
    <table class="data-table" style="margin-bottom:18px;">
      <thead><tr><th>#</th><th>التاريخ</th><th>الأصناف</th><th>الإجمالي</th><th>متبقي</th></tr></thead>
      <tbody>
        ${invoices.map(i=>`
          <tr>
            <td>${i.custInvNum}</td>
            <td>${i.date}</td>
            <td>${i.items.map(it=>escapeHtml(it.name)).join('، ')}</td>
            <td>${fmt(i.total)} ج</td>
            <td style="color:${i.remaining>0?'var(--amber)':'var(--ok)'};">${fmt(i.remaining)} ج</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
    <div class="section-divider">الدفعات</div>
    ${payments.length===0 ? `<div class="hint">مفيش دفعات.</div>` : `
    <table class="data-table">
      <thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th></tr></thead>
      <tbody>
        ${payments.map(p=>`<tr><td>${p.date}</td><td>${fmt(p.amount)} ج</td><td>${escapeHtml(p.note||'—')}</td></tr>`).join('')}
      </tbody>
    </table>`}
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

/* ---------- كل الفواتير ---------- */
function renderInvoicesTab(){
  const q = (window._salesQuery||'').trim();
  let invoices = [...state.invoices].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(q){
    invoices = invoices.filter(i=>{
      const cust = state.customers.find(c=>c.id===i.customerId);
      return (cust && cust.name.includes(q)) || i.items.some(it=>it.name.includes(q));
    });
  }
  return `
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);">
        <h2 style="margin:0; border:none; padding:0;"><span class="title-txt">🧾 كل الفواتير (${invoices.length})</span></h2>
        <input type="text" placeholder="🔍 بحث بالعميل أو الصنف..." value="${escapeHtml(window._salesQuery||'')}" oninput="window._salesQuery=this.value; renderSalesSubTab();" style="max-width:240px; padding:9px 12px; border:1.5px solid var(--line-strong); border-radius:9px; font-family:inherit;">
      </div>
      ${invoices.length===0 ? `<div class="empty-state"><div class="icon">🧾</div><p>مفيش فواتير مسجّلة.</p></div>` : `
      <table class="data-table">
        <thead><tr><th>#</th><th>العميل</th><th>التاريخ</th><th>الأصناف</th><th>الإجمالي</th><th>متبقي</th><th>الحالة</th></tr></thead>
        <tbody>
          ${invoices.map(i=>{
            const cust = state.customers.find(c=>c.id===i.customerId);
            return `<tr>
              <td>${i.custInvNum}</td>
              <td>${escapeHtml(cust?.name||'(محذوف)')}</td>
              <td>${i.date}</td>
              <td>${i.items.map(it=>escapeHtml(it.name)).join('، ')}</td>
              <td>${fmt(i.total)} ج</td>
              <td style="color:${i.remaining>0?'var(--amber)':'var(--ok)'};">${fmt(i.remaining)} ج</td>
              <td><span class="badge ${i.remaining<=0?'ok':'warn'}">${i.remaining<=0?'مسددة':'متبقي'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}


window.onAuthReady = async function(){
  await loadStateFromCloud();
  const perms = window.currentPermissions || {};
  if(perms.models==='view' || perms.models==='edit') switchMainTab('models');
  else if(perms.finance==='view' || perms.finance==='edit') switchMainTab('month');
  else if(perms.attendance==='view' || perms.attendance==='edit') switchMainTab('attendance');
  else if(perms.employees==='view' || perms.employees==='edit' || perms.factory_settings==='view' || perms.factory_settings==='edit') switchMainTab('settings');
  else if(perms.users==='edit') switchMainTab('users');
  else switchMainTab('models');
};
</script>
