<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة الإنتاج</title>
<style>
  :root{
    --bg: #0f1115;
    --surface: #171a21;
    --surface2: #1f232c;
    --border: #2a2f3a;
    --text: #eef0f3;
    --text-dim: #9aa1ad;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --accent-dim: #1e3a5f;
    --green: #22c55e;
    --green-dim: #14301f;
    --red: #ef4444;
    --red-dim: #3a1a1a;
    --amber: #f59e0b;
    --radius: 12px;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky; top:0; z-index: 50;
  }
  header h1{ font-size: 18px; font-weight: 600; }
  header p{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  nav{
    display:flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 61px; z-index: 49;
    overflow-x: auto;
  }
  nav button{
    flex: 1;
    min-width: 90px;
    background: none; border:none; color: var(--text-dim);
    padding: 12px 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: .15s;
    white-space: nowrap;
  }
  nav button.active{ color: var(--accent); border-bottom-color: var(--accent); }
  nav button:hover{ color: var(--text); }

  main{ padding: 16px; max-width: 720px; margin: 0 auto; }
  .page{ display:none; }
  .page.active{ display:block; animation: fadeIn .2s; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3{ font-size: 15px; margin-bottom: 12px; }

  input, select{
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  input:focus, select:focus{ outline: none; border-color: var(--accent); }
  label{ font-size: 12px; color: var(--text-dim); display:block; margin-bottom: 4px; }

  .btn{
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn:hover{ background: var(--accent); color: white; }
  .btn.full{ width: 100%; }
  .btn.green{ background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .btn.green:hover{ background: var(--green); color: #06210f; }
  .btn.red{ background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .btn.red:hover{ background: var(--red); color: white; }
  .btn.ghost{ background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn.ghost:hover{ background: var(--surface2); color: var(--text); }
  .btn:disabled{ opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover{ background: var(--accent-dim); color: var(--accent); }

  .row{ display:flex; gap: 8px; }
  .row > *{ flex:1; }

  .list-item{
    display:flex; justify-content: space-between; align-items:center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .list-item .info{ flex:1; }
  .list-item .name{ font-size: 14px; font-weight: 500; }
  .list-item .sub{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .list-item .actions{ display:flex; gap:6px; }
  .icon-btn{
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    font-size: 14px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background: var(--surface); color: var(--text); }
  .icon-btn.del:hover{ background: var(--red-dim); color: var(--red); border-color: var(--red); }

  .empty{ text-align:center; padding: 30px 10px; color: var(--text-muted); font-size: 13px; }

  .badge{
    display:inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .badge.amber{ background: rgba(245,158,11,.15); color: var(--amber); }
  .badge.green{ background: var(--green-dim); color: var(--green); }

  /* Tracking page */
  .timer-display{
    text-align:center;
    padding: 24px 0;
  }
  .timer-display .count{
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .timer-display .label{ font-size: 13px; color: var(--text-dim); margin-top: 8px; }
  .timer-display .clock{
    font-size: 22px; color: var(--text-dim); margin-top: 12px; font-variant-numeric: tabular-nums;
  }
  .rate-display{
    text-align:center; font-size: 13px; color: var(--text-muted); margin-top: 6px;
  }
  .produce-btn{
    width: 100%;
    padding: 28px;
    font-size: 22px;
    font-weight: 700;
    border-radius: var(--radius);
    background: var(--green-dim);
    color: var(--green);
    border: 2px solid var(--green);
    cursor: pointer;
    margin: 16px 0;
    transition: .1s;
  }
  .produce-btn:active{ transform: scale(0.97); }
  .produce-btn:disabled{ opacity: .3; }

  .session-active-badge{
    display:flex; align-items:center; gap:6px;
    background: var(--green-dim); color: var(--green);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    width: fit-content; margin: 0 auto 12px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  th{ text-align:right; color: var(--text-muted); font-weight:500; font-size:11px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  td{ padding: 8px 4px; border-bottom: 1px solid var(--border); }
  tr:last-child td{ border-bottom: none; }

  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 30px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .25s;
    z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-card{
    background: var(--surface2); border-radius: 10px; padding: 12px;
  }
  .stat-card .v{ font-size: 20px; font-weight: 700; }
  .stat-card .l{ font-size: 11px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>📊 نظام متابعة الإنتاج</h1>
  <p>طيب المسلم — تتبع أداء العمال بالمرحلة</p>
</header>

<nav>
  <button class="nav-btn active" data-page="track">⏱ التتبع</button>
  <button class="nav-btn" data-page="employees">👥 الموظفين</button>
  <button class="nav-btn" data-page="models">📦 الموديلات</button>
  <button class="nav-btn" data-page="reports">📈 التقارير</button>
</nav>

<main>
  <div id="page-track" class="page active"></div>
  <div id="page-employees" class="page"></div>
  <div id="page-models" class="page"></div>
  <div id="page-reports" class="page"></div>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
