async function createNewUser(){
  if(!requireEdit('users','إضافة مستخدم')) return;
  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  if(!email || password.length<6){ toast('⚠️ اكتب إيميل صحيح وكلمة مرور 6 أحرف على الأقل'); return; }

  const perms = {};
  window._PERMISSION_SECTIONS.forEach(s=>{
    perms[s.key] = document.getElementById(`newUserPerm_${s.key}`).value;
  });

  try{
    /* ملحوظة: إنشاء المستخدم بيسجّل الدخول بحسابه تلقائياً في Firebase Auth (سلوك SDK القياسي)،
       فبنرجع نسجّل دخول تاني بحساب الأدمن الحالي فوراً بعدها عشان الجلسة متتغيرش. */
    const adminEmail = window.currentUser.email;
    const cred = await window._createUser(window._auth, email, password);
    await window._fsset(window._fsdoc(window._db, 'users', cred.user.uid), {
      email, permissions: perms, createdAt: Date.now()
    });
    toast('✅ تم إنشاء المستخدم — سجل دخولك تاني بحسابك من فضلك');
    await window._auth.signOut();
    document.getElementById('loginEmail').value = adminEmail;
  }catch(e){
    toast('❌ فشل إنشاء المستخدم: ' + (e.message||''));
  }
}

async function updateUserPermission(uid, sectionKey, newVal){
  if(!requireEdit('users','تعديل صلاحية')) return;
  try{
    const uref = window._fsdoc(window._db, 'users', uid);
    const snap = await window._fsget(uref);
    const data = snap.data();
    const perms = data.permissions || {};
    perms[sectionKey] = newVal;
    await window._fsset(uref, { ...data, permissions: perms });
    toast('✅ اتحدثت الصلاحية');
    if(uid===window.currentUser.uid){
      window.currentPermissions = perms;
      document.getElementById('usersTabBtn').style.display = (perms.users==='edit') ? 'inline-block' : 'none';
      document.getElementById('attendanceTabBtn').style.display = (perms.attendance==='view' || perms.attendance==='edit') ? 'inline-block' : 'none';
      document.getElementById('modelsTabBtn').style.display = (perms.models==='view' || perms.models==='edit') ? 'inline-flex' : 'none';
      document.getElementById('monthTabBtn').style.display = (perms.finance==='view' || perms.finance==='edit') ? 'inline-flex' : 'none';
      document.getElementById('dailyTabBtn').style.display = (perms.finance==='view' || perms.finance==='edit') ? 'inline-flex' : 'none';
      document.getElementById('statProfitWrap').style.display = (perms.finance==='view' || perms.finance==='edit') ? '' : 'none';
    }
  }catch(e){
    toast('❌ فشل تحديث الصلاحية');
  }
}


/* ============================================================
   الحضور والانصراف
============================================================ */
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
window._attendanceMonthKey = null;
window._attendanceDayKey = null;

function monthKey(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; } // m=0..11
function dayKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

function renderAttendanceView(){
  const el = document.getElementById('view-attendance');
  if(!hasPerm('attendance','view')){
    el.innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض هذه الصفحة</div>`;
    return;
  }

  const now = new Date();
  if(!window._attendanceMonthKey){
    window._attendanceYear = now.getFullYear();
    window._attendanceMonth = now.getMonth();
  }
  const y = window._attendanceYear, m = window._attendanceMonth;
  window._attendanceMonthKey = monthKey(y,m);
  if(!window._attendanceDayKey){
    window._attendanceDayKey = dayKey(y,m, Math.min(now.getDate(), daysInMonth(y,m)));
  }

  const totalDays = daysInMonth(y,m);
  const canEdit = hasPerm('attendance','edit');

  el.innerHTML = `
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
        <h2 style="margin:0;"><span class="title-txt">🕒 الحضور والانصراف</span></h2>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="icon-btn" onclick="shiftAttendanceMonth(-1)">◀</button>
          <strong style="min-width:110px; text-align:center;">${ARABIC_MONTHS[m]} ${y}</strong>
          <button class="icon-btn" onclick="shiftAttendanceMonth(1)">▶</button>
        </div>
      </div>

      <div class="attendance-days-scroll">
        ${Array.from({length: totalDays}, (_,i)=>i+1).map(d=>{
          const dk = dayKey(y,m,d);
          const active = dk===window._attendanceDayKey;
          const dayData = (state.attendance[monthKey(y,m)]||{})[dk] || {};
          const presentCount = Object.values(dayData).filter(v=>v.status==='present').length;
          const absentCount = Object.values(dayData).filter(v=>v.status==='absent').length;
          return `<button class="attendance-day-btn ${active?'active':''}" onclick="selectAttendanceDay('${dk}')">
            <span class="d-num">${d}</span>
            ${(presentCount||absentCount) ? `<span class="d-mark">${presentCount?`✅${presentCount}`:''}${absentCount?` ❌${absentCount}`:''}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
    </div>

    <div class="panel" id="attendanceDayPanel"></div>
  `;
  renderAttendanceDayPanel();
}

function shiftAttendanceMonth(delta){
  let m = window._attendanceMonth + delta;
  let y = window._attendanceYear;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  window._attendanceMonth = m;
  window._attendanceYear = y;
  window._attendanceMonthKey = monthKey(y,m);
  window._attendanceDayKey = dayKey(y,m,1);
  renderAttendanceView();
}

function selectAttendanceDay(dk){
  window._attendanceDayKey = dk;
  renderAttendanceView();
}

function renderAttendanceDayPanel(){
  const panel = document.getElementById('attendanceDayPanel');
  if(!panel) return;
  const mk = window._attendanceMonthKey;
  const dk = window._attendanceDayKey;
  const canEdit = hasPerm('attendance','edit');
  const employees = state.factory.employees;
  const dayData = (state.attendance[mk]||{})[dk] || {};

  if(employees.length===0){
    panel.innerHTML = `<div class="hint">مفيش موظفين مسجلين في إعدادات المصنع حالياً.</div>`;
    return;
  }

  panel.innerHTML = `
    <h3 style="margin-bottom:12px; font-size:15px;">📅 ${dk}</h3>
    ${employees.map(emp=>{
      const rec = dayData[emp.id] || {status:null, checkIn:'', checkOut:''};
      return `
      <div class="att-row" id="attRow_${emp.id}">
        <div class="att-name">${escapeHtml(emp.name)}</div>
        <div class="att-controls">
          <div class="att-status-btns">
            <button class="att-status-btn present ${rec.status==='present'?'active':''}" ${!canEdit?'disabled':''} onclick="setAttendanceStatus('${emp.id}','present')">حاضر</button>
            <button class="att-status-btn absent ${rec.status==='absent'?'active':''}" ${!canEdit?'disabled':''} onclick="setAttendanceStatus('${emp.id}','absent')">غايب</button>
          </div>
          <div class="att-times" id="attTimes_${emp.id}" style="${rec.status==='present'?'':'display:none;'}">
            <div class="att-time-field">
              <label>دخول</label>
              <div class="att-time-input-wrap">
                <input type="time" id="attIn_${emp.id}" value="${rec.checkIn||''}" ${!canEdit?'disabled':''} onchange="saveAttendanceTime('${emp.id}')">
                ${canEdit ? `<button class="icon-btn" title="الوقت الحالي" onclick="setNowTime('${emp.id}','in')">⏱</button>` : ''}
              </div>
            </div>
            <div class="att-time-field">
              <label>خروج</label>
              <div class="att-time-input-wrap">
                <input type="time" id="attOut_${emp.id}" value="${rec.checkOut||''}" ${!canEdit?'disabled':''} onchange="saveAttendanceTime('${emp.id}')">
                ${canEdit ? `<button class="icon-btn" title="الوقت الحالي" onclick="setNowTime('${emp.id}','out')">⏱</button>` : ''}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
}

function ensureAttendanceSlot(empId){
  const mk = window._attendanceMonthKey;
  const dk = window._attendanceDayKey;
  if(!state.attendance[mk]) state.attendance[mk] = {};
  if(!state.attendance[mk][dk]) state.attendance[mk][dk] = {};
  if(!state.attendance[mk][dk][empId]) state.attendance[mk][dk][empId] = {status:null, checkIn:'', checkOut:''};
  return state.attendance[mk][dk][empId];
}

function setAttendanceStatus(empId, status){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  rec.status = status;
  if(status==='absent'){ rec.checkIn=''; rec.checkOut=''; }
  saveState();
  renderAttendanceDayPanel();
  renderAttendanceView();
}

function setNowTime(empId, which){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const val = `${hh}:${mm}`;
  const rec = ensureAttendanceSlot(empId);
  rec.status = 'present';
  if(which==='in') rec.checkIn = val; else rec.checkOut = val;
  saveState();
  renderAttendanceDayPanel();
  renderAttendanceView();
}

function saveAttendanceTime(empId){
  if(!requireEdit('attendance','تسجيل الحضور')) return;
  const rec = ensureAttendanceSlot(empId);
  rec.status = 'present';
  rec.checkIn = document.getElementById('attIn_'+empId).value || '';
  rec.checkOut = document.getElementById('attOut_'+empId).value || '';
  saveState();
  renderAttendanceView();
}

/* ============================================================
   الرسوم البيانية الشهرية (SVG بسيط، بدون مكتبات خارجية)
============================================================ */
function chartEmpty(msg){
  return `<div class="chart-empty">${escapeHtml(msg)}</div>`;
}

function chartDailyNet(ms){
  const n = ms.days;
  const active = ms.list.filter(p=>p.active);
  if(active.length === 0) return chartEmpty('مفيش أي إنتاج مسجل في الشهر ده لسه، فمفيش حاجة تترسم.');

  const W = 720, H = 200, padX = 10, padT = 18, padB = 30;
  const plotH = H - padT - padB;
  const vals = active.map(p=>p.profit);
  const maxV = Math.max(0, ...vals);
  const minV = Math.min(0, ...vals);
  const range = (maxV - minV) || 1;
  const yOf = v => padT + plotH * (maxV - v) / range;
  const zeroY = yOf(0);
  const slot = (W - 2*padX) / n;
  const bw = Math.max(2, slot * 0.62);
  const xOf = i => W - padX - (i + 0.5) * slot;

  let bars = '', labels = '';
  ms.list.forEach((p, i)=>{
    const cx = xOf(i);
    if(p.active){
      const y = yOf(p.profit);
      const top = Math.min(y, zeroY);
      const h = Math.max(1.5, Math.abs(y - zeroY));
      const col = p.profit >= 0 ? 'var(--ok)' : 'var(--warn)';
      bars += `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}">`
           +  `<title>${i+1} ${AR_MONTHS[calM]} — صافي ${fmt(p.profit)} ج (شغل ${fmt(p.workedHours)} س من ${fmt(p.capacity)} س)</title></rect>`;
    }
    if((i+1) % 5 === 0 || i === 0){
      labels += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#8B95A1">${i+1}</text>`;
    }
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="صافي الربح لكل يوم في الشهر">
      <line x1="${padX}" y1="${padT}" x2="${W-padX}" y2="${padT}" stroke="#dce4eb" stroke-width="1" stroke-dasharray="3 4"/>
      ${bars}
      <line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${W-padX}" y2="${zeroY.toFixed(1)}" stroke="#b6c4d1" stroke-width="1.5"/>
      ${labels}
      <text x="${W-padX}" y="${padT-5}" text-anchor="end" font-size="10.5" fill="#8B95A1">${fmt(maxV)} ج</text>
      ${minV < 0 ? `<text x="${W-padX}" y="${H-padB+13}" text-anchor="end" font-size="10.5" fill="var(--warn)">${fmt(minV)} ج</text>` : ''}
    </svg>
    <div class="chart-legend">
      <span><i style="background:var(--ok)"></i> يوم ربح</span>
      <span><i style="background:var(--warn)"></i> يوم خسارة</span>
      <span>حط صباعك على أي عمود يوريك تفاصيله</span>
    </div>`;
}

function chartCumulative(ms){
  const active = ms.list.filter(p=>p.active);
  if(active.length === 0) return chartEmpty('محتاج تسجيل يوم واحد على الأقل عشان الخط يبان.');

  const n = ms.days;
  const W = 720, H = 200, padX = 10, padT = 18, padB = 30;
  const plotH = H - padT - padB;

  let cr = 0, cc = 0;
  const rev = [], cost = [];
  ms.list.forEach(p=>{ cr += p.revenue; cc += p.cost; rev.push(cr); cost.push(cc); });

  const maxV = Math.max(cr, cc, 1);
  const yOf = v => padT + plotH * (1 - v / maxV);
  const slot = (W - 2*padX) / n;
  const xOf = i => W - padX - (i + 0.5) * slot;

  const line = arr => arr.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');

  const areaPts = rev.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')
    + ' ' + cost.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).reverse().join(' ');
  const winning = cr >= cc;

  let ticks = '';
  ms.list.forEach((p,i)=>{
    if((i+1) % 5 === 0 || i === 0)
      ticks += `<text x="${xOf(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#8B95A1">${i+1}</text>`;
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="الدخل والتكلفة تراكمياً على مدار الشهر">
      <polygon points="${areaPts}" fill="${winning ? 'rgba(14,122,87,.13)' : 'rgba(192,57,43,.12)'}"/>
      <polyline points="${line(cost)}" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="${line(rev)}" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="${padX}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padX}" y2="${(padT+plotH).toFixed(1)}" stroke="#b6c4d1" stroke-width="1.5"/>
      ${ticks}
      <text x="${W-padX}" y="${padT-5}" text-anchor="end" font-size="10.5" fill="#8B95A1">${fmt(maxV)} ج</text>
    </svg>
    <div class="chart-legend">
      <span><i class="line" style="background:var(--ok)"></i> الدخل التراكمي (${fmt(cr)} ج)</span>
      <span><i class="line" style="background:var(--warn)"></i> التكلفة التراكمية (${fmt(cc)} ج)</span>
      <span>${winning ? 'الدخل فوق التكلفة — الشهر رابح لحد دلوقتي' : 'التكلفة لسه فوق الدخل — محتاج شغل أكتر أو أسعار أعلى'}</span>
    </div>`;
}

function chartDeptHours(y, mIdx){
  const rows = INTERNAL_DEPTS.map(d=>{
    const dm = getMonthStats(y, mIdx, d.key);
    const total = dm.workedHours + dm.idleHours;
    if(total <= 0){
      return `<div class="hbar-row">
        <div class="hbar-head"><b>${d.label}</b><span>مفيش أيام مسجلة</span></div>
        <div class="hbar"></div>
      </div>`;
    }
    const wp = dm.workedHours / total * 100;
    const ip = 100 - wp;
    return `<div class="hbar-row">
      <div class="hbar-head">
        <b>${d.label}</b>
        <span>استغلال ${dm.utilization.toFixed(0)}% · الضايع ${fmt(dm.idleHours)} س = <strong style="color:var(--amber)">${fmt(dm.idleCost)} ج</strong></span>
      </div>
      <div class="hbar">
        <i class="worked" style="width:${wp.toFixed(1)}%" title="اشتغل ${fmt(dm.workedHours)} ساعة">${wp>16 ? fmt(dm.workedHours)+' س' : ''}</i>
        <i class="idle" style="width:${ip.toFixed(1)}%" title="ضاع ${fmt(dm.idleHours)} ساعة">${ip>16 ? fmt(dm.idleHours)+' س' : ''}</i>
      </div>
    </div>`;
  }).join('');

  return rows + `
    <div class="chart-legend">
      <span><i style="background:var(--ok)"></i> ساعات اشتغلت</span>
      <span><i style="background:var(--amber)"></i> ساعات ضاعت من غير شغل</span>
    </div>`;
}

function chartRevenueShare(y, mIdx){
  const parts = INTERNAL_DEPTS.map(d=>({
    label: d.label, value: getMonthStats(y, mIdx, d.key).revenue
  }));
  const total = parts.reduce((a,b)=>a+b.value, 0);
  if(total <= 0) return chartEmpty('مفيش دخل مسجل في الشهر ده.');

  const colors = ['var(--indigo)', 'var(--ok)', 'var(--amber)'];
  const R = 62, C = 78, SW = 26;
  const circ = 2 * Math.PI * R;
  let offset = 0, arcs = '', legend = '';

  parts.forEach((p,i)=>{
    const frac = p.value / total;
    const len = circ * frac;
    arcs += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="${SW}"
              stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
              stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${C} ${C})">
              <title>${p.label}: ${fmt(p.value)} ج (${(frac*100).toFixed(0)}%)</title></circle>`;
    offset += len;
    legend += `<span><i style="background:${colors[i]}"></i> ${p.label} — ${fmt(p.value)} ج (${(frac*100).toFixed(0)}%)</span>`;
  });

  return `
    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center;">
      <svg viewBox="0 0 ${C*2} ${C*2}" style="width:156px; max-width:45%; flex-shrink:0;" role="img" aria-label="نصيب كل قسم من دخل الشهر">
        ${arcs}
        <text x="${C}" y="${C-3}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${fmt(total)}</text>
        <text x="${C}" y="${C+14}" text-anchor="middle" font-size="11" fill="#8B95A1">جنيه</text>
      </svg>
      <div class="chart-legend" style="flex-direction:column; gap:8px; margin:0; align-items:flex-start;">${legend}</div>
    </div>`;
}

function renderMonthCharts(ms){
  const scope = calDept === 'all' ? 'كل الأقسام' : deptLabel(calDept);
  return `
    <div class="panel">
      <h2><span class="title-txt">📊 نتائج ${AR_MONTHS[calM]} بالرسم</span><span class="badge internal">${escapeHtml(scope)}</span></h2>
      <div class="chart-box">
        <h3>صافي كل يوم</h3>
        <div class="csub">كل عمود = يوم. العمود الأخضر فوق الخط يعني اليوم ده كسب، والأحمر تحته يعني خسر. الأيام الفاضية مالهاش عمود.</div>
        ${chartDailyNet(ms)}
      </div>
      <div class="chart-box">
        <h3>الدخل والتكلفة تراكمياً</h3>
        <div class="csub">الخطين بيتجمعوا يوم ورا يوم. المهم مش الأرقام، المهم إن الخط الأخضر يفضل فوق الأحمر ويبعد عنه.</div>
        ${chartCumulative(ms)}
      </div>
      <div class="chart-box">
        <h3>ساعات كل قسم: اشتغلت مقابل ضاعت</h3>
        <div class="csub">الجزء البرتقالي هو الفلوس اللي دفعتها ومخدتش مقابلها شغل. ده أول مكان تدوّر فيه على تحسين.</div>
        ${chartDeptHours(calY, calM)}
      </div>
      <div class="chart-box">
        <h3>نصيب كل قسم من دخل الشهر</h3>
        <div class="csub">مين بيجيب الفلوس فعلاً. قارنه بالرسم اللي فوقه: ممكن قسم ياخد ساعات كتير ويجيب دخل قليل.</div>
        ${chartRevenueShare(calY, calM)}
      </div>
    </div>`;
}

/* ============================================================
   شاشة الشهر والأرباح
============================================================ */
let calY = new Date().getFullYear();
let calM = new Date().getMonth();
let calDept = 'all';
let calSelDay = null;

function calShift(delta){
  calM += delta;
  if(calM < 0){ calM = 11; calY--; }
  if(calM > 11){ calM = 0; calY++; }
  calSelDay = null;
  renderMonthView();
}
function calSetDept(k){ calDept = k; renderMonthView(); }
function calPick(dateStr){
  calSelDay = (calSelDay === dateStr) ? null : dateStr;
  renderMonthView();
}
function calToday(){
  const n = new Date();
  calY = n.getFullYear(); calM = n.getMonth();
  calSelDay = ymd(calY, calM, n.getDate());
  renderMonthView();
}

function renderMonthView(){
  if(!hasPerm('finance','view')){
    document.getElementById('view-month').innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض الحسابات المالية</div>`;
    return;
  }
  const y = window.scrollY;
  const ms = getMonthStats(calY, calM, calDept);
  const todayS = todayStr();

  const firstDow = new Date(calY, calM, 1).getDay();
  const offset = (firstDow + 1) % 7;

  let cells = '';
  for(let i=0; i<offset; i++) cells += `<div class="cal-day blank"></div>`;

  for(let d=1; d<=ms.days; d++){
    const ds = ymd(calY, calM, d);
    const st = ms.list[d-1];
    const plans = getSchedFor(ds, calDept);
    const tone = !st.active ? '' : (st.profit >= 0 ? 'pos' : 'neg');
    const u = Math.min(100, st.utilization);
    const uColor = st.utilization >= 85 ? 'var(--ok)' : st.utilization >= 55 ? 'var(--amber)' : 'var(--warn)';
    cells += `<div class="cal-day ${tone} ${ds===todayS?'today':''} ${ds===calSelDay?'sel':''}" onclick="calPick('${ds}')">
      <div class="dnum">${d}</div>
      ${st.active
        ? `<div class="dnet ${st.profit>=0?'pos':'neg'}">${st.profit>=0?'+':'−'}${fmt(Math.abs(st.profit))}</div>
           <div class="dsub">${fmt(st.workedHours)}/${fmt(st.capacity)} س</div>`
        : (plans.length ? '' : `<div class="dsub" style="opacity:.5">—</div>`)}
      ${plans.length ? `<div class="plan">📌 ${plans.length}</div>` : ''}
      ${st.active ? `<div class="ubar"><i style="width:${u}%; background:${uColor}"></i></div>` : ''}
    </div>`;
  }

  const netCls = ms.profit >= 0 ? '' : 'negative';
  const deptSeg = ['all', ...INTERNAL_DEPTS.map(d=>d.key)].map(k=>
    `<button class="${calDept===k?'on':''}" onclick="calSetDept('${k}')">${k==='all'?'كل الأقسام':deptLabel(k)}</button>`
  ).join('');

  let tiles = '';
  if(calDept === 'all'){
    tiles = `<div class="dept-tiles">` + INTERNAL_DEPTS.map(d=>{
      const dm = getMonthStats(calY, calM, d.key);
      const u = Math.min(100, dm.utilization);
      const uColor = dm.utilization >= 85 ? 'var(--ok)' : dm.utilization >= 55 ? 'var(--amber)' : 'var(--warn)';
      return `<div class="dept-tile">
        <div class="dt-name">${d.label}<span class="badge ${dm.profit>=0?'ok':'warn'}">${dm.profit>=0?'ربح':'خسارة'}</span></div>
        <div class="dt-row"><span>دخل الشهر</span><b>${fmt(dm.revenue)} ج</b></div>
        <div class="dt-row"><span>تكلفة الشهر</span><b>${fmt(dm.cost)} ج</b></div>
        <div class="dt-row"><span>الصافي</span><b class="${dm.profit>=0?'pos':'neg'}">${fmt(dm.profit)} ج</b></div>
        <div class="dt-row"><span>ساعات شغل</span><b>${fmt(dm.workedHours)} س</b></div>
        <div class="dt-row"><span>ساعات ضايعة</span><b class="idle">${fmt(dm.idleHours)} س = ${fmt(dm.idleCost)} ج</b></div>
        <div class="util-bar"><i style="width:${u}%; background:${uColor}"></i></div>
        <div class="hint" style="margin-top:5px;">الاستغلال ${dm.utilization.toFixed(0)}%</div>
      </div>`;
    }).join('') + `</div>`;
  }

  document.getElementById('view-month').innerHTML = `
    <div class="panel">
      <div class="cal-toolbar">
        <div class="month-nav">
          <button onclick="calShift(-1)" title="الشهر اللي فات">›</button>
          <div class="mlabel">${AR_MONTHS[calM]} ${calY}</div>
          <button onclick="calShift(1)" title="الشهر الجاي">‹</button>
          <button class="btn ghost small" style="margin-inline-start:6px;" onclick="calToday()">النهارده</button>
        </div>
        <div class="seg">${deptSeg}</div>
      </div>
      <div class="cost-summary">
        <div class="cost-item"><div class="lbl">دخل الشهر</div><div class="val">${fmt(ms.revenue)} ج</div></div>
        <div class="cost-item"><div class="lbl">تكلفة الشهر</div><div class="val">${fmt(ms.cost)} ج</div></div>
        <div class="cost-item profit ${netCls}"><div class="lbl">الصافي</div><div class="val">${fmt(ms.profit)} ج</div></div>
        <div class="cost-item"><div class="lbl">ساعات ضايعة</div><div class="val" style="color:var(--amber)">${fmt(ms.idleHours)} س</div></div>
        <div class="cost-item"><div class="lbl">قيمة الهدر</div><div class="val" style="color:var(--amber)">${fmt(ms.idleCost)} ج</div></div>
        <div class="cost-item"><div class="lbl">الاستغلال</div><div class="val">${ms.utilization.toFixed(0)}%</div></div>
      </div>
      ${ms.workedDays < (Number(state.factory.workDaysPerMonth)||26) ? `
      <div class="mini-note warn">
        سجّلت إنتاج في ${fmt(ms.workedDays)} يوم بس من أصل ${fmt(state.factory.workDaysPerMonth)} يوم عمل في الشهر.
        الأيام اللي مسجّلتش فيها حاجة مش محسوبة عليك أصلاً — يعني لو كنت شغّال فيها ومسجّلتش، الخسارة الحقيقية أكبر من الرقم اللي فوق.
      </div>` : ''}
      ${tiles}
    </div>
    <div class="panel">
      <h2><span class="title-txt">أيام ${AR_MONTHS[calM]}</span><span class="badge pending">دوس على أي يوم للتفاصيل</span></h2>
      <div class="cal-grid">
        ${AR_WEEK.map(w=>`<div class="cal-hd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><i style="background:#eaf7f2; border-color:#bfe3d6"></i> يوم ربح</span>
        <span><i style="background:#fdf0ee; border-color:#f0cdc7"></i> يوم خسارة</span>
        <span><i style="background:var(--surface-2)"></i> مفيش تسجيل</span>
        <span>📌 فيه موديل محجوز في الميعاد ده</span>
      </div>
    </div>
    ${renderMonthCharts(ms)}
    ${calSelDay ? renderDayPanel(calSelDay) : ''}
  `;
  requestAnimationFrame(()=>window.scrollTo(0, y));
}

function renderDayPanel(ds){
  const d = new Date(ds + 'T00:00:00');
  const title = `${AR_WEEK[(d.getDay()+1)%7]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const plans = getSchedFor(ds, calDept);
  const canEdit = hasPerm('finance','edit');

  const depts = (calDept==='all' ? INTERNAL_DEPTS.map(x=>x.key) : [calDept]);
  const boxes = depts.map(k=>{
    const st = getDayDeptStats(ds, k);
    const rows = st.logs.map(l=>`
      <tr>
        <td>${escapeHtml(modelName(l.modelId))}</td>
        <td>${fmt(l.qty)}</td>
        <td>${fmt(l.hours)} س</td>
        <td>${fmt(l.revenue)} ج</td>
        <td>${escapeHtml(l.note||'—')}</td>
        <td class="row-actions">
          ${canEdit ? `
          <button class="icon-btn" onclick="openEditDayLog('${l.id}')">✏️</button>
          <button class="icon-btn" onclick="deleteDayLog('${l.id}')">🗑</button>
          ` : ''}
        </td>
      </tr>`).join('');

    return `<div class="day-entry-box">
      <div class="deb-head">
        <span>${deptLabel(k)}</span>
        ${st.active
          ? `<span class="badge ${st.profit>=0?'ok':'warn'}">${st.profit>=0?'ربح':'خسارة'} ${fmt(st.profit)} ج</span>`
          : `<span class="badge pending">مفيش تسجيل</span>`}
      </div>
      ${st.active ? `
        <div class="dt-row" style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;"><span>طاقة اليوم</span><b>${fmt(st.capacity)} س × ${fmt(st.rate)} ج = ${fmt(st.cost)} ج</b></div>
        <div class="dt-row" style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;"><span>اشتغل فعلاً</span><b>${fmt(st.workedHours)} س</b></div>
        <div class="dt-row" style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;"><span>ضاع من غير شغل</span><b style="color:var(--amber)">${fmt(st.idleHours)} س = ${fmt(st.idleCost)} ج</b></div>
        ${st.overHours>0 ? `<div class="dt-row" style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;"><span>ساعات إضافية فوق الطاقة</span><b>${fmt(st.overHours)} س</b></div>` : ''}
        <div class="dt-row" style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;"><span>دخل اليوم</span><b>${fmt(st.revenue)} ج</b></div>
        ${rows ? `<table class="data-table" style="margin-top:10px;">
          <thead><tr><th>الموديل</th><th>عدد</th><th>ساعات</th><th>الدخل</th><th>ملاحظة</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>`
        : `<div class="empty-state" style="padding:16px;"><p>القسم ده قعد فاضي اليوم ده — ${fmt(st.idleCost)} ج راحت من غير مقابل.</p></div>`}
      ` : `<div class="empty-state" style="padding:16px;"><p>مفيش أي تسجيل في اليوم ده.</p></div>`}
    </div>`;
  }).join('');

  return `
    <div class="panel">
      <h2>
        <span class="title-txt">📆 ${title}</span>
        ${canEdit ? `<button class="btn brass small" onclick="openDailyForDate('${ds}')">سجّل إنتاج اليوم ده</button>` : ''}
      </h2>
      ${plans.length ? `
        <div class="mini-note">
          <strong>محجوز في اليوم ده:</strong><br>
          ${plans.map(sc=>`📌 ${escapeHtml(modelName(sc.modelId))} — ${deptLabel(sc.dept)}${sc.hours?` (${fmt(sc.hours)} ساعة متوقعة)`:''}${sc.note?` — ${escapeHtml(sc.note)}`:''}`).join('<br>')}
        </div>` : ''}
      ${boxes}
    </div>`;
}

/* ============================================================
   شاشة تسجيل الإنتاج اليومي
============================================================ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
let dailyDate = todayStr();
let dailyModelId = null;

function openDailyForDate(ds){
  dailyDate = ds;
  switchMainTab('daily');
}

function renderDailyView(){
  if(!hasPerm('finance','view')){
    document.getElementById('view-daily').innerHTML = `<div class="locked-msg">🚫 مفيش صلاحية لعرض الحسابات المالية</div>`;
    return;
  }
  const canEdit = hasPerm('finance','edit');
  const y = window.scrollY;
  const models = state.models.filter(m => m.status !== 'closed');
  if(!dailyModelId || !models.some(m=>m.id===dailyModelId)) dailyModelId = models[0] ? models[0].id : null;

  const dayAll = getDayStats(dailyDate, 'all');
  const logsToday = (state.dayLogs||[]).filter(l=>l.date===dailyDate);

  const deptBoxes = INTERNAL_DEPTS.map(d=>{
    const cap = getDeptDailyCapacity(d.key);
    const rate = getDeptHourlyRate(d.key);
    return `<div class="day-entry-box">
      <div class="deb-head">
        <span>${d.label}</span>
        <span class="hint">طاقة ${fmt(cap)} س · ${fmt(rate)} ج/ساعة</span>
      </div>
      <div class="form-grid">
        <div class="field"><label>عدد القطع المنتجة</label>
          <input type="number" inputmode="numeric" id="dl_${d.key}_qty" placeholder="0" ${!canEdit?'disabled':''} oninput="autoRevenue('${d.key}')"></div>
        <div class="field"><label>الساعات اللي اتاخدت</label>
          <input type="number" inputmode="decimal" id="dl_${d.key}_hours" placeholder="0" ${!canEdit?'disabled':''}></div>
        <div class="field"><label>قيمة الشغل (ج)</label>
          <input type="number" inputmode="decimal" id="dl_${d.key}_rev" placeholder="0" ${!canEdit?'disabled':''}></div>
      </div>
      <div class="hint" id="dl_${d.key}_hint" style="margin-top:7px;"></div>
    </div>`;
  }).join('');

  const rows = logsToday.map(l=>`
    <tr>
      <td>${deptLabel(l.dept)}</td>
      <td>${escapeHtml(modelName(l.modelId))}</td>
      <td>${fmt(l.qty)}</td>
      <td>${fmt(l.hours)} س</td>
      <td>${fmt(l.revenue)} ج</td>
      <td class="row-actions">
        ${canEdit ? `
        <button class="icon-btn" onclick="openEditDayLog('${l.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteDayLog('${l.id}')">🗑</button>
        ` : ''}
      </td>
    </tr>`).join('');

  document.getElementById('view-daily').innerHTML = `
    <div class="panel">
      <h2><span class="title-txt">📥 تسجيل إنتاج اليوم</span></h2>
      <p class="hint">اختار اليوم والموديل، وسجّل كل قسم أنتج منه كام قطعة وأخد كام ساعة. سيب القسم فاضي لو مشتغلش على الموديل ده النهارده.</p>
      <div class="form-grid" style="margin-top:12px;">
        <div class="field"><label>التاريخ</label>
          <input type="date" id="dl_date" value="${dailyDate}" ${!canEdit?'disabled':''} onchange="dailyDate=this.value; renderDailyView();"></div>
        <div class="field"><label>الموديل</label>
          <select id="dl_model" ${!canEdit?'disabled':''} onchange="dailyModelId=this.value; renderDailyView();">
            ${models.map(m=>`<option value="${m.id}" ${m.id===dailyModelId?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${models.length===0 ? `<div class="empty-state" style="margin-top:12px;"><div class="icon">🧵</div><p>مفيش موديلات مفتوحة. ضيف موديل من تاب "الموديلات" الأول.</p></div>` : (!canEdit ? `<p class="hint" style="margin-top:12px;">عرض فقط — مفيش صلاحية تعديل الحسابات المالية</p>` : `
        <div style="margin-top:14px;">${deptBoxes}</div>
        <button class="btn brass full" onclick="saveDailyProduction()">احفظ إنتاج اليوم</button>
        <div class="hint" style="margin-top:10px;">
          قيمة الشغل بتتقترح تلقائي من سعر بيع القطعة ونصيب القسم من تكلفة الموديل، وتقدر تعدّلها بإيدك.
          لو سجّلت نفس اليوم ونفس الموديل ونفس القسم تاني، الرقم الجديد بيحلّ محل القديم.
        </div>`)}
    </div>
    <div class="panel">
      <h2>
        <span class="title-txt">سجل يوم ${formatDateArabic(dailyDate)}</span>
        <span class="badge ${dayAll.active ? (dayAll.profit>=0?'ok':'warn') : 'pending'}">
          ${dayAll.active ? `صافي اليوم ${fmt(dayAll.profit)} ج` : 'مفيش تسجيل'}
        </span>
      </h2>
      ${logsToday.length===0
        ? `<div class="empty-state"><div class="icon">📭</div><p>مفيش إنتاج مسجل في اليوم ده لسه.</p></div>`
        : `<table class="data-table">
            <thead><tr><th>القسم</th><th>الموديل</th><th>عدد</th><th>ساعات</th><th>الدخل</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
           </table>
           <div class="cost-summary" style="margin-top:14px;">
             <div class="cost-item"><div class="lbl">دخل اليوم</div><div class="val">${fmt(dayAll.revenue)} ج</div></div>
             <div class="cost-item"><div class="lbl">تكلفة اليوم</div><div class="val">${fmt(dayAll.cost)} ج</div></div>
             <div class="cost-item profit ${dayAll.profit<0?'negative':''}"><div class="lbl">الصافي</div><div class="val">${fmt(dayAll.profit)} ج</div></div>
             <div class="cost-item"><div class="lbl">ساعات ضايعة</div><div class="val" style="color:var(--amber)">${fmt(dayAll.idleHours)} س = ${fmt(dayAll.idleCost)} ج</div></div>
           </div>`}
    </div>
  `;
  INTERNAL_DEPTS.forEach(d=>autoRevenue(d.key, true));
  requestAnimationFrame(()=>window.scrollTo(0, y));
}

function autoRevenue(deptKey, silent){
  const qtyEl = document.getElementById('dl_'+deptKey+'_qty');
  const revEl = document.getElementById('dl_'+deptKey+'_rev');
  const hintEl = document.getElementById('dl_'+deptKey+'_hint');
  if(!qtyEl || !revEl) return;
  const qty = Number(qtyEl.value) || 0;
  const sug = suggestRevenue(dailyModelId, deptKey, qty);
  if(hintEl){
    hintEl.textContent = qty>0 && sug>0
      ? `قيمة مقترحة: ${fmt(sug)} ج (${fmt(qty)} قطعة × نصيب ${deptLabel(deptKey)} من سعر القطعة)`
      : '';
  }
  if(silent) return;
  if(!revEl.dataset.touched) revEl.value = sug ? Math.round(sug*100)/100 : '';
}

function saveDailyProduction(){
  if(!requireEdit('finance','تسجيل إنتاج اليوم')) return;
  if(!dailyModelId){ toast('اختار موديل الأول'); return; }
  if(!dailyDate){ toast('اختار التاريخ'); return; }
  let saved = 0;
  INTERNAL_DEPTS.forEach(d=>{
    const qty = Number(document.getElementById('dl_'+d.key+'_qty').value) || 0;
    const hours = Number(document.getElementById('dl_'+d.key+'_hours').value) || 0;
    const revenue = Number(document.getElementById('dl_'+d.key+'_rev').value) || 0;
    if(qty <= 0 && hours <= 0) return;
    const existing = (state.dayLogs||[]).find(l =>
      l.date===dailyDate && l.dept===d.key && l.modelId===dailyModelId);
    if(existing){
      existing.qty = qty; existing.hours = hours; existing.revenue = revenue;
    } else {
      state.dayLogs.push({id:uid(), date:dailyDate, dept:d.key, modelId:dailyModelId, qty, hours, revenue, note:''});
    }
    saved++;
  });
  if(saved === 0){ toast('اكتب عدد قطع أو ساعات لقسم واحد على الأقل'); return; }
  saveState();
  renderDailyView();
  toast(`تم حفظ ${saved} قسم ✓`);
}

async function deleteDayLog(id){
  if(!requireEdit('finance','حذف تسجيل إنتاج')) return;
  if(!await confirmDialog('هيتشال التسجيل ده، وحسابات اليوم هتتظبط من غيره.', {title:'حذف تسجيل الإنتاج', yes:'احذف', danger:true})) return;
  state.dayLogs = (state.dayLogs||[]).filter(l=>l.id!==id);
  saveState();
  if(document.getElementById('view-daily').classList.contains('active')) renderDailyView();
  else renderMonthView();
  toast('تم الحذف');
}

function openEditDayLog(id){
  if(!requireEdit('finance','تعديل تسجيل إنتاج')) return;
  const l = (state.dayLogs||[]).find(x=>x.id===id);
  if(!l) return;
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>تعديل تسجيل الإنتاج</h3>
    <div class="hint" style="margin-bottom:12px;">${deptLabel(l.dept)} — ${escapeHtml(modelName(l.modelId))} — ${formatDateArabic(l.date)}</div>
    <div class="form-grid">
      <div class="field"><label>عدد القطع</label><input type="number" inputmode="numeric" id="edl_qty" value="${l.qty||0}"></div>
      <div class="field"><label>الساعات</label><input type="number" inputmode="decimal" id="edl_hours" value="${l.hours||0}"></div>
      <div class="field"><label>قيمة الشغل (ج)</label><input type="number" inputmode="decimal" id="edl_rev" value="${l.revenue||0}"></div>
      <div class="field"><label>ملاحظة</label><input type="text" id="edl_note" value="${escapeHtml(l.note||'')}"></div>
    </div>
    <button class="btn brass full" style="margin-top:16px;" onclick="saveEditDayLog('${id}')">💾 حفظ التعديل</button>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveEditDayLog(id){
  if(!requireEdit('finance','تعديل تسجيل إنتاج')) return;
  const l = (state.dayLogs||[]).find(x=>x.id===id);
  if(!l) return;
  l.qty = Number(document.getElementById('edl_qty').value) || 0;
  l.hours = Number(document.getElementById('edl_hours').value) || 0;
  l.revenue = Number(document.getElementById('edl_rev').value) || 0;
  l.note = document.getElementById('edl_note').value.trim();
  saveState(); closeModal();
  if(document.getElementById('view-daily').classList.contains('active')) renderDailyView();
  else renderMonthView();
  toast('تم حفظ التعديل ✓');
}


window.onAuthReady = async function(){
  await loadStateFromCloud();
  const perms = window.currentPermissions || {};
  if(perms.models==='view' || perms.models==='edit') switchMainTab('models');
  else if(perms.finance==='view' || perms.finance==='edit') switchMainTab('month');
  else if(perms.attendance==='view' || perms.attendance==='edit') switchMainTab('attendance');
  else if(perms.employees==='view' || perms.employees==='edit' || perms.factory_settings==='view' || perms.factory_settings==='edit') switchMainTab('settings');
  else if(perms.users==='edit') switchMainTab('users');
  else switchMainTab('models');
};
</script>
