<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة إنتاج الخياطة</title>
<style>
  :root{
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface2: #f0f2f5;
    --border: #dde1e7;
    --text: #1a1d23;
    --text-dim: #5c6270;
    --text-muted: #8a90a0;
    --accent: #2563eb;
    --accent-dim: #e8f0fe;
    --green: #16a34a;
    --green-dim: #e8f8ee;
    --red: #dc2626;
    --red-dim: #fdecec;
    --amber: #d97706;
    --amber-dim: #fef3e2;
    --purple: #7c3aed;
    --purple-dim: #f1eafe;
    --radius: 12px;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky; top:0; z-index: 50;
  }
  header h1{ font-size: 18px; font-weight: 600; }
  header p{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .sync-status{
    display:flex; align-items:center; gap:6px;
    font-size: 11px; color: var(--text-muted);
    margin-top: 6px;
  }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); transition: background .3s; }
  .sync-status.connected .sync-dot{ background: var(--green); }
  .sync-status.connected{ color: var(--green); }
  .sync-status.error .sync-dot{ background: var(--red); }
  .sync-status.error{ color: var(--red); }
  .sync-status.syncing .sync-dot{ background: var(--amber); animation: pulse 1s infinite; }
  .sync-status.syncing{ color: var(--amber); }

  nav{
    display:flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 65px; z-index: 49;
    overflow-x: auto;
  }
  nav button{
    flex: 1; min-width: 90px;
    background: none; border:none; color: var(--text-dim);
    padding: 12px 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: .15s; white-space: nowrap;
  }
  nav button.active{ color: var(--accent); border-bottom-color: var(--accent); }
  nav button:hover{ color: var(--text); }

  main{ padding: 16px; max-width: 720px; margin: 0 auto; }
  .page{ display:none; }
  .page.active{ display:block; animation: fadeIn .2s; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3{ font-size: 15px; margin-bottom: 12px; }

  input, select{
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  input:focus, select:focus{ outline: none; border-color: var(--accent); }
  label{ font-size: 12px; color: var(--text-dim); display:block; margin-bottom: 4px; }

  .btn{
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn:hover{ background: var(--accent); color: white; }
  .btn.full{ width: 100%; }
  .btn.green{ background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .btn.green:hover{ background: var(--green); color: white; }
  .btn.red{ background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .btn.red:hover{ background: var(--red); color: white; }
  .btn.amber{ background: var(--amber-dim); color: var(--amber); border-color: var(--amber); }
  .btn.amber:hover{ background: var(--amber); color: white; }
  .btn.purple{ background: var(--purple-dim); color: var(--purple); border-color: var(--purple); }
  .btn.purple:hover{ background: var(--purple); color: white; }
  .btn.ghost{ background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn.ghost:hover{ background: var(--surface2); color: var(--text); }
  .btn:disabled{ opacity: .4; cursor: not-allowed; }

  .row{ display:flex; gap: 8px; }
  .row > *{ flex:1; }

  .list-item{
    display:flex; justify-content: space-between; align-items:center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: .12s;
  }
  .list-item:hover{ border-color: var(--accent); }
  .list-item .info{ flex:1; }
  .list-item .name{ font-size: 14px; font-weight: 500; }
  .list-item .sub{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .list-item .actions{ display:flex; gap:6px; }
  .icon-btn{
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    font-size: 14px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background: var(--surface2); color: var(--text); }
  .icon-btn.del:hover{ background: var(--red-dim); color: var(--red); border-color: var(--red); }

  .empty{ text-align:center; padding: 30px 10px; color: var(--text-muted); font-size: 13px; }

  .badge{ display:inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.amber{ background: var(--amber-dim); color: var(--amber); }
  .badge.green{ background: var(--green-dim); color: var(--green); }
  .badge.purple{ background: var(--purple-dim); color: var(--purple); }
  .badge.gray{ background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

  .breadcrumb{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
  }
  .breadcrumb span.crumb{ cursor:pointer; color: var(--accent); }
  .breadcrumb span.crumb:hover{ text-decoration: underline; }
  .breadcrumb span.sep{ color: var(--text-muted); }
  .breadcrumb span.current{ font-weight:600; color: var(--text); }

  .timer-display{ text-align:center; padding: 24px 0; }
  .timer-display .count{ font-size: 64px; font-weight: 700; color: var(--accent); line-height: 1; }
  .timer-display .label{ font-size: 13px; color: var(--text-dim); margin-top: 8px; }
  .timer-display .clock{ font-size: 22px; color: var(--text-dim); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .rate-display{ text-align:center; font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .produce-btn{
    width: 100%; padding: 28px; font-size: 22px; font-weight: 700;
    border-radius: var(--radius); background: var(--green-dim); color: var(--green);
    border: 2px solid var(--green); cursor: pointer; margin: 16px 0; transition: .1s;
  }
  .produce-btn:active{ transform: scale(0.97); }

  .session-active-badge{
    display:flex; align-items:center; gap:6px; justify-content:center;
    background: var(--green-dim); color: var(--green);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    width: fit-content; margin: 0 auto 12px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  th{ text-align:right; color: var(--text-muted); font-weight:500; font-size:11px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  td{ padding: 8px 4px; border-bottom: 1px solid var(--border); }
  tr:last-child td{ border-bottom: none; }

  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white;
    padding: 10px 20px; border-radius: 30px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-card{ background: var(--surface2); border-radius: 10px; padding: 12px; }
  .stat-card .v{ font-size: 20px; font-weight: 700; }
  .stat-card .l{ font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .choice-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding: 24px 16px; border-radius: var(--radius);
    border: 2px solid var(--border); cursor:pointer; text-align:center;
    background: var(--surface2); transition:.15s;
  }
  .choice-card:hover{ border-color: var(--accent); }
  .choice-card .icon{ font-size: 32px; }
  .choice-card .title{ font-size: 14px; font-weight:600; }
  .choice-card .desc{ font-size: 11px; color: var(--text-muted); }

  .performance-bar{
    background: var(--surface2); border-radius: 6px; height: 10px; overflow:hidden; margin-top:6px;
  }
  .performance-bar .fill{ height:100%; border-radius:6px; }

  .confirm-overlay{
    display:none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  .confirm-overlay.show{ display:flex; }
  .confirm-box{
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    max-width: 360px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.15);
  }
  .confirm-box p{ font-size: 14px; line-height: 1.6; }

  .modal-overlay{
    display:none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 190; align-items: flex-start; justify-content: center; padding: 20px;
    overflow-y: auto;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    max-width: 420px; width: 100%; margin-top: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
  }
  .modal-box h3{ font-size: 16px; margin-bottom: 14px; }
</style>
</head>
<body>

<header>
  <h1>🧵 متابعة إنتاج الخياطة</h1>
  <p>طيب المسلم — معيار كل عامل وإنتاجه اليومي</p>
  <div id="sync-status" class="sync-status">
    <span class="sync-dot"></span>
    <span id="sync-status-text">بيتصل...</span>
  </div>
</header>

<nav>
  <button class="nav-btn active" data-page="models">📦 الموديلات</button>
  <button class="nav-btn" data-page="employees">👥 الموظفين</button>
  <button class="nav-btn" data-page="reports">📈 التقارير</button>
</nav>

<main>
  <div id="page-models" class="page active"></div>
  <div id="page-employees" class="page"></div>
  <div id="page-reports" class="page"></div>
</main>

<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg"></p>
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" id="confirm-cancel">إلغاء</button>
      <button class="btn green" id="confirm-ok">تأكيد</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
// ============ إعداد Firebase ============
const firebaseConfig = {
  apiKey: "AIzaSyD8jxpVrvicStETloL8tk5s865dmNatIqE",
  authDomain: "mazen-productivity-bab1c.firebaseapp.com",
  projectId: "mazen-productivity-bab1c",
  storageBucket: "mazen-productivity-bab1c.firebasestorage.app",
  messagingSenderId: "388570583199",
  appId: "1:388570583199:web:468f235b2481a15a2252aa",
  databaseURL: "https://mazen-productivity-bab1c-default-rtdb.firebaseio.com"
};

let dbRef = null;
let isRemoteUpdate = false;
let saveDebounceTimer = null;

function setSyncStatus(state, text){
  const el = document.getElementById('sync-status');
  const textEl = document.getElementById('sync-status-text');
  if(!el) return;
  el.className = 'sync-status ' + state;
  textEl.textContent = text;
}

function initFirebaseSync(){
  try{
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    dbRef = database.ref('sewing_tracker_data');

    setSyncStatus('syncing', 'بيتصل...');

    database.ref('.info/connected').on('value', (snap)=>{
      setSyncStatus(snap.val()===true ? 'connected' : 'error', snap.val()===true ? 'متصل ومتزامن' : 'غير متصل - بيشتغل محلياً');
    });

    dbRef.on('value', (snapshot)=>{
      const remoteData = snapshot.val();
      if(remoteData){
        isRemoteUpdate = true;
        DB = remoteData;
        if(!DB.employees) DB.employees = [];
        if(!DB.models) DB.models = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        renderCurrentPage();
        isRemoteUpdate = false;
      } else {
        pushToFirebase();
      }
    }, (err)=>{
      console.error('خطأ في المزامنة', err);
      setSyncStatus('error', 'فشل الاتصال - بيشتغل محلياً');
    });
  }catch(e){
    console.error('فشل تهيئة فايربيز', e);
    setSyncStatus('error', 'المزامنة غير متاحة');
  }
}

function pushToFirebase(){
  if(!dbRef) return;
  dbRef.set(DB).catch(err=>{
    console.error('فشل رفع البيانات', err);
    setSyncStatus('error', 'فشل رفع التحديث');
  });
}

// ============ التخزين (localStorage) ============
const STORAGE_KEY = 'sewing_tracker_data_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('خطأ في قراءة البيانات', e); }
  return { employees: [], models: [] };
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    console.error('خطأ في الحفظ', e);
    showToast('⚠️ فشل الحفظ - المساحة ممتلئة؟');
  }
  if(!isRemoteUpdate){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(pushToFirebase, 400);
  }
}

// ============ المتغيرات العامة (كلها هنا فوق لتجنب مشاكل التهيئة) ============
let DB = loadData();

// حالة التنقل داخل صفحة الموديلات (موديل → مرحلة → عامل)
let currentModelId = null;
let currentStageIndex = null;
let currentWorkerEmployeeId = null;

// وضع إضافة/تعديل موديل
let editingModelId = null;
let tempStages = [];
let editingStageIndex = null;

// جلسة العداد الحي (تستخدم لتسجيل المعيار)
let activeStandardSession = null; // { pieces:[timestamps], startTime }
let liveTimerInterval = null;

// ============ أدوات مساعدة ============
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

function formatTime(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function todayStr(){
  return new Date().toISOString().slice(0,10); // YYYY-MM-DD
}

function formatDateArabic(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ar-EG', { weekday:'short', day:'numeric', month:'short' });
}

function confirmAction(msg, onConfirm){
  const overlay = document.getElementById('confirm-overlay');
  const msgEl = document.getElementById('confirm-msg');
  const okBtn = document.getElementById('confirm-ok');
  const cancelBtn = document.getElementById('confirm-cancel');

  msgEl.textContent = msg;
  overlay.classList.add('show');

  function cleanup(){
    overlay.classList.remove('show');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
  }
  function handleOk(){ cleanup(); onConfirm(); }
  function handleCancel(){ cleanup(); }

  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
}

function showModal(html, onRender){
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = html;
  overlay.classList.add('show');
  if(onRender) onRender(box);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}

function empName(id){
  const e = DB.employees.find(x=>x.id===id);
  return e ? e.name : '(محذوف)';
}

// ============ التنقل بين الصفحات ============
function renderCurrentPage(){
  const activeBtn = document.querySelector('.nav-btn.active');
  const page = activeBtn ? activeBtn.dataset.page : 'models';
  if(page==='models') renderModelsPage();
  else if(page==='employees') renderEmployeesPage();
  else if(page==='reports') renderReportsPage();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    renderCurrentPage();
  });
});

renderModelsPage();
renderEmployeesPage();
renderReportsPage();
initFirebaseSync();

// ============ صفحة الموظفين ============
function renderEmployeesPage(){
  const el = document.getElementById('page-employees');
  el.innerHTML = `
    <div class="card">
      <h3>➕ إضافة موظف جديد</h3>
      <label>اسم الموظف</label>
      <input type="text" id="emp-name" placeholder="مثال: عامل 1" />
      <label>المرتب الشهري (جنيه)</label>
      <input type="number" id="emp-salary" placeholder="مثال: 8000" />
      <button class="btn full" id="emp-add-btn">إضافة الموظف</button>
    </div>
    <div class="card">
      <h3>👥 قائمة الموظفين (${DB.employees.length})</h3>
      <div id="emp-list"></div>
    </div>
  `;

  document.getElementById('emp-add-btn').addEventListener('click', ()=>{
    const nameInput = document.getElementById('emp-name');
    const salaryInput = document.getElementById('emp-salary');
    const name = nameInput.value.trim();
    const salary = parseFloat(salaryInput.value);
    if(!name){ showToast('⚠️ اكتب اسم الموظف'); nameInput.focus(); return; }
    if(!salary || salary <= 0){ showToast('⚠️ اكتب مرتب صحيح'); salaryInput.focus(); return; }
    DB.employees.push({ id: uid(), name, salary, createdAt: Date.now() });
    saveData();
    showToast('✅ تم إضافة ' + name);
    renderEmployeesPage();
  });

  const listEl = document.getElementById('emp-list');
  if(DB.employees.length === 0){
    listEl.innerHTML = '<div class="empty">لسه معملتش موظفين. ابدأ بإضافة أول موظف فوق ⬆️</div>';
    return;
  }
  listEl.innerHTML = DB.employees.map(emp => `
    <div class="list-item" style="cursor:default;">
      <div class="info">
        <div class="name">${escapeHtml(emp.name)}</div>
        <div class="sub">${emp.salary.toLocaleString('en-US')} جنيه/شهر</div>
      </div>
      <div class="actions">
        <button class="icon-btn" onclick="editEmployee('${emp.id}')">✏️</button>
        <button class="icon-btn del" onclick="deleteEmployee('${emp.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function editEmployee(id){
  const emp = DB.employees.find(e=>e.id===id);
  if(!emp) return;
  showModal(`
    <h3>✏️ تعديل بيانات الموظف</h3>
    <label>اسم الموظف</label>
    <input type="text" id="edit-emp-name" value="${escapeHtml(emp.name)}" />
    <label>المرتب الشهري</label>
    <input type="number" id="edit-emp-salary" value="${emp.salary}" />
    <div class="row" style="margin-top:12px;">
      <button class="btn ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn green" id="save-emp-edit-btn">حفظ</button>
    </div>
  `, (box)=>{
    box.querySelector('#save-emp-edit-btn').addEventListener('click', ()=>{
      const newName = box.querySelector('#edit-emp-name').value.trim();
      const newSalary = parseFloat(box.querySelector('#edit-emp-salary').value);
      if(!newName || !newSalary){ showToast('⚠️ بيانات غير صحيحة'); return; }
      emp.name = newName;
      emp.salary = newSalary;
      saveData();
      showToast('✅ تم التعديل');
      closeModal();
      renderEmployeesPage();
      renderModelsPage();
    });
  });
}

function deleteEmployee(id){
  const emp = DB.employees.find(e=>e.id===id);
  if(!emp) return;
  confirmAction(`متأكد من حذف ${emp.name}؟ (سجلاته في الموديلات هتفضل باسمه القديم)`, ()=>{
    DB.employees = DB.employees.filter(e=>e.id!==id);
    saveData();
    showToast('🗑️ تم الحذف');
    renderEmployeesPage();
    renderModelsPage();
  });
}

// ============ صفحة الموديلات (المستوى 1: قائمة الموديلات) ============
function migrateStage(s){
  if(typeof s === 'string') return { name: s, unitsPerPiece: 1, workers: [] };
  if(!s.workers) s.workers = [];
  return s;
}

function renderModelsPage(){
  // بيحدد أنهي مستوى نعرضه بناءً على الحالة الحالية
  if(currentWorkerEmployeeId !== null){
    renderWorkerDetailPage();
  } else if(currentStageIndex !== null){
    renderStageWorkersPage();
  } else if(currentModelId !== null || editingModelId !== null || tempStages.length > 0){
    // حالة خاصة: لو بنعمل موديل جديد ولسه مفتحناش موديل بعد
    if(currentModelId !== null){
      renderModelStagesPage();
    } else {
      renderModelFormPage();
    }
  } else {
    renderModelsListPage();
  }
}

function renderModelsListPage(){
  const el = document.getElementById('page-models');
  el.innerHTML = `
    <div class="card">
      <div class="row">
        <button class="btn full green" id="new-model-btn">➕ إضافة موديل جديد</button>
      </div>
    </div>
    <div class="card">
      <h3>📦 الموديلات المسجلة (${DB.models.length})</h3>
      <div id="model-list"></div>
    </div>
  `;

  document.getElementById('new-model-btn').addEventListener('click', ()=>{
    editingModelId = null;
    tempStages = [];
    renderModelFormPage();
  });

  const listEl = document.getElementById('model-list');
  if(DB.models.length === 0){
    listEl.innerHTML = '<div class="empty">لسه معملتش موديلات. ضيف موديل جديد فوق ⬆️</div>';
    return;
  }
  listEl.innerHTML = DB.models.map(m => {
    const stages = m.stages.map(migrateStage);
    const stagesLabel = stages.map(s=>escapeHtml(s.name)).join(' ← ');
    return `
    <div class="list-item" onclick="openModel('${m.id}')">
      <div class="info">
        <div class="name">${escapeHtml(m.name)} ${m.totalPieces ? `<span class="badge amber">${m.totalPieces} قطعة مطلوبة</span>` : ''}</div>
        <div class="sub">${stagesLabel || 'مفيش مراحل مسجلة'}</div>
      </div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="icon-btn" onclick="startEditModel('${m.id}')">✏️</button>
        <button class="icon-btn del" onclick="deleteModel('${m.id}')">🗑️</button>
      </div>
    </div>
  `;
  }).join('');
}

function openModel(id){
  currentModelId = id;
  currentStageIndex = null;
  currentWorkerEmployeeId = null;
  renderModelsPage();
}

function deleteModel(id){
  const model = DB.models.find(m=>m.id===id);
  if(!model) return;
  confirmAction(`متأكد من حذف موديل "${model.name}"؟ هيتمسح معاه كل المعايير والسجلات المسجلة جواه.`, ()=>{
    DB.models = DB.models.filter(m=>m.id!==id);
    saveData();
    showToast('🗑️ تم الحذف');
    renderModelsPage();
  });
}

// ============ فورم إضافة/تعديل موديل ============
function renderModelFormPage(){
  const el = document.getElementById('page-models');
  const isEditing = editingModelId !== null;
  const editingModel = isEditing ? DB.models.find(m=>m.id===editingModelId) : null;

  el.innerHTML = `
    <div class="breadcrumb">
      <span class="crumb" onclick="backToModelsList()">📦 الموديلات</span>
      <span class="sep">/</span>
      <span class="current">${isEditing ? 'تعديل: ' + escapeHtml(editingModel.name) : 'موديل جديد'}</span>
    </div>
    <div class="card">
      <h3>${isEditing ? '✏️ تعديل الموديل' : '➕ إضافة موديل جديد'}</h3>
      <label>اسم الموديل</label>
      <input type="text" id="model-name" placeholder="مثال: سروال كلاسيك" />
      <label>عدد قطع الطلبية (اختياري)</label>
      <input type="number" id="model-total-pieces" placeholder="مثال: 500" min="0" />
      <label>مراحل الخياطة</label>
      <div class="row" style="margin-bottom:6px; align-items:flex-start;">
        <input type="text" id="stage-name-input" placeholder="اسم المرحلة مثال: الجيوب" style="margin-bottom:0;" />
        <input type="number" id="stage-units-input" placeholder="عدد/قطعة" value="1" min="0.1" step="0.1" style="margin-bottom:0; flex:0 0 90px;" />
        <button class="btn ghost" id="add-stage-btn" style="flex:0 0 auto; padding:10px 16px;">➕</button>
      </div>
      <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;" id="stage-hint">
        "عدد/قطعة": كام وحدة من المرحلة دي لازمة للقطعة النهائية. مثال: سروال فيه 4 جيوب → اكتب 4. اضغط على أي مرحلة تحت عشان تعدلها.
      </div>
      <div id="temp-stages-list"></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost" id="model-cancel-btn">إلغاء</button>
        <button class="btn full green" id="model-save-btn">${isEditing ? '💾 حفظ التعديلات' : 'حفظ الموديل'}</button>
      </div>
    </div>
  `;

  if(isEditing){
    document.getElementById('model-name').value = editingModel.name;
    document.getElementById('model-total-pieces').value = editingModel.totalPieces || '';
  }

  renderTempStages();

  document.getElementById('add-stage-btn').addEventListener('click', addTempStage);
  document.getElementById('stage-name-input').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); addTempStage(); }
  });
  document.getElementById('model-save-btn').addEventListener('click', saveModel);
  document.getElementById('model-cancel-btn').addEventListener('click', ()=>{
    editingModelId = null;
    tempStages = [];
    editingStageIndex = null;
    renderModelsPage();
  });
}

function backToModelsList(){
  editingModelId = null;
  tempStages = [];
  editingStageIndex = null;
  currentModelId = null;
  currentStageIndex = null;
  currentWorkerEmployeeId = null;
  renderModelsPage();
}

function renderTempStages(){
  const el = document.getElementById('temp-stages-list');
  if(!el) return;
  if(tempStages.length === 0){
    el.innerHTML = '<div class="empty" style="padding:14px;">ضيف مرحلة واحدة على الأقل</div>';
    return;
  }
  el.innerHTML = tempStages.map((s,i) => `
    <div class="list-item" style="${editingStageIndex===i ? 'border-color:var(--accent);' : ''}" onclick="editTempStage(${i})">
      <div class="info">
        <div class="name">${i+1}. ${escapeHtml(s.name)} <span class="badge green">×${s.unitsPerPiece}</span></div>
      </div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="icon-btn del" onclick="removeTempStage(${i})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function editTempStage(i){
  const stage = tempStages[i];
  if(!stage) return;
  editingStageIndex = i;
  document.getElementById('stage-name-input').value = stage.name;
  document.getElementById('stage-units-input').value = stage.unitsPerPiece;
  document.getElementById('add-stage-btn').textContent = '💾';
  document.getElementById('stage-hint').innerHTML = `✏️ بتعدل مرحلة "${escapeHtml(stage.name)}" — احفظ أو <a href="#" onclick="cancelEditTempStage();return false;" style="color:var(--accent);">إلغاء</a>`;
  document.getElementById('stage-name-input').focus();
  renderTempStages();
}

function cancelEditTempStage(){
  editingStageIndex = null;
  document.getElementById('stage-name-input').value = '';
  document.getElementById('stage-units-input').value = '1';
  document.getElementById('add-stage-btn').textContent = '➕';
  document.getElementById('stage-hint').innerHTML = '"عدد/قطعة": كام وحدة من المرحلة دي لازمة للقطعة النهائية. مثال: سروال فيه 4 جيوب → اكتب 4. اضغط على أي مرحلة تحت عشان تعدلها.';
  renderTempStages();
}

function addTempStage(){
  const nameInput = document.getElementById('stage-name-input');
  const unitsInput = document.getElementById('stage-units-input');
  const val = nameInput.value.trim();
  const units = parseFloat(unitsInput.value);
  if(!val){ showToast('⚠️ اكتب اسم المرحلة'); return; }
  if(!units || units <= 0){ showToast('⚠️ اكتب عدد صحيح للمرحلة'); return; }

  if(editingStageIndex !== null){
    tempStages[editingStageIndex].name = val;
    tempStages[editingStageIndex].unitsPerPiece = units;
    showToast('✅ تم تعديل المرحلة');
    cancelEditTempStage();
    return;
  }

  tempStages.push({ name: val, unitsPerPiece: units, workers: [] });
  nameInput.value = '';
  unitsInput.value = '1';
  nameInput.focus();
  renderTempStages();
}

function removeTempStage(i){
  if(editingStageIndex === i) cancelEditTempStage();
  tempStages.splice(i,1);
  renderTempStages();
}

function startEditModel(id){
  const model = DB.models.find(m=>m.id===id);
  if(!model) return;
  editingModelId = id;
  tempStages = model.stages.map(migrateStage).map(s=>({...s, workers: s.workers.map(w=>({...w}))}));
  editingStageIndex = null;
  currentModelId = null;
  renderModelsPage();
}

function saveModel(){
  const nameInput = document.getElementById('model-name');
  const totalPiecesInput = document.getElementById('model-total-pieces');
  const name = nameInput.value.trim();
  const totalPieces = totalPiecesInput.value ? parseFloat(totalPiecesInput.value) : null;

  if(!name){ showToast('⚠️ اكتب اسم الموديل'); nameInput.focus(); return; }
  if(tempStages.length === 0){ showToast('⚠️ ضيف مرحلة واحدة على الأقل'); return; }

  if(editingModelId){
    const model = DB.models.find(m=>m.id===editingModelId);
    if(!model){ showToast('⚠️ الموديل ده اتحذف'); editingModelId=null; renderModelsPage(); return; }
    model.name = name;
    model.totalPieces = totalPieces;
    // نحافظ على بيانات العمال المرتبطة بكل مرحلة عن طريق مطابقة الاسم
    model.stages = tempStages.map(s=>({ name:s.name, unitsPerPiece:s.unitsPerPiece, workers: s.workers || [] }));
    saveData();
    showToast('✅ تم حفظ تعديلات ' + name);
  } else {
    DB.models.push({
      id: uid(), name, totalPieces,
      stages: tempStages.map(s=>({ name:s.name, unitsPerPiece:s.unitsPerPiece, workers: [] })),
      createdAt: Date.now()
    });
    saveData();
    showToast('✅ تم حفظ موديل ' + name);
  }

  editingModelId = null;
  tempStages = [];
  editingStageIndex = null;
  renderModelsPage();
}

// ============ المستوى 2: صفحة الموديل المفتوح (قائمة المراحل) ============
function renderModelStagesPage(){
  const el = document.getElementById('page-models');
  const model = DB.models.find(m=>m.id===currentModelId);
  if(!model){ currentModelId=null; renderModelsPage(); return; }
  const stages = model.stages.map(migrateStage);

  el.innerHTML = `
    <div class="breadcrumb">
      <span class="crumb" onclick="backToModelsList()">📦 الموديلات</span>
      <span class="sep">/</span>
      <span class="current">${escapeHtml(model.name)}</span>
    </div>
    <div class="card">
      <h3>مراحل الخياطة${model.totalPieces ? ` <span class="badge amber">الطلبية: ${model.totalPieces} قطعة</span>` : ''}</h3>
      <div id="stages-list"></div>
    </div>
  `;

  const listEl = document.getElementById('stages-list');
  if(stages.length === 0){
    listEl.innerHTML = '<div class="empty">الموديل ده معملوش مراحل. عدّله من قائمة الموديلات وضيف مراحل.</div>';
    return;
  }
  listEl.innerHTML = stages.map((s,i) => {
    const workerCount = s.workers.length;
    return `
    <div class="list-item" onclick="openStage(${i})">
      <div class="info">
        <div class="name">${escapeHtml(s.name)} <span class="badge green">×${s.unitsPerPiece}</span></div>
        <div class="sub">${workerCount} عامل مسجل على المرحلة دي</div>
      </div>
    </div>
  `;
  }).join('');
}

function openStage(stageIndex){
  currentStageIndex = stageIndex;
  currentWorkerEmployeeId = null;
  renderModelsPage();
}

function backToModelStages(){
  currentStageIndex = null;
  currentWorkerEmployeeId = null;
  renderModelsPage();
}

// ============ المستوى 3: صفحة المرحلة (قائمة العمال) ============
function renderStageWorkersPage(){
  const el = document.getElementById('page-models');
  const model = DB.models.find(m=>m.id===currentModelId);
  if(!model){ currentModelId=null; currentStageIndex=null; renderModelsPage(); return; }
  const stages = model.stages.map(migrateStage);
  const stage = stages[currentStageIndex];
  if(!stage){ currentStageIndex=null; renderModelsPage(); return; }

  const availableEmployees = DB.employees.filter(e => !stage.workers.some(w=>w.employeeId===e.id));

  el.innerHTML = `
    <div class="breadcrumb">
      <span class="crumb" onclick="backToModelsList()">📦 الموديلات</span>
      <span class="sep">/</span>
      <span class="crumb" onclick="backToModelStages()">${escapeHtml(model.name)}</span>
      <span class="sep">/</span>
      <span class="current">${escapeHtml(stage.name)}</span>
    </div>
    <div class="card">
      <h3>➕ إضافة عامل على مرحلة "${escapeHtml(stage.name)}"</h3>
      ${DB.employees.length === 0 ? `
        <div class="empty">لسه معملتش موظفين. ضيفهم من تبويب "الموظفين" الأول.</div>
      ` : availableEmployees.length === 0 ? `
        <div class="empty">كل الموظفين المسجلين شغالين بالفعل على المرحلة دي.</div>
      ` : `
        <select id="add-worker-select">
          <option value="">-- اختر عامل --</option>
          ${availableEmployees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}
        </select>
        <button class="btn full" id="add-worker-btn">إضافة العامل للمرحلة</button>
      `}
    </div>
    <div class="card">
      <h3>👷 العمال المسجلين على المرحلة دي (${stage.workers.length})</h3>
      <div id="stage-workers-list"></div>
    </div>
  `;

  if(availableEmployees.length > 0 && DB.employees.length > 0){
    document.getElementById('add-worker-btn').addEventListener('click', ()=>{
      const select = document.getElementById('add-worker-select');
      const employeeId = select.value;
      if(!employeeId){ showToast('⚠️ اختر عامل'); return; }
      stage.workers.push({ employeeId, standard: null, dailyLogs: [] });
      saveData();
      showToast('✅ تم إضافة ' + empName(employeeId) + ' للمرحلة');
      renderModelsPage();
    });
  }

  const listEl = document.getElementById('stage-workers-list');
  if(stage.workers.length === 0){
    listEl.innerHTML = '<div class="empty">لسه مفيش عمال مسجلين على المرحلة دي. ضيف عامل فوق ⬆️</div>';
    return;
  }
  listEl.innerHTML = stage.workers.map(w => {
    const hasStandard = !!w.standard;
    const totalProduced = (w.dailyLogs||[]).reduce((a,l)=>a+l.quantity,0);
    return `
    <div class="list-item" onclick="openWorker('${w.employeeId}')">
      <div class="info">
        <div class="name">${escapeHtml(empName(w.employeeId))}</div>
        <div class="sub">
          ${hasStandard
            ? `<span class="badge purple">معيار: ${w.standard.secPerPiece.toFixed(1)} ث/قطعة</span>`
            : `<span class="badge gray">لسه مفيش معيار</span>`}
          ${totalProduced > 0 ? ` · إجمالي الإنتاج: ${totalProduced} وحدة` : ''}
        </div>
      </div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="icon-btn del" onclick="removeWorkerFromStage('${w.employeeId}')">🗑️</button>
      </div>
    </div>
  `;
  }).join('');
}

function removeWorkerFromStage(employeeId){
  const model = DB.models.find(m=>m.id===currentModelId);
  const stage = model.stages.map(migrateStage)[currentStageIndex];
  confirmAction(`متأكد من إزالة ${empName(employeeId)} من المرحلة دي؟ هيتمسح معياره وسجل إنتاجه هنا.`, ()=>{
    stage.workers = stage.workers.filter(w=>w.employeeId!==employeeId);
    saveData();
    showToast('🗑️ تم الحذف');
    renderModelsPage();
  });
}

function openWorker(employeeId){
  currentWorkerEmployeeId = employeeId;
  renderModelsPage();
}

function backToStageWorkers(){
  currentWorkerEmployeeId = null;
  renderModelsPage();
}

// ============ المستوى 4: صفحة العامل (المعيار + سجل الإنتاج اليومي) ============
function getCurrentWorker(){
  const model = DB.models.find(m=>m.id===currentModelId);
  if(!model) return null;
  const stage = model.stages.map(migrateStage)[currentStageIndex];
  if(!stage) return null;
  const worker = stage.workers.find(w=>w.employeeId===currentWorkerEmployeeId);
  return { model, stage, worker };
}

function renderWorkerDetailPage(){
  const el = document.getElementById('page-models');
  const ctx = getCurrentWorker();
  if(!ctx || !ctx.worker){ currentWorkerEmployeeId=null; renderModelsPage(); return; }
  const { model, stage, worker } = ctx;

  const dailyLogs = [...(worker.dailyLogs||[])].sort((a,b)=> b.date.localeCompare(a.date));
  const totalProduced = dailyLogs.reduce((a,l)=>a+l.quantity,0);
  const hasStandard = !!worker.standard;

  el.innerHTML = `
    <div class="breadcrumb">
      <span class="crumb" onclick="backToModelsList()">📦 الموديلات</span>
      <span class="sep">/</span>
      <span class="crumb" onclick="backToModelStages()">${escapeHtml(model.name)}</span>
      <span class="sep">/</span>
      <span class="crumb" onclick="backToStageWorkers()">${escapeHtml(stage.name)}</span>
      <span class="sep">/</span>
      <span class="current">${escapeHtml(empName(worker.employeeId))}</span>
    </div>

    <div class="card">
      <h3>📏 المعيار الرسمي</h3>
      ${hasStandard ? `
        <div class="stat-grid">
          <div class="stat-card">
            <div class="v">${worker.standard.secPerPiece.toFixed(1)} ث</div>
            <div class="l">لكل قطعة</div>
          </div>
          <div class="stat-card">
            <div class="v">${(3600/worker.standard.secPerPiece).toFixed(1)}</div>
            <div class="l">قطعة/ساعة</div>
          </div>
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">
          اتسجل بتاريخ ${new Date(worker.standard.recordedAt).toLocaleDateString('ar-EG')} — من قياس ${worker.standard.pieceCount} قطعة في ${formatTime(worker.standard.totalSeconds)}
        </div>
        <button class="btn full amber" id="remeasure-standard-btn">🔄 إعادة قياس المعيار</button>
      ` : `
        <div class="empty" style="padding:14px 10px;">لسه مفيش معيار مسجل لهذا العامل في المرحلة دي.</div>
        <button class="btn full purple" id="measure-standard-btn">📏 قياس المعيار (بإشراف)</button>
      `}
    </div>

    <div class="card">
      <h3>📅 سجل الإنتاج اليومي</h3>
      <div class="row" style="align-items:flex-end;">
        <div style="flex:1;">
          <label>التاريخ</label>
          <input type="date" id="daily-log-date" value="${todayStr()}" />
        </div>
        <div style="flex:1;">
          <label>الكمية المنتجة</label>
          <input type="number" id="daily-log-qty" placeholder="مثال: 45" min="0" />
        </div>
      </div>
      <button class="btn full green" id="save-daily-log-btn">💾 حفظ إنتاج اليوم</button>

      <div style="margin-top:14px;">
        ${totalProduced > 0 ? `<div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">إجمالي الإنتاج المسجل: <b>${totalProduced}</b> وحدة</div>` : ''}
        <div id="daily-logs-list"></div>
      </div>
    </div>
  `;

  if(hasStandard){
    document.getElementById('remeasure-standard-btn').addEventListener('click', ()=> startStandardMeasurement());
  } else {
    document.getElementById('measure-standard-btn').addEventListener('click', ()=> startStandardMeasurement());
  }

  document.getElementById('save-daily-log-btn').addEventListener('click', ()=>{
    const dateInput = document.getElementById('daily-log-date');
    const qtyInput = document.getElementById('daily-log-qty');
    const date = dateInput.value;
    const qty = parseFloat(qtyInput.value);
    if(!date){ showToast('⚠️ اختر التاريخ'); return; }
    if(!qty || qty <= 0){ showToast('⚠️ اكتب كمية صحيحة'); qtyInput.focus(); return; }

    if(!worker.dailyLogs) worker.dailyLogs = [];
    const existing = worker.dailyLogs.find(l=>l.date===date);
    if(existing){
      confirmAction(`فيه إنتاج مسجل بالفعل في ${formatDateArabic(date)} (${existing.quantity} وحدة). عايز تستبدله بـ ${qty}؟`, ()=>{
        existing.quantity = qty;
        saveData();
        showToast('✅ تم تحديث إنتاج اليوم');
        renderModelsPage();
      });
    } else {
      worker.dailyLogs.push({ date, quantity: qty });
      saveData();
      showToast('✅ تم حفظ إنتاج اليوم');
      qtyInput.value = '';
      renderModelsPage();
    }
  });

  renderDailyLogsList(dailyLogs);
}

function renderDailyLogsList(dailyLogs){
  const el = document.getElementById('daily-logs-list');
  if(!el) return;
  if(dailyLogs.length === 0){
    el.innerHTML = '<div class="empty">لسه مفيش إنتاج يومي مسجل.</div>';
    return;
  }
  el.innerHTML = dailyLogs.map(l => `
    <div class="list-item" style="cursor:default;">
      <div class="info">
        <div class="name">${formatDateArabic(l.date)}</div>
        <div class="sub">${l.quantity} وحدة</div>
      </div>
      <div class="actions">
        <button class="icon-btn del" onclick="deleteDailyLog('${l.date}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function deleteDailyLog(date){
  const ctx = getCurrentWorker();
  if(!ctx) return;
  confirmAction(`متأكد من حذف إنتاج يوم ${formatDateArabic(date)}؟`, ()=>{
    ctx.worker.dailyLogs = ctx.worker.dailyLogs.filter(l=>l.date!==date);
    saveData();
    showToast('🗑️ تم الحذف');
    renderModelsPage();
  });
}

// ============ جلسة قياس المعيار (عداد حي بإشراف) ============
function startStandardMeasurement(){
  activeStandardSession = { pieces: [], startTime: Date.now() };
  renderStandardMeasurementModal();
}

function renderStandardMeasurementModal(){
  const ctx = getCurrentWorker();
  if(!ctx) return;
  const count = activeStandardSession.pieces.length;

  showModal(`
    <h3>📏 قياس المعيار — ${escapeHtml(empName(ctx.worker.employeeId))}</h3>
    <div style="text-align:center; font-size:12px; color:var(--text-dim); margin-bottom:8px;">
      ${escapeHtml(ctx.model.name)} — ${escapeHtml(ctx.stage.name)}
    </div>
    <div class="session-active-badge"><span class="dot"></span> جلسة قياس شغالة</div>
    <div class="timer-display">
      <div class="count" id="standard-piece-count">${count}</div>
      <div class="label">قطعة</div>
      <div class="clock" id="standard-elapsed-clock">00:00</div>
      <div class="rate-display" id="standard-rate-display">هتظهر السرعة بعد أول قطعة</div>
    </div>
    <button class="produce-btn" id="standard-produce-btn">✅ أنتج قطعة</button>
    <div class="row">
      <button class="btn ghost" id="standard-undo-btn">↩️ تراجع</button>
      <button class="btn ghost" id="standard-cancel-btn">إلغاء الجلسة</button>
    </div>
    <button class="btn full purple" id="standard-finish-btn" style="margin-top:10px;">⏹ إنهاء واعتماد المعيار</button>
  `, ()=>{
    document.getElementById('standard-produce-btn').addEventListener('click', ()=>{
      activeStandardSession.pieces.push(Date.now());
      updateStandardLiveDisplay();
    });
    document.getElementById('standard-undo-btn').addEventListener('click', ()=>{
      if(activeStandardSession.pieces.length===0){ showToast('مفيش قطع لسه'); return; }
      activeStandardSession.pieces.pop();
      updateStandardLiveDisplay();
    });
    document.getElementById('standard-cancel-btn').addEventListener('click', ()=>{
      confirmAction('إلغاء جلسة القياس؟ مش هيتحفظ أي حاجة.', ()=>{
        clearInterval(liveTimerInterval);
        activeStandardSession = null;
        closeModal();
      });
    });
    document.getElementById('standard-finish-btn').addEventListener('click', finishStandardMeasurement);
    startStandardLiveTimer();
  });
}

function startStandardLiveTimer(){
  clearInterval(liveTimerInterval);
  updateStandardLiveDisplay();
  liveTimerInterval = setInterval(updateStandardLiveDisplay, 1000);
}

function updateStandardLiveDisplay(){
  if(!activeStandardSession){ clearInterval(liveTimerInterval); return; }
  const elapsedSec = (Date.now() - activeStandardSession.startTime)/1000;
  const countEl = document.getElementById('standard-piece-count');
  const clockEl = document.getElementById('standard-elapsed-clock');
  const rateEl = document.getElementById('standard-rate-display');
  if(countEl) countEl.textContent = activeStandardSession.pieces.length;
  if(clockEl) clockEl.textContent = formatTime(elapsedSec);
  if(rateEl){
    const n = activeStandardSession.pieces.length;
    if(n === 0){
      rateEl.textContent = 'هتظهر السرعة بعد أول قطعة';
    } else {
      const avgSecPerPiece = elapsedSec / n;
      rateEl.textContent = `متوسط ${avgSecPerPiece.toFixed(1)} ث/قطعة`;
    }
  }
}

function finishStandardMeasurement(){
  const n = activeStandardSession.pieces.length;
  if(n === 0){
    showToast('⚠️ لازم تسجل قطعة واحدة على الأقل قبل الاعتماد');
    return;
  }
  const totalSeconds = Math.round((Date.now() - activeStandardSession.startTime)/1000);
  const secPerPiece = totalSeconds / n;

  confirmAction(`اعتماد المعيار: ${secPerPiece.toFixed(1)} ثانية/قطعة (من ${n} قطعة في ${formatTime(totalSeconds)})؟`, ()=>{
    const ctx = getCurrentWorker();
    if(ctx && ctx.worker){
      ctx.worker.standard = {
        pieceCount: n,
        totalSeconds,
        secPerPiece,
        recordedAt: Date.now()
      };
      saveData();
      showToast('✅ تم اعتماد المعيار');
    }
    clearInterval(liveTimerInterval);
    activeStandardSession = null;
    closeModal();
    renderModelsPage();
  });
}

// ============ صفحة التقارير ============
function renderReportsPage(){
  const el = document.getElementById('page-reports');

  // نجمّع كل (عامل + موديل + مرحلة) اللي عنده معيار أو سجل إنتاج
  const rows = [];
  DB.models.forEach(model=>{
    model.stages.map(migrateStage).forEach(stage=>{
      stage.workers.forEach(w=>{
        const totalProduced = (w.dailyLogs||[]).reduce((a,l)=>a+l.quantity,0);
        if(!w.standard && totalProduced===0) return; // مفيش حاجة تتعرض
        rows.push({ modelName: model.name, stageName: stage.name, unitsPerPiece: stage.unitsPerPiece, employeeId: w.employeeId, standard: w.standard, dailyLogs: w.dailyLogs||[], totalProduced });
      });
    });
  });

  if(rows.length === 0){
    el.innerHTML = `<div class="card"><div class="empty">لسه مفيش بيانات كفاية. سجل معيار أو إنتاج يومي لعامل من صفحة الموديلات.</div></div>`;
    return;
  }

  const totalStandards = rows.filter(r=>r.standard).length;
  const totalDailyEntries = rows.reduce((a,r)=>a+r.dailyLogs.length,0);

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="v">${totalStandards}</div><div class="l">معيار معتمد</div></div>
      <div class="stat-card"><div class="v">${totalDailyEntries}</div><div class="l">يوم إنتاج مسجل</div></div>
    </div>
    <div class="card">
      <h3>⚖️ مقارنة الأداء اليومي بالمعيار</h3>
      <div id="performance-list"></div>
    </div>
  `;

  const listEl = document.getElementById('performance-list');
  listEl.innerHTML = rows.map(r=>{
    const empN = escapeHtml(empName(r.employeeId));
    if(!r.standard){
      return `<div class="list-item" style="cursor:default;">
        <div class="info">
          <div class="name">${empN} — ${escapeHtml(r.stageName)} <span class="sub">(${escapeHtml(r.modelName)})</span></div>
          <div class="sub"><span class="badge gray">لسه مفيش معيار</span> — إجمالي الإنتاج: ${r.totalProduced} وحدة</div>
        </div>
      </div>`;
    }

    // متوسط الإنتاج اليومي كنسبة من المعيار
    const expectedPerDay = null; // مفيش ساعات عمل معروفة، فهنقارن آخر يوم بس بمعدل المعيار كمرجع نظري
    const lastLog = [...r.dailyLogs].sort((a,b)=>b.date.localeCompare(a.date))[0];
    let perfHtml = '';
    if(lastLog){
      // نحسب: لو العامل شغال 8 ساعات (28800 ثانية) بمعدل المعيار، هينتج كام؟ ونقارن بالفعلي
      const theoreticalMax8h = 28800 / r.standard.secPerPiece;
      const pct = Math.min((lastLog.quantity/theoreticalMax8h)*100, 150);
      const barColor = pct>=85 ? 'var(--green)' : pct>=60 ? 'var(--amber)' : 'var(--red)';
      perfHtml = `
        <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">
          آخر يوم (${formatDateArabic(lastLog.date)}): ${lastLog.quantity} وحدة — نظرياً بمعدل المعيار في 8 ساعات: ${theoreticalMax8h.toFixed(0)} وحدة (${pct.toFixed(0)}%)
        </div>
        <div class="performance-bar"><div class="fill" style="width:${Math.min(pct,100)}%; background:${barColor};"></div></div>
      `;
    }

    return `<div class="list-item" style="cursor:default; align-items:flex-start; flex-direction:column;">
      <div class="info" style="width:100%;">
        <div class="name">${empN} — ${escapeHtml(r.stageName)} <span class="sub">(${escapeHtml(r.modelName)})</span></div>
        <div class="sub"><span class="badge purple">المعيار: ${r.standard.secPerPiece.toFixed(1)} ث/قطعة</span> — إجمالي الإنتاج: ${r.totalProduced} وحدة</div>
        ${perfHtml}
      </div>
    </div>`;
  }).join('');
}
