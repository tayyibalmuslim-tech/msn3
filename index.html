<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الموديلات والمخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* لوحة ألوان مستوحاة من النيلة والقماش الخام */
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --ink:#161A20;
  --ink-soft:#5C6672;
  --ink-faint:#8B95A1;
  --line:#E4E8ED;
  --line-strong:#CFD6DE;

  --indigo:#2B3E8C;
  --indigo-dark:#1E2C66;
  --indigo-soft:#EEF1FA;
  --indigo-tint:rgba(43,62,140,.08);

  --ok:#0E7A57;
  --ok-soft:#E6F4EF;
  --warn:#C0392B;
  --warn-soft:#FBECEA;
  --amber:#B4740E;
  --amber-soft:#FDF3E2;

  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(22,26,32,.05);
  --shadow:0 2px 8px rgba(22,26,32,.06);
  --shadow-lg:0 12px 32px rgba(22,26,32,.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', -apple-system, 'Segoe UI', sans-serif;
  font-size:15px;
  line-height:1.65;
  min-height:100vh;
  padding-bottom:90px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1180px; margin:0 auto; padding:0 20px 24px;}

/* ===== الهيدر ===== */
header.top{
  display:flex; justify-content:space-between; align-items:center;
  padding:22px 26px; margin-bottom:22px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  flex-wrap:wrap; gap:18px;
}
header.top .brand{display:flex; align-items:center; gap:14px;}
header.top .tag{
  width:44px; height:44px; border-radius:12px;
  background:var(--indigo);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:20px; color:#fff;
  flex-shrink:0;
}
header.top h1{font-size:19px; font-weight:700; letter-spacing:-.2px; line-height:1.35;}
header.top .sub{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
header.top .stats{display:flex; gap:10px; flex-wrap:wrap;}
header.top .stats > div{
  text-align:center; background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px 18px; min-width:104px;
}
header.top .stats .num{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:20px; font-weight:600; color:var(--indigo); line-height:1.3;
}
header.top .stats .lbl{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}

/* ===== التبويبات ===== */
nav.tabs{
  display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;
}
nav.tabs button, .tab-btn{
  padding:11px 20px; min-height:44px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:999px;
  color:var(--ink-soft); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .16s ease; font-family:inherit;
  display:inline-flex; align-items:center; gap:7px;
}
nav.tabs button:hover, .tab-btn:hover{border-color:var(--line-strong); color:var(--ink);}
nav.tabs button.active, .tab-btn.active{
  background:var(--indigo); border-color:var(--indigo); color:#fff;
  box-shadow:0 2px 8px rgba(43,62,140,.24);
}
nav.tabs button .count, .tab-btn .count{
  display:inline-block; background:var(--indigo-tint); color:var(--indigo);
  border-radius:999px; padding:1px 9px; font-size:12px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
nav.tabs button.active .count, .tab-btn.active .count{background:rgba(255,255,255,.22); color:#fff;}

section.view{display:none;}
section.view.active{display:block; animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
}

/* ===== البطاقات ===== */
.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px 28px; margin-bottom:18px; box-shadow:var(--shadow-sm);
}
.panel h2{
  font-size:17px; font-weight:700; margin-bottom:20px; color:var(--ink);
  display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;
  padding-bottom:14px; border-bottom:1px solid var(--line);
}
.panel h2 .title-txt{display:flex; align-items:center; gap:9px;}

/* ===== الحقول ===== */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px;}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:2px;}
.field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
.field input, .field select{
  padding:11px 14px; min-height:44px;
  border:1.5px solid var(--line-strong); border-radius:var(--radius-sm);
  font-size:15px; background:var(--surface); color:var(--ink);
  font-family:inherit; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--indigo);
  box-shadow:0 0 0 3px var(--indigo-tint);
}
.field input::placeholder{color:var(--ink-faint);}
.field .hint, .hint{font-size:12.5px; color:var(--ink-faint); line-height:1.6;}

/* ===== الأزرار ===== */
button.btn{
  padding:11px 22px; min-height:44px; border:none; border-radius:var(--radius-sm);
  background:var(--indigo); color:#fff; font-size:14.5px; font-weight:600;
  cursor:pointer; transition:background .15s, transform .1s; font-family:inherit;
}
button.btn:hover{background:var(--indigo-dark);}
button.btn:active{transform:scale(.98);}
button.btn:focus-visible{outline:3px solid var(--indigo-tint); outline-offset:2px;}
button.btn.brass{background:var(--indigo);}
button.btn.brass:hover{background:var(--indigo-dark);}
button.btn.ghost{background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong);}
button.btn.ghost:hover{border-color:var(--indigo); color:var(--indigo); background:var(--indigo-soft);}
button.btn.danger{background:var(--warn);}
button.btn.danger:hover{background:#A32E22;}
button.btn.small{padding:8px 16px; min-height:38px; font-size:13.5px;}
button.btn.full{width:100%;}

/* ===== صفوف الموظفين والمراحل ===== */
.emp-row, .stage-row{
  display:grid; gap:14px; align-items:end; margin-bottom:14px;
  padding:18px; background:var(--surface-2);
  border-radius:var(--radius-sm); border:1px solid var(--line);
}
.emp-row{grid-template-columns:1.4fr 1fr 1fr auto;}
.emp-split-wrap{grid-column:1/-1;}

.color-card{
  padding:18px; background:var(--surface-2); border-radius:var(--radius-sm);
  border:1px solid var(--line); margin-bottom:14px;
}
.color-card .color-top{display:grid; grid-template-columns:1fr 110px auto; gap:12px; align-items:end; margin-bottom:14px;}
.size-row{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
.size-row select, .size-row input{
  padding:10px 12px; min-height:42px; border:1.5px solid var(--line-strong);
  border-radius:9px; font-size:14px; font-family:inherit; background:var(--surface);
}
.color-card .size-total{font-size:12.5px; color:var(--ink-faint); margin-top:6px;}
.swatch{
  width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-strong);
  display:inline-block; vertical-align:middle; margin-inline-end:7px;
}

/* ===== بطاقات الموديلات ===== */
.model-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:18px;}
.model-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:box-shadow .18s, transform .14s, border-color .18s;
}
.model-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px); border-color:var(--line-strong);}
.model-card .head{
  background:var(--indigo-soft); color:var(--ink); padding:18px 20px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-bottom:1px solid var(--line);
}
.model-card .head h3{font-size:16px; font-weight:700; line-height:1.4;}
.model-card .head .price{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  color:var(--indigo); font-size:14px; font-weight:600;
  background:var(--surface); padding:5px 12px; border-radius:999px;
  white-space:nowrap; border:1px solid var(--line);
}
.model-card .body{padding:18px 20px;}
.model-card .colors{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.color-chip{
  font-size:12.5px; padding:5px 12px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; gap:6px;
}
.color-chip .swatch{width:14px; height:14px; margin:0; border-radius:4px;}
.progress-track{height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin:12px 0 6px;}
.progress-fill{height:100%; background:var(--indigo); border-radius:999px; transition:width .35s ease;}
.model-card .meta{
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  font-size:13px; color:var(--ink-soft); margin-top:10px;
}
.stage-dots{display:flex; gap:5px; margin-top:14px;}
.stage-dot{flex:1; height:6px; border-radius:999px; background:var(--line);}
.stage-dot.done{background:var(--ok);}
.stage-dot.active{background:var(--indigo);}

/* ===== تفاصيل الموديل ===== */
.model-detail-header{
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:22px; flex-wrap:wrap; gap:16px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px 26px; box-shadow:var(--shadow-sm);
}
.model-detail-header h2{font-size:23px; font-weight:700; color:var(--ink); line-height:1.4;}
.model-detail-header .price-tag{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  background:var(--indigo); color:#fff;
  padding:9px 18px; border-radius:999px; font-size:15px; font-weight:600;
  white-space:nowrap;
}
.back-btn{
  display:inline-flex; align-items:center; gap:7px; min-height:40px;
  color:var(--ink-soft); font-size:14px; cursor:pointer; margin-bottom:14px; font-weight:600;
  transition:color .15s;
}
.back-btn:hover{color:var(--indigo);}

.stage-tabs{display:flex; gap:8px; overflow-x:auto; margin-bottom:20px; padding-bottom:6px;}
.stage-tab{
  padding:10px 18px; min-height:42px; white-space:nowrap;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  display:inline-flex; align-items:center; transition:all .15s;
}
.stage-tab:hover{border-color:var(--line-strong); color:var(--ink);}
.stage-tab.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.stage-tab.done-marker::after{content:' ✓'; color:var(--ok); margin-inline-start:5px;}
.stage-tab.active.done-marker::after{color:#9EE7C8;}

/* ===== الجداول ===== */
table.data-table{width:100%; border-collapse:collapse; font-size:14px;}
table.data-table th{
  text-align:right; padding:13px 14px; background:var(--surface-2);
  color:var(--ink-soft); font-size:12.5px; font-weight:700;
  border-bottom:1.5px solid var(--line-strong);
}
table.data-table td{padding:13px 14px; border-bottom:1px solid var(--line);}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr:hover{background:var(--indigo-soft);}
table.data-table tfoot td{font-weight:700; background:var(--surface-2); border-top:2px solid var(--line-strong);}

.empty-state{text-align:center; padding:56px 24px; color:var(--ink-faint);}
.empty-state .icon{font-size:42px; margin-bottom:14px; opacity:.75;}
.empty-state p{font-size:14.5px;}

.badge{
  display:inline-block; padding:3px 11px; border-radius:999px;
  font-size:12px; font-weight:600; white-space:nowrap;
}
.badge.ok{background:var(--ok-soft); color:var(--ok);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.badge.pending{background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line);}
.badge.internal{background:var(--indigo-soft); color:var(--indigo);}
.badge.external{background:var(--amber-soft); color:var(--amber);}

/* ===== ملخص التكلفة ===== */
.cost-summary{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-top:6px;}
.cost-item{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:18px 16px; text-align:center;
}
.cost-item .lbl{font-size:12.5px; color:var(--ink-faint); margin-bottom:8px;}
.cost-item .val{
  font-size:22px; font-weight:600; color:var(--ink);
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.cost-item.profit{background:var(--ok-soft); border-color:#C9E5DA;}
.cost-item.profit .val{color:var(--ok);}
.cost-item.profit.negative{background:var(--warn-soft); border-color:#F2D5D1;}
.cost-item.profit.negative .val{color:var(--warn);}

.cost-breakdown{margin-top:6px;}
.cost-breakdown .line{
  display:flex; justify-content:space-between; gap:12px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;
}
.cost-breakdown .line span:last-child{
  font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cost-breakdown .line.total{
  font-weight:700; font-size:15.5px; border-bottom:none;
  border-top:2px solid var(--line-strong); margin-top:6px; padding-top:14px;
}

/* ===== النوافذ المنبثقة ===== */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(22,26,32,.5);
  z-index:100; align-items:center; justify-content:center; padding:20px; overflow-y:auto;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--bg); border-radius:18px; max-width:660px; width:100%;
  max-height:88vh; overflow-y:auto; padding:28px; box-shadow:var(--shadow-lg);
}
.modal h3{font-size:19px; font-weight:700; margin-bottom:20px; color:var(--ink);}
.modal-close{
  float:left; background:var(--surface); border:1px solid var(--line);
  width:36px; height:36px; border-radius:50%;
  font-size:17px; cursor:pointer; color:var(--ink-soft); line-height:1;
}
.modal-close:hover{background:var(--warn-soft); color:var(--warn); border-color:#F2D5D1;}

.edit-modal-overlay{
  position:fixed; inset:0; background:rgba(22,26,32,.5);
  display:none; align-items:center; justify-content:center;
  z-index:200; padding:16px; backdrop-filter:blur(2px);
}
.modal-box{
  background:var(--surface); border-radius:18px; padding:26px;
  width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
  box-shadow:var(--shadow-lg);
}

/* ===== الزرار العائم والتنبيهات ===== */
.fab{
  position:fixed; bottom:26px; left:26px; z-index:50;
  width:60px; height:60px; border-radius:50%;
  background:var(--indigo); color:#fff; border:none;
  font-size:28px; cursor:pointer; box-shadow:0 8px 22px rgba(43,62,140,.36);
  display:flex; align-items:center; justify-content:center;
  transition:transform .16s, background .16s;
}
.fab:hover{background:var(--indigo-dark); transform:scale(1.07);}

.toast{
  position:fixed; bottom:26px; right:26px; z-index:300;
  background:var(--ink); color:#fff; padding:14px 22px; border-radius:var(--radius-sm);
  font-size:14px; font-weight:500; box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(12px); transition:all .25s; pointer-events:none;
  max-width:calc(100vw - 52px);
}
.toast.show{opacity:1; transform:translateY(0);}

.row-actions{display:flex; gap:8px;}
.icon-btn{
  background:transparent; border:1px solid transparent; cursor:pointer;
  font-size:16px; padding:8px 10px; border-radius:9px;
  min-width:38px; min-height:38px; transition:background .14s, border-color .14s;
}
.icon-btn:hover{background:var(--surface-2); border-color:var(--line);}

.section-divider{
  display:flex; align-items:center; gap:12px; margin:26px 0 16px;
  font-size:12.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.3px;
}
.section-divider::after{content:''; flex:1; height:1px; background:var(--line);}

.rate-card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px 20px; display:flex; justify-content:space-between; align-items:center;
  gap:14px; margin-bottom:12px; flex-wrap:wrap;
}
.rate-card .dept-name{font-weight:700; font-size:15px;}
.rate-card .dept-pct{font-size:12.5px; color:var(--ink-faint); margin-top:3px; line-height:1.6;}
.rate-card .rate-val{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:21px; font-weight:600; color:var(--indigo);
}
.rate-card .rate-lbl{font-size:11.5px; color:var(--ink-faint);}

.dept-stage-box{
  border:1.5px solid var(--line); border-radius:var(--radius-sm);
  padding:16px; background:var(--surface);
}
.dept-stage-box.internal{border-color:#C3CCEA;}
.dept-stage-box.external{border-color:#E8D3AE;}

/* ===== شاشة الدخول ===== */
#loginScreen{
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;
}
#loginScreen.hidden{display:none;}
.login-box{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:36px 32px; width:100%; max-width:400px; box-shadow:var(--shadow);
}
.login-box h2{font-size:22px; font-weight:700; margin-bottom:6px; color:var(--ink);}
.login-box .sub{font-size:13.5px; color:var(--ink-faint); margin-bottom:26px;}
.login-box .field{margin-bottom:16px;}
.login-box .err{color:var(--warn); font-size:13px; margin-top:12px; min-height:18px;}
#appRoot.hidden{display:none;}

/* ===== شريط المستخدم ===== */
.user-bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:12px 4px 16px; font-size:13.5px; color:var(--ink-soft);
}
.user-bar button{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:999px;
  padding:8px 18px; min-height:40px; font-size:13.5px; font-weight:600;
  cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:all .15s;
}
.user-bar button:hover{border-color:var(--warn); color:var(--warn); background:var(--warn-soft);}

.locked-msg{
  padding:36px 24px; text-align:center; color:var(--ink-faint); font-size:14.5px;
  background:var(--surface); border:1.5px dashed var(--line-strong);
  border-radius:var(--radius); margin:14px 0;
}
.perm-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14.5px;
}
.perm-row:last-child{border-bottom:none;}
.perm-row select{
  width:170px; padding:9px 12px; min-height:42px;
  border:1.5px solid var(--line-strong); border-radius:9px;
  font-family:inherit; font-size:14px; background:var(--surface); color:var(--ink);
}
.perm-row select:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px var(--indigo-tint);}

/* ===== الحضور والانصراف ===== */
.attendance-days-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px;
}
.attendance-day-btn{
  flex:0 0 auto; min-width:60px; min-height:58px; padding:10px 8px;
  border-radius:var(--radius-sm); border:1.5px solid var(--line);
  background:var(--surface); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:15px; font-weight:600; color:var(--ink-soft); transition:all .14s;
}
.attendance-day-btn:hover{border-color:var(--line-strong); color:var(--ink);}
.attendance-day-btn.active{
  border-color:var(--indigo); background:var(--indigo); color:#fff;
  box-shadow:0 2px 8px rgba(43,62,140,.26);
}
.attendance-day-btn .d-num{font-size:16px; line-height:1.2;}
.attendance-day-btn .d-mark{font-size:10px; white-space:nowrap; font-family:inherit;}

const firebaseConfig = {

  messagingSenderId: "516912892836",
  appId: "1:516912892836:web:6d09062dfb556f4178cf31",
};

const fbApp = initializeApp(firebaseConfig);

const db = getFirestore(fbApp);

/* كل صلاحيات التطبيق الممكنة، وكل قسم ليه view/edit */
const PERMISSION_SECTIONS = [
  {key:'models',  label:'الموديلات'},

];

/* الوثيقة الوحيدة المشتركة اللي فيها بيانات المصنع كلها */
const FACTORY_DOC_REF = () => doc(db, 'factory_data', 'main');

window._auth = auth;
window._db = db;
window._fsdoc = doc; window._fsget = getDoc; window._fsset = setDoc;
window._fscol = collection; window._fsgetdocs = getDocs;

window._PERMISSION_SECTIONS = PERMISSION_SECTIONS;

async function ensureUserDoc(user){
  const uref = doc(db, 'users', user.uid);
  const snap = await getDoc(uref);
  if(!snap.exists()){

  return snap.data();

<script>
/* ============================================================
   الحالة والتخزين
============================================================ */
const STORAGE_KEY = 'factory_tracker_v2';
let state = {
  models: [],
  dayLogs: [],   // {id, date:'YYYY-MM-DD', dept, modelId, qty, hours, revenue, note}
  schedule: [],  // {id, modelId, dept, date, hours, note}
  factory: {
    rent: 0,
    electricity: 0,
    workHoursPerDay: 9,
    workDaysPerMonth: 26,
    deptCapacity: {}, // تخصيص طاقة يومية لقسم معين (اختياري)
    employees: [] // {id, name, dept, salary}
  },
  attendance: {} // { "YYYY-MM": { "YYYY-MM-DD": { empId: {status:'present'|'absent', checkIn, checkOut} } } }
};

function migrateState(){
  if(!state.factory) state.factory = {rent:0, electricity:0, workHoursPerDay:9, workDaysPerMonth:26, employees:[]};
  if(!state.factory.employees) state.factory.employees = [];
  if(!state.factory.deptCapacity) state.factory.deptCapacity = {};
  if(!Array.isArray(state.dayLogs)) state.dayLogs = [];
  if(!Array.isArray(state.schedule)) state.schedule = [];
  if(!Array.isArray(state.models)) state.models = [];
  if(!state.attendance) state.attendance = {};
  state.models.forEach(m=>{ if(!m.sewingOps) m.sewingOps = []; });
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
    migrateState();
  }catch(e){ console.error('فشل تحميل البيانات', e); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  syncStateToCloud();
}

/* مزامنة سحابية مع تأخير بسيط عشان منبعتش كل حرف بيتكتب */
let _syncTimer = null;
function syncStateToCloud(){
  if(!window.currentUser) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async ()=>{
    try{
      await window._fsset(window._FACTORY_DOC_REF(), {
        data: JSON.stringify(state),
        updatedAt: Date.now(),
        updatedBy: window.currentUser.email
      });
    }catch(e){ console.error('فشلت المزامنة السحابية', e); }
  }, 600);
}

async function loadStateFromCloud(){
  try{
    const snap = await window._fsget(window._FACTORY_DOC_REF());
    if(snap.exists() && snap.data().data){
      state = JSON.parse(snap.data().data);
      migrateState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  }catch(e){
    console.error('فشل تحميل البيانات من السحابة، هنشتغل بالنسخة المحلية', e);
  }
}

/* هل عندي صلاحية على قسم معيّن؟ level = 'view' أو 'edit' */
function hasPerm(sectionKey, level){
  const perms = window.currentPermissions || {};
  const val = perms[sectionKey] || 'none';
  if(level==='view') return val==='view' || val==='edit';
  if(level==='edit') return val==='edit';
  return false;
}
function requireEdit(sectionKey, actionLabel){
  if(!hasPerm(sectionKey, 'edit')){
    toast(`🚫 مفيش صلاحية تعديل على "${actionLabel||sectionKey}"`);
    return false;
  }
  return true;
}
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   ثوابت الأقسام
   3 أقسام داخلية بنسب من (إيجار+كهرباء)، زائد أقسام خارجية بتكلفة يدوية
============================================================ */
const SIZES = ['S','M','L','XL','2XL','3XL','4XL','5XL'];

const INTERNAL_DEPTS = [
  {key:'cutting',  label:'المقص',            pct:0.35},
  {key:'sewing',   label:'الخياطة',          pct:0.40},
  {key:'ambag',    label:'امباج (تشطيب+مكوة+تكيس)', pct:0.25},
];
const SUPERVISION_DEPT = {key:'supervision', label:'إشراف'};
const EXTERNAL_STAGES = [
  {key:'tatreez', label:'تطريز/طباعة'},
  {key:'buttons', label:'أزرار'},
];
const ALL_STAGES = [...INTERNAL_DEPTS.map(d=>({key:d.key,label:d.label,internal:true})), ...EXTERNAL_STAGES.map(s=>({key:s.key,label:s.label,internal:false}))];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmt(n){ n = Number(n)||0; return n.toLocaleString('ar-EG', {maximumFractionDigits:2}); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

/* ============================================================
   حساب تكلفة الساعة لكل قسم داخلي
============================================================ */
function getMonthlyHoursFor(factoryCtx){
  const h = Number(factoryCtx.workHoursPerDay)||9;
  const d = Number(factoryCtx.workDaysPerMonth)||26;
  return h*d;
}
function getMonthlyHours(){ return getMonthlyHoursFor(state.factory); }

/* نصيب قسم معيّن من مرتبات موظفي الإشراف، حسب النسبة المخصصة لكل موظف */
function getSupervisionShareForDeptFor(deptKey, factoryCtx){
  return (factoryCtx.employees||[])
    .filter(e=>e.dept===SUPERVISION_DEPT.key)
    .reduce((s,e)=>{
      const pct = Number(e.splits?.[deptKey])||0;
      return s + (Number(e.salary)||0) * pct;
    }, 0);
}
function getSupervisionShareForDept(deptKey){ return getSupervisionShareForDeptFor(deptKey, state.factory); }

function getDeptHourlyRateFor(deptKey, factoryCtx){
  const dept = INTERNAL_DEPTS.find(d=>d.key===deptKey);
  if(!dept) return 0;
  const fixedShare = ((Number(factoryCtx.rent)||0) + (Number(factoryCtx.electricity)||0)) * dept.pct;
  const directSalaries = (factoryCtx.employees||[])
    .filter(e=>e.dept===deptKey)
    .reduce((s,e)=>s+(Number(e.salary)||0), 0);
  const supervisionShare = getSupervisionShareForDeptFor(deptKey, factoryCtx);
  const monthlyHours = getMonthlyHoursFor(factoryCtx);
  if(monthlyHours<=0) return 0;
  return (fixedShare + directSalaries + supervisionShare) / monthlyHours;
}
function getDeptHourlyRate(deptKey){ return getDeptHourlyRateFor(deptKey, state.factory); }

function getDeptMonthlyCostFor(deptKey, factoryCtx){
  const dept = INTERNAL_DEPTS.find(d=>d.key===deptKey);
  if(!dept) return {fixedShare:0, salariesShare:0, supervisionShare:0, total:0};
  const fixedShare = ((Number(factoryCtx.rent)||0) + (Number(factoryCtx.electricity)||0)) * dept.pct;
  const directSalaries = (factoryCtx.employees||[])
    .filter(e=>e.dept===deptKey)
    .reduce((s,e)=>s+(Number(e.salary)||0), 0);
  const supervisionShare = getSupervisionShareForDeptFor(deptKey, factoryCtx);
  return {fixedShare, salariesShare:directSalaries, supervisionShare, total:fixedShare+directSalaries+supervisionShare};
}
function getDeptMonthlyCost(deptKey){ return getDeptMonthlyCostFor(deptKey, state.factory); }

function getFactoryContextFor(m){
  if(m && m.status==='closed' && m.closedSnapshot) return m.closedSnapshot;
  return state.factory;
}

/* ============================================================
   حساب التكلفة والربح لكل موديل
   لكل مرحلة مخططة في الموديل:
     - لو داخلية: التكلفة المتوقعة = الوقت المتوقع (ساعة) × تكلفة ساعة القسم (بتُحسب من الإعدادات الحالية)
     - لو خارجية: التكلفة المتوقعة = اللي كتبها المستخدم يدوي
   لو فيه سجلات فعلية للمرحلة (stageLogs) بتحل محل التقدير في حساب التكلفة الكلية.
============================================================ */
function calcModelCost(m){
  const cutQty = getTotalCutQty(m);
  const baseUnit = cutQty > 0 ? cutQty : (m.expectedTotal || 0);

  let totalCost = 0;
  let stageDetails = [];

  (m.stagesPlanned||[]).forEach(sp=>{
    const isInternal = INTERNAL_DEPTS.some(d=>d.key===sp.key);
    const logs = (m.stageLogs && m.stageLogs[sp.key]) || [];
    const hasLogs = logs.length>0;
    const actualSum = logs.reduce((s,l)=>s+(Number(l.cost)||0),0);
    const actualTimeSum = logs.reduce((s,l)=>s+(Number(l.time)||0),0);

    let plannedCost = 0;
    let hourlyRate = null;
    if(isInternal){
      hourlyRate = getDeptHourlyRate(sp.key);
      plannedCost = hourlyRate * (Number(sp.expectedTime)||0);
    } else {
      plannedCost = Number(sp.expectedCost)||0;
    }

    const usedCost = hasLogs ? actualSum : plannedCost;
    totalCost += usedCost;

    stageDetails.push({
      key:sp.key, label:sp.label, internal:isInternal,
      expectedTime:sp.expectedTime, hourlyRate,
      plannedCost, actualCost:actualSum, actualTime:actualTimeSum,
      hasLogs, usedCost
    });
  });

  const revenue = (m.expectedTotal||0) * (Number(m.sellPrice)||0);
  const profit = revenue - totalCost;
  const costPerUnit = baseUnit > 0 ? totalCost/baseUnit : 0;
  const profitPerUnit = (Number(m.sellPrice)||0) - costPerUnit;

  return { revenue, totalCost, profit, costPerUnit, profitPerUnit, stageDetails };
}

/* ============================================================
   محرك اليوم والشهر: الإنتاج، الهدر، المكسب والخسارة لكل قسم
============================================================ */
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_WEEK = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

function ymd(y, mIdx, d){
  return `${y}-${String(mIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getDeptDailyCapacity(deptKey){
  const custom = Number((state.factory.deptCapacity||{})[deptKey]);
  if(custom > 0) return custom;
  return Number(state.factory.workHoursPerDay) || 9;
}

function isWorkDay(dateStr){
  return (state.dayLogs||[]).some(l => l.date === dateStr);
}

function getDayDeptStats(dateStr, deptKey){
  const logs = (state.dayLogs||[]).filter(l => l.date===dateStr && l.dept===deptKey);
  const active = isWorkDay(dateStr);
  const capacity = active ? getDeptDailyCapacity(deptKey) : 0;
  const rate = getDeptHourlyRate(deptKey);
  const workedHours = logs.reduce((s,l)=>s+(Number(l.hours)||0), 0);
  const revenue = logs.reduce((s,l)=>s+(Number(l.revenue)||0), 0);
  const qty = logs.reduce((s,l)=>s+(Number(l.qty)||0), 0);
  const idleHours = Math.max(0, capacity - workedHours);
  const overHours = Math.max(0, workedHours - capacity);
  const billedHours = active ? Math.max(capacity, workedHours) : 0;
  const cost = billedHours * rate;
  const idleCost = idleHours * rate;
  return {
    date:dateStr, dept:deptKey, logs, active, capacity, rate,
    workedHours, idleHours, overHours, billedHours,
    cost, idleCost, revenue, qty,
    profit: revenue - cost,
    utilization: capacity>0 ? (workedHours/capacity*100) : 0
  };
}

function getDayStats(dateStr, deptKey){
  if(deptKey && deptKey !== 'all') return getDayDeptStats(dateStr, deptKey);
  const parts = INTERNAL_DEPTS.map(d => getDayDeptStats(dateStr, d.key));
  const sum = k => parts.reduce((s,p)=>s+p[k], 0);
  const capacity = sum('capacity');
  return {
    date:dateStr, dept:'all', parts, logs: parts.flatMap(p=>p.logs),
    active: isWorkDay(dateStr), capacity, rate:null,
    workedHours: sum('workedHours'), idleHours: sum('idleHours'), overHours: sum('overHours'),
    billedHours: sum('billedHours'), cost: sum('cost'), idleCost: sum('idleCost'),
    revenue: sum('revenue'), qty: sum('qty'), profit: sum('revenue') - sum('cost'),
    utilization: capacity>0 ? (sum('workedHours')/capacity*100) : 0
  };
}

function getMonthStats(y, mIdx, deptKey){
  const days = new Date(y, mIdx+1, 0).getDate();
  const list = [];
  for(let d=1; d<=days; d++) list.push(getDayStats(ymd(y,mIdx,d), deptKey));
  const sum = k => list.reduce((s,p)=>s+(p[k]||0), 0);
  const workedDays = list.filter(p=>p.active).length;
  const capacity = sum('capacity');
  return {
    days, list, workedDays,
    capacity, workedHours: sum('workedHours'), idleHours: sum('idleHours'),
    cost: sum('cost'), idleCost: sum('idleCost'), revenue: sum('revenue'),
    qty: sum('qty'), profit: sum('revenue') - sum('cost'),
    utilization: capacity>0 ? (sum('workedHours')/capacity*100) : 0
  };
}

function getSchedFor(dateStr, deptKey){
  return (state.schedule||[]).filter(sc =>
    sc.date === dateStr && (!deptKey || deptKey==='all' || sc.dept===deptKey));
}

function modelName(id){
  const m = state.models.find(x=>x.id===id);
  return m ? m.name : '(موديل محذوف)';
}
function deptLabel(key){
  const d = INTERNAL_DEPTS.find(x=>x.key===key);
  return d ? d.label : key;
}

function suggestRevenue(modelId, deptKey, qty){
  const m = state.models.find(x=>x.id===modelId);
  if(!m || !qty) return 0;
  const planned = m.stagesPlanned || [];
  if(planned.length === 0) return 0;
  const costs = planned.map(sp=>{
    if(INTERNAL_DEPTS.some(d=>d.key===sp.key)) return getDeptHourlyRate(sp.key) * (Number(sp.expectedTime)||0);
    return Number(sp.expectedCost)||0;
  });
  const total = costs.reduce((a,b)=>a+b, 0);
  const idx = planned.findIndex(sp=>sp.key===deptKey);
  if(idx < 0 || total <= 0) return 0;
  const shareRatio = costs[idx] / total;
  return (Number(m.sellPrice)||0) * qty * shareRatio;
}

function formatDateArabic(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const weekday = AR_WEEK[(dt.getDay()+1)%7];
  return `${weekday} ${d} ${AR_MONTHS[m-1]} ${y}`;
}

/* ============================================================
   مربعات حوار مخصصة (تأكيد / إدخال نص) بدل confirm()/prompt() القياسية
============================================================ */
let _dialogResolve = null;
function _closeDialog(val){
  document.getElementById('dialogOverlay').classList.remove('active');
  document.getElementById('dialogOverlay').style.display = 'none';
  if(_dialogResolve) _dialogResolve(val);
  _dialogResolve = null;
}
function confirmDialog(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    _dialogResolve = resolve;
    document.getElementById('dialogOverlay').innerHTML = `
      <div class="modal-box" style="max-width:380px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(opts.title||'تأكيد')}</h3>
        <p style="font-size:14px; color:var(--ink-soft); margin-bottom:20px; line-height:1.7;">${escapeHtml(message)}</p>
        <div style="display:flex; gap:8px;">
          <button class="btn ${opts.danger?'danger':'brass'}" style="flex:1;" onclick="_closeDialog(true)">${escapeHtml(opts.yes||'تأكيد')}</button>
          <button class="btn ghost" style="flex:1;" onclick="_closeDialog(false)">${escapeHtml(opts.no||'إلغاء')}</button>
        </div>
      </div>
    `;
    document.getElementById('dialogOverlay').style.display = 'flex';
  });
}
function promptDialog(message, defaultValue, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    _dialogResolve = resolve;
    document.getElementById('dialogOverlay').innerHTML = `
      <div class="modal-box" style="max-width:380px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(opts.title||'إدخال')}</h3>
        <p style="font-size:14px; color:var(--ink-soft); margin-bottom:12px;">${escapeHtml(message)}</p>
        <input type="text" id="dialogPromptInput" value="${escapeHtml(defaultValue||'')}" style="width:100%; padding:11px 14px; min-height:44px; border:1.5px solid var(--line-strong); border-radius:10px; font-family:inherit; font-size:15px; margin-bottom:16px;">
        <div style="display:flex; gap:8px;">
          <button class="btn brass" style="flex:1;" onclick="_closeDialog(document.getElementById('dialogPromptInput').value)">${escapeHtml(opts.yes||'تأكيد')}</button>
          <button class="btn ghost" style="flex:1;" onclick="_closeDialog(null)">${escapeHtml(opts.no||'إلغاء')}</button>
        </div>
      </div>
    `;
    document.getElementById('dialogOverlay').style.display = 'flex';
    setTimeout(()=>{ const inp=document.getElementById('dialogPromptInput'); if(inp){ inp.focus(); inp.select(); } }, 50);
  });
}

function saveEmployees(){
  if(!requireEdit('employees','حفظ الموظفين')) return;
  const rows = document.querySelectorAll('#empRows .emp-row');
  let added = 0;
  let skippedSplit = 0;
  rows.forEach(row=>{
    const idx = row.id.split('_')[1];
    const name = document.getElementById('emp_name_'+idx).value.trim();
    const dept = document.getElementById('emp_dept_'+idx).value;
    const salary = Number(document.getElementById('emp_salary_'+idx).value)||0;
    if(!name || salary<=0) return;

    if(dept===SUPERVISION_DEPT.key){
      const splits = {};
      let sum = 0;
      INTERNAL_DEPTS.forEach(d=>{
        const v = (Number(document.getElementById(`emp_split_${d.key}_${idx}`).value)||0)/100;
        splits[d.key] = v;
        sum += v;
      });
      if(Math.round(sum*100)!==100){ skippedSplit++; return; }
      state.factory.employees.push({id:uid(), name, dept, salary, splits});
      added++;
    } else {
      state.factory.employees.push({id:uid(), name, dept, salary});
      added++;
    }
  });
  if(skippedSplit>0){ toast(`⚠️ ${skippedSplit} موظف إشراف اتخطى — النسب لازم تجمع 100%`); if(added===0) return; }
  if(added===0){ toast('مفيش موظفين جدد لإضافتهم'); return; }
  saveState();
  renderSettingsView();
  toast(`تم إضافة ${added} موظف ✓`);
}

function deleteEmployee(empId){
  if(!requireEdit('employees','حذف موظف')) return;
  if(!confirm('متأكد من حذف الموظف؟')) return;
  state.factory.employees = state.factory.employees.filter(e=>e.id!==empId);
  saveState();
  renderSettingsView();
  toast('تم الحذف');
}

  const hintEl = document.getElementById('edit_emp_split_sum');

function saveEditedEmployee(){
  if(!requireEdit('employees','تعديل موظف')) return;
  const id = document.getElementById('edit_emp_id').value;
  const emp = state.factory.employees.find(e=>e.id===id);
  if(!emp) return;

  const name = document.getElementById('edit_emp_name').value.trim();
  const dept = document.getElementById('edit_emp_dept').value;
  const salary = Number(document.getElementById('edit_emp_salary').value)||0;
  if(!name || salary<=0){ toast('⚠️ لازم اسم وراتب أكبر من صفر'); return; }

  emp.name = name;
  emp.dept = dept;
  emp.salary = salary;

  if(dept===SUPERVISION_DEPT.key){
    const splits = {};
    let sum = 0;
    INTERNAL_DEPTS.forEach(d=>{
      const v = (Number(document.getElementById(`edit_emp_split_${d.key}`).value)||0)/100;
      splits[d.key] = v;
      sum += v;
    });
    if(Math.round(sum*100)!==100){ toast('⚠️ نسب التوزيع لازم تجمع 100%'); return; }
    emp.splits = splits;
  } else {
    delete emp.splits;

  saveState();

function saveNewModel(){
  if(!requireEdit('models','إضافة موديل')) return;
  const name = document.getElementById('nm_name').value.trim();
  const price = Number(document.getElementById('nm_price').value);
  const expected = Number(document.getElementById('nm_expected').value);

  if(!name){ toast('اكتب اسم الموديل الأول'); return; }
  if(!price || price<=0){ toast('اكتب سعر بيع صحيح'); return; }
  if(!expected || expected<=0){ toast('اكتب العدد المتوقع'); return; }

  const colorRows = document.querySelectorAll('#colorRows .color-card');
  const colors = [];
  colorRows.forEach(card=>{
    const idx = card.id.split('_')[1];
    const cname = document.getElementById('cr_name_'+idx).value.trim();
    const chex = document.getElementById('cr_hex_'+idx).value;
    const cbolts = Number(document.getElementById('cr_bolts_'+idx).value)||0;
    if(!cname) return;

    const sizeBreakdown = [];
    const sizeRows = card.querySelectorAll(`#sizeRows_${idx} .size-row`);
    sizeRows.forEach(sRow=>{
      const select = sRow.querySelector('select');
      const qtyInput = sRow.querySelector('input[type="number"]');
      const size = select.value;
      const qty = Number(qtyInput.value)||0;
      if(qty>0) sizeBreakdown.push({size, qty});
    });

    colors.push({id:uid(), name:cname, hex:chex, expectedBolts:cbolts, receivedBolts:0, sizeBreakdown});
  });
  if(colors.length===0){ toast('ضيف لون واحد على الأقل'); return; }

  const stagesPlanned = [];
  const stageLogs = {};
  ALL_STAGES.forEach(st=>{
    const enabled = document.getElementById('stage_'+st.key+'_enabled').checked;
    if(!enabled) return;
    const time = Number(document.getElementById('stage_'+st.key+'_time').value)||0;
    const cost = st.internal ? null : (Number(document.getElementById('stage_'+st.key+'_cost').value)||0);
    stagesPlanned.push({key:st.key, label:st.label, internal:st.internal, expectedTime:time, expectedCost:cost});
    stageLogs[st.key] = [];
  });
  if(stagesPlanned.length===0){ toast('حدد مرحلة واحدة على الأقل للموديل'); return; }

  const model = {
    id: uid(), name, sellPrice:price, expectedTotal:expected,
    colors, stagesPlanned, cutParts:[], stageLogs, sewingOps:[], createdAt: Date.now()
  };
  state.models.push(model);
  saveState();
  closeModal();
  renderModelGrid();
  toast('تم إنشاء الموديل ✓');
  openModelDetail(model.id);
}

  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalContent').innerHTML = '';
}

let currentModelId = null;
let currentDetailTab = 'overview';
let currentSewingOpIndex = null;
let currentSewingWorkerId = null;

function openModelDetail(id){
  currentModelId = id;
  currentDetailTab = 'overview';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active');
  renderModelDetail();
}

function backToModels(){
  currentModelId = null;
  document.getElementById('view-detail').classList.remove('active');
  document.getElementById('view-models').classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="models"]').classList.add('active');
  renderModelGrid();
}

function getCurrentModel(){ return state.models.find(m=>m.id===currentModelId); }

function renderModelDetail(){
  const m = getCurrentModel();
  if(!m){ backToModels(); return; }

  const cost = calcModelCost(m);
  const canFinance = hasPerm('finance','view');
  const receivedTotal = m.colors.reduce((s,c)=>s+(Number(c.receivedBolts)||0),0);
  const expectedBoltsTotal = m.colors.reduce((s,c)=>s+(Number(c.expectedBolts)||0),0);

  const tabsHtml = `
    <div class="stage-tabs">
      <div class="stage-tab ${currentDetailTab==='overview'?'active':''}" onclick="switchDetailTab('overview')">نظرة عامة</div>
      <div class="stage-tab ${currentDetailTab==='receiving'?'active':''}" onclick="switchDetailTab('receiving')">استلام المخزون</div>
      <div class="stage-tab ${currentDetailTab==='cutting'?'active':''}" onclick="switchDetailTab('cutting')">بعد القص</div>
      ${(m.stagesPlanned||[]).map(sp=>{
        const hasLogs = (m.stageLogs[sp.key]||[]).length>0;
        return `<div class="stage-tab ${currentDetailTab===sp.key?'active':''} ${hasLogs?'done-marker':''}" onclick="switchDetailTab('${sp.key}')">${sp.label}</div>`;
      }).join('')}
      ${canFinance ? `<div class="stage-tab ${currentDetailTab==='cost'?'active':''}" onclick="switchDetailTab('cost')">💰 التكلفة والربح</div>` : ''}
    </div>
  `;

  let bodyHtml = '';
  if(currentDetailTab==='overview') bodyHtml = renderOverviewTab(m, cost);
  else if(currentDetailTab==='receiving') bodyHtml = renderReceivingTab(m);
  else if(currentDetailTab==='cutting') bodyHtml = renderCuttingTab(m);
  else if(currentDetailTab==='cost' && canFinance) bodyHtml = renderCostTab(m, cost);
  else if(currentDetailTab==='cost'){ currentDetailTab='overview'; bodyHtml = renderOverviewTab(m, cost); }
  else bodyHtml = renderStageLogTab(m, currentDetailTab);

  document.getElementById('view-detail').innerHTML = `
    <div class="back-btn" onclick="backToModels()">→ رجوع للموديلات</div>
    <div class="model-detail-header">
      <div>
        <h2>${escapeHtml(m.name)}</h2>
        <div style="font-size:12px; color:#8a8070; margin-top:4px;">
          استلام: ${fmt(receivedTotal)}/${fmt(expectedBoltsTotal)} ثوب &nbsp;•&nbsp;
          قص: ${fmt(getTotalCutQty(m))}/${fmt(m.expectedTotal)} قطعة
        </div>
      </div>
      ${canFinance ? `<div class="price-tag">${fmt(m.sellPrice)} ج / قطعة</div>` : ''}
    </div>
    ${tabsHtml}
    <div id="detailBody">${bodyHtml}</div>
  `;
}

function switchDetailTab(tab){ currentDetailTab = tab; renderModelDetail(); }

  const totalActualTime = logs.reduce((s,l)=>s+(Number(l.time)||0),0);
  const hourlyRate = sp.internal ? getDeptHourlyRate(sp.key) : null;
  const plannedCost = sp.internal ? hourlyRate*(Number(sp.expectedTime)||0) : (Number(sp.expectedCost)||0);

  return `
    <div class="panel">

      <p style="font-size:12px; color:#8a8070; margin-bottom:14px;">كل مرة تحصل فيها المرحلة دي، سجلها كسطر منفصل بالسعر والوقت الفعلي.</p>
      <div class="form-grid">
        <div class="field"><label>عدد القطع في الدفعة</label><input type="number" id="stage_qty" placeholder="200"></div>
        <div class="field"><label>التكلفة الفعلية (ج)</label><input type="number" id="stage_cost" placeholder="500"></div>

        <div class="field"><label>ملاحظة (اختياري)</label><input type="text" id="stage_note" placeholder="مثال: دفعة اللون الأحمر"></div>
      </div>
      <button class="btn brass" style="margin-top:12px;" onclick="addStageLog('${stageKey}')">تسجيل الدفعة</button>
    </div>

    <div class="panel">
      <h2><span class="title-txt">سجل الدفعات الفعلية</span><span class="badge ok">إجمالي: ${fmt(totalActualCost)} ج / ${fmt(totalActualTime)} س</span></h2>

      <table class="data-table">
        <thead><tr><th>التاريخ</th><th>عدد القطع</th><th>التكلفة</th><th>الوقت</th><th>ملاحظة</th><th></th></tr></thead>
        <tbody>
          ${logs.map(l=>`
            <tr>
              <td>${new Date(l.date).toLocaleDateString('ar-EG')}</td>
              <td>${fmt(l.qty)}</td><td>${fmt(l.cost)} ج</td><td>${fmt(l.time)} س</td>
              <td>${escapeHtml(l.note||'—')}</td>
              <td><button class="icon-btn" onclick="deleteStageLog('${stageKey}','${l.id}')">🗑</button></td>
            </tr>

        <tfoot><tr><td colspan="2">الإجمالي</td><td>${fmt(totalActualCost)} ج</td><td>${fmt(totalActualTime)} س</td><td colspan="2"></td></tr></tfoot>

function addStageLog(stageKey){
  const qty = Number(document.getElementById('stage_qty').value);
  const cost = Number(document.getElementById('stage_cost').value);
  const time = Number(document.getElementById('stage_time').value)||0;
  const note = document.getElementById('stage_note').value.trim();
  if(!qty || qty<=0){ toast('اكتب عدد القطع'); return; }
  if(cost===undefined || cost===null || isNaN(cost) || cost<0){ toast('اكتب التكلفة الفعلية'); return; }
  const m = getCurrentModel();
  if(!m.stageLogs[stageKey]) m.stageLogs[stageKey] = [];
  m.stageLogs[stageKey].push({id:uid(), date:Date.now(), qty, cost, time, note});
  saveState(); renderModelDetail(); toast('تم تسجيل الدفعة ✓');
}

function deleteStageLog(stageKey, logId){
  const m = getCurrentModel();
  m.stageLogs[stageKey] = m.stageLogs[stageKey].filter(l=>l.id!==logId);
  saveState(); renderModelDetail();
}

async function renderUsersView(){

  }catch(e){
    el.innerHTML = `<div class="locked-msg">تعذر تحميل قائمة المستخدمين</div>`;

    <div class="panel">

      ${!canEdit ? `<p class="hint">عرض فقط — مفيش صلاحية إضافة أو تعديل مستخدمين</p>` : `
      <div class="field"><label>الإيميل</label><input type="email" id="newUserEmail" placeholder="user@example.com"></div>
      <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="newUserPassword" placeholder="••••••••"></div>
      <div class="section-divider" style="font-size:11px;">الصلاحيات</div>
      ${window._PERMISSION_SECTIONS.map(s=>`
        <div class="perm-row">
          <span>${s.label}</span>
          <select id="newUserPerm_${s.key}">
            <option value="none">لا شيء</option>
            <option value="view">مشاهدة فقط</option>
            <option value="edit">مشاهدة وتعديل</option>
          </select>
        </div>
      `).join('')}
      <button class="btn brass" style="margin-top:14px;" onclick="createNewUser()">إنشاء المستخدم</button>
      `}
    </div>

    <div class="panel">
      <h2><span class="title-txt">📋 المستخدمين الحاليين (${usersList.length})</span></h2>
      ${usersList.map(u=>`
        <div class="section-divider">${escapeHtml(u.email)}</div>
        ${window._PERMISSION_SECTIONS.map(s=>{
          const val = (u.permissions && u.permissions[s.key]) || 'none';
          return `<div class="perm-row">
            <span>${s.label}</span>
            ${canEdit ? `
              <select id="permEdit_${u.uid}_${s.key}" onchange="updateUserPermission('${u.uid}','${s.key}',this.value)">
                <option value="none" ${val==='none'?'selected':''}>لا شيء</option>
                <option value="view" ${val==='view'?'selected':''}>مشاهدة فقط</option>

              </select>
            ` : `<span class="hint">${val==='none'?'لا شيء':val==='view'?'مشاهدة فقط':'مشاهدة وتعديل'}</span>`}
          </div>`;
        }).join('')}
      `).join('')}
